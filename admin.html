<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一起種田吧｜營運後台</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--ink:#3A3226;--ink2:#7A6E5D;--line:#E9E1D3;--green:#3BB273;--green-d:#2E9660;--orange:#FF9F43;--red:#F2545B;--bg:#F4F7EF}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:0}
header{background:#2E3B2A;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
header .who{font-size:13px;opacity:.85}
header a{color:#BDE6A8;font-size:13px}
nav{display:flex;gap:4px;padding:10px 14px 0;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line)}
nav button{background:none;padding:10px 14px;font-weight:700;font-size:14px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--green-d);border-color:var(--green)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat .n{font-size:26px;font-weight:900;color:var(--green-d)}
.stat .l{font-size:12px;color:var(--ink2);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--ink2);font-size:12px;font-weight:700;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover{background:#F8FBF4}
input,select,textarea{font-family:inherit;font-size:14px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--green)}
input.num{width:84px}
textarea{width:100%;min-height:90px}
.btn{background:var(--green);color:#fff;font-weight:700;padding:8px 14px;border-radius:8px;font-size:14px}
.btn.o{background:var(--orange)}.btn.r{background:var(--red)}.btn.g{background:#E9E4DA;color:var(--ink)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;background:#EEF6E8;color:var(--green-d)}
.tag.r{background:#FDECEC;color:#C93D44}.tag.o{background:#FFF1DC;color:#D97A12}
.muted{color:var(--ink2);font-size:12px}
.plots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.plot{background:var(--bg);border-radius:8px;padding:6px;font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3A3226;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center}
.login{background:#fff;padding:26px;border-radius:16px;width:340px;text-align:center}
.login input{width:100%;margin-bottom:10px}
.log{font-size:12px;font-family:ui-monospace,monospace;color:var(--ink2);white-space:pre-wrap;word-break:break-all}
.cl h3{margin:0;font-size:15px}.cl p{margin:4px 0 0;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<header><h1>🌱 一起種田吧｜營運後台</h1><span class="who" id="who"></span><a href="./" target="_blank">開啟遊戲</a></header>
<nav id="nav" style="display:none">
  <button data-t="ov" class="on">總覽</button><button data-t="pl">玩家管理</button><button data-t="nt">公告</button>
  <button data-t="cf">遊戲數值</button><button data-t="cl">更新紀錄</button><button data-t="lg">操作紀錄</button>
</nav>
<main id="main"><div class="center"><div class="muted">讀取中…</div></div></main>
<div class="toast" id="toast"></div>

<script src="supabase.js"></script>
<script>
const sb = window.supabase.createClient('https://qnxnuyfvkrvhnaewvrik.supabase.co','sb_publishable_nX97hqqEgiGRwKQMOz56ow_uvMEAdht');
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tT; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),2200); }
async function rpc(fn, args){ const {data,error} = await sb.rpc(fn, args||{}); if(error) throw new Error(error.message); return data; }
const dt = ms => ms ? new Date(ms).toLocaleString('zh-TW',{hour12:false}) : '—';
const ago = ms => { if(!ms) return '從未'; const s=(Date.now()-ms)/1000; if(s<120) return '剛剛'; if(s<3600) return Math.floor(s/60)+' 分鐘前'; if(s<86400) return Math.floor(s/3600)+' 小時前'; return Math.floor(s/86400)+' 天前'; };
const KIND = {steal:'偷菜',help_weed:'幫除草',help_bug:'幫除蟲',help_water:'幫澆水',prank_weed:'放草',prank_bug:'放蟲'};
const ACT = {give:'補發',ban:'停權',unban:'解除停權',notice:'公告',setting:'改設定',crop:'改作物',land:'改開墾'};
let CROPN = {};
let tab = 'ov';

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return showLogin();
  let ok=false; try{ ok = await rpc('adm_check'); }catch(e){}
  if(!ok){ $('main').innerHTML = `<div class="center"><div class="login"><h2>沒有管理員權限</h2><p class="muted">目前登入：${esc(session.user.email)}</p><button class="btn g" id="lo">登出</button></div></div>`; $('lo').onclick=async()=>{await sb.auth.signOut(); location.reload();}; return; }
  $('who').innerHTML = `${esc(session.user.email)}　<a href="#" id="lo">登出</a>`; $('lo').onclick=async e=>{e.preventDefault(); await sb.auth.signOut(); location.reload();};
  $('nav').style.display='flex';
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  try{ const c = await rpc('farm_config'); c.crops.forEach(x=>CROPN[x.id]=x.name); }catch(e){}
  go('ov');
}
function showLogin(){
  $('main').innerHTML = `<div class="center"><div class="login"><h2>管理員登入</h2>
    <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="密碼">
    <button class="btn" id="li" style="width:100%">登入</button>
    <div style="margin:12px 0" class="muted">或</div>
    <button class="btn g" id="gl" style="width:100%">用 Google 帳號登入</button></div></div>`;
  $('li').onclick = async()=>{ const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value}); if(error) return toast('登入失敗：'+error.message); location.reload(); };
  $('gl').onclick = ()=>sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin+location.pathname}});
}
function go(t){ tab=t; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===t)); ({ov:pageOv,pl:pagePl,nt:pageNt,cf:pageCf,cl:pageCl,lg:pageLg})[t](); }
const M = h => $('main').innerHTML = h;

/* 總覽 */
async function pageOv(){
  M('<div class="muted">讀取中…</div>');
  const o = await rpc('adm_overview');
  const st = (n,l)=>`<div class="stat"><div class="n">${Number(n).toLocaleString()}</div><div class="l">${l}</div></div>`;
  const maxN = Math.max(1, ...o.lv_dist.map(x=>x.n));
  M(`<div class="card"><h2>今日概況</h2><div class="grid">
    ${st(o.players,'總玩家數')}${st(o.new_today,'今日新註冊')}${st(o.active_today,'今日上線')}${st(o.active_7d,'7 天內上線')}
    ${st(o.steals_today,'今日偷菜次數')}${st(o.friendships,'好友配對數')}${st(o.banned,'停權人數')}${st(o.gems_total,'全服鑽石總數')}</div></div>
    <div class="card"><h2>等級分布</h2>${o.lv_dist.map(x=>`<div class="row"><span style="width:50px" class="muted">Lv${x.lv}</span><div style="height:14px;border-radius:7px;background:var(--green);width:${Math.max(4,x.n/maxN*70)}%"></div><b>${x.n}</b></div>`).join('')}</div>`);
}

/* 玩家管理 */
async function pagePl(q){
  M(`<div class="card"><div class="row"><input id="q" placeholder="搜尋暱稱或 Email" value="${esc(q||'')}" style="flex:1;min-width:200px"><button class="btn" id="qs">搜尋</button></div><div id="plist" class="muted">讀取中…</div></div><div id="pdet"></div>`);
  $('qs').onclick = ()=>pagePl($('q').value.trim()); $('q').onkeydown = e=>{ if(e.key==='Enter') pagePl($('q').value.trim()); };
  const L = await rpc('adm_players', {q:q||''});
  $('plist').innerHTML = L.length ? `<table><tr><th>暱稱</th><th>Email</th><th>等級</th><th>金幣</th><th>鑽石</th><th>最後上線</th><th>狀態</th></tr>${L.map(p=>`<tr class="click" data-id="${p.id}">
    <td><b>${esc(p.nickname)}</b></td><td>${esc(p.email)} <span class="tag">${p.provider==='google'?'Google':'Email'}</span></td><td>Lv${p.lv}</td><td>${p.gold}</td><td>${p.gems}</td><td>${ago(p.seen)}</td>
    <td>${p.banned?'<span class="tag r">停權</span>':'<span class="tag">正常</span>'}</td></tr>`).join('')}</table>` : '找不到玩家';
  document.querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>showPlayer(r.dataset.id));
}
async function showPlayer(id, data){
  const p = data || await rpc('adm_player', {p_id:id});
  const plots = p.plots.map(x=>`<div class="plot">${x.i+1}. ${x.s==='wild'?'荒地':x.s==='empty'?'空地':x.s==='dead'?'枯萎':esc(CROPN[x.c]||x.c)}${x.s==='grow'?`<br><span class="muted">${Math.round(x.g)}秒 草${x.w} 蟲${x.b} 被偷${x.st}</span>`:''}</div>`).join('');
  const kv = o => Object.entries(o||{}).map(([k,v])=>`${esc(CROPN[k]||k)}×${v}`).join('、') || '無';
  $('pdet').innerHTML = `<div class="card"><h2>${esc(p.nickname)} <span class="tag">Lv${p.lv}</span> ${p.banned?`<span class="tag r">停權中：${esc(p.ban_reason||'')}</span>`:''}</h2>
    <div class="muted">${esc(p.email)}｜註冊 ${dt(p.created)}｜最後上線 ${ago(p.seen)}｜好友 ${p.friends} 位｜累計偷到 ${p.stolen_by_me} 個</div>
    <p>經驗 ${p.exp}｜金幣 <b>${p.gold}</b>｜鑽石 <b>${p.gems}</b><br>種子：${kv(p.seeds)}<br>倉庫：${kv(p.crops)}</p>
    <div class="plots">${plots}</div></div>
    <div class="card"><h2>補發／扣回（填負數就是扣）</h2>
      <div class="row">金幣 <input class="num" id="gGold" type="number" value="0"> 經驗 <input class="num" id="gExp" type="number" value="0" min="0"> 鑽石 <input class="num" id="gGems" type="number" value="0"></div>
      <div class="row">種子 <select id="gCrop"><option value="">（不發種子）</option>${Object.entries(CROPN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select> 數量 <input class="num" id="gSeeds" type="number" value="0"></div>
      <div class="row"><input id="gWhy" placeholder="原因（會記在操作紀錄）" style="flex:1"><button class="btn o" id="gGo">送出</button></div></div>
    <div class="card"><h2>停權</h2><div class="row">${p.banned?`<button class="btn" id="unban">解除停權</button>`:`<input id="bWhy" placeholder="停權原因（玩家會看到）" style="flex:1"><button class="btn r" id="ban">停權</button>`}</div></div>
    <div class="card"><h2>最近被互動紀錄</h2>${p.logs.length?`<table>${p.logs.map(l=>`<tr><td>${dt(l.at)}</td><td>${esc(l.who)}</td><td>${KIND[l.kind]||l.kind}</td><td>${esc(CROPN[l.crop]||l.crop||'')} ${l.qty?'×'+l.qty:''}</td></tr>`).join('')}</table>`:'<span class="muted">沒有紀錄</span>'}</div>`;
  $('pdet').scrollIntoView({behavior:'smooth'});
  $('gGo').onclick = async()=>{
    const a = {p_id:p.id, p_gold:+$('gGold').value||0, p_exp:+$('gExp').value||0, p_gems:+$('gGems').value||0, p_crop:$('gCrop').value||null, p_seeds:+$('gSeeds').value||0, p_reason:$('gWhy').value||null};
    if(!a.p_gold && !a.p_exp && !a.p_gems && !(a.p_crop && a.p_seeds)) return toast('沒有填任何數量');
    if(!confirm(`確定對 ${p.nickname} 補發／扣回？`)) return;
    try{ showPlayer(p.id, await rpc('adm_give', a)); toast('已送出'); }catch(e){ toast(e.message); }
  };
  if($('ban')) $('ban').onclick = async()=>{ if(!confirm(`確定停權 ${p.nickname}？`)) return; try{ showPlayer(p.id, await rpc('adm_ban',{p_id:p.id,p_ban:true,p_reason:$('bWhy').value||null})); toast('已停權'); }catch(e){ toast(e.message); } };
  if($('unban')) $('unban').onclick = async()=>{ try{ showPlayer(p.id, await rpc('adm_ban',{p_id:p.id,p_ban:false,p_reason:null})); toast('已解除停權'); }catch(e){ toast(e.message); } };
}

/* 公告 */
async function pageNt(){
  const L = await rpc('adm_notices');
  M(`<div class="card"><h2>新增公告</h2><div class="row"><input id="nT" placeholder="標題" style="flex:1"></div><textarea id="nB" placeholder="內容（玩家登入時會跳出來）"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="nS">發布</button></div></div>
    <div class="card"><h2>公告列表</h2>${L.length?L.map(n=>`<div class="row" style="border-bottom:1px solid var(--line);padding-bottom:8px">
      <div style="flex:1"><b>${esc(n.title)}</b> ${n.active?'<span class="tag">顯示中</span>':'<span class="tag o">已下架</span>'}<div class="muted">${dt(n.at)}</div><div style="font-size:13px;white-space:pre-wrap">${esc(n.body)}</div></div>
      <button class="btn g" data-tg="${n.id}" data-a="${n.active?0:1}">${n.active?'下架':'重新上架'}</button></div>`).join(''):'<span class="muted">還沒有公告</span>'}</div>`);
  $('nS').onclick = async()=>{ try{ await rpc('adm_notice_save',{p_id:null,p_title:$('nT').value,p_body:$('nB').value,p_active:true}); toast('已發布'); pageNt(); }catch(e){ toast(e.message); } };
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{ const n=L.find(x=>x.id==b.dataset.tg); try{ await rpc('adm_notice_save',{p_id:n.id,p_title:n.title,p_body:n.body,p_active:b.dataset.a==='1'}); pageNt(); }catch(e){ toast(e.message); } });
}

/* 遊戲數值 */
async function pageCf(){
  const C = await rpc('adm_config');
  M(`<div class="card"><h2>玩法設定</h2><table>${C.settings.map(s=>`<tr><td><b>${esc(s.note||s.key)}</b><div class="muted">${s.key}</div></td><td><input class="num" id="s_${s.key}" type="number" step="any" value="${s.value}"></td><td><button class="btn" data-sk="${s.key}">儲存</button></td></tr>`).join('')}</table></div>
    <div class="card"><h2>作物數值</h2><div class="muted" style="margin-bottom:8px">成熟時間單位是「秒」。改完按該列的儲存，玩家重新整理後就會套用。</div>
    <table><tr><th>作物</th><th>解鎖等級</th><th>種子價</th><th>成熟秒數</th><th>收成數</th><th>單價</th><th>經驗</th><th></th></tr>
    ${C.crops.map(c=>`<tr><td><b>${esc(c.name)}</b></td>${['lv','seed','grow_sec','yield','price','exp'].map(f=>`<td><input class="num" id="c_${c.id}_${f}" type="number" value="${c[f]}"></td>`).join('')}<td><button class="btn" data-cid="${c.id}">儲存</button></td></tr>`).join('')}</table></div>
    <div class="card"><h2>開墾條件</h2><table><tr><th>第幾塊</th><th>需要等級</th><th>費用</th><th></th></tr>
    ${C.land.map(l=>`<tr><td>第 ${l.idx+1} 塊</td><td><input class="num" id="l_${l.idx}_lv" type="number" value="${l.lv}"></td><td><input class="num" id="l_${l.idx}_cost" type="number" value="${l.cost}"></td><td><button class="btn" data-li="${l.idx}">儲存</button></td></tr>`).join('')}</table></div>
    <div class="card"><h2>萌獸裝備</h2><div class="muted" style="margin-bottom:8px">數值：自動澆水／播種／剷除＝第 1～N 塊地；看門狗／除蟲／除草／稻草人＝機率（0.5＝50%）；自動收成＝成熟後幾分鐘。金幣價留空＝不能用金幣買；鑽石價留空＝不能用鑽石買。</div>
    <table><tr><th>裝備</th><th>功能</th><th>名稱</th><th>數值</th><th>金幣價</th><th>鑽石價</th><th>金幣購買等級</th><th></th></tr>
    ${(C.gear||[]).map(g=>`<tr><td><img src="assets/${g.icon}.webp" style="width:34px;height:34px;object-fit:contain;vertical-align:middle"> ${['','I','II','III','IV'][g.tier]}</td><td>${({plant:'自動播種',water:'自動澆水',dog:'看門狗',bug:'自動除蟲',weed:'自動除草',clear:'自動剷除',harvest:'自動收成',scare:'稻草人'})[g.func]}</td>
      <td><input id="g_${g.id}_name" value="${esc(g.name)}" style="width:7em"></td><td><input class="num" id="g_${g.id}_val" type="number" step="any" value="${g.val}"></td>
      <td><input class="num" id="g_${g.id}_gold" type="number" value="${g.gold??''}"></td><td><input class="num" id="g_${g.id}_gems" type="number" value="${g.gems??''}"></td>
      <td><input class="num" id="g_${g.id}_lv" type="number" value="${g.lv}"></td><td><button class="btn" data-gid="${g.id}">儲存</button></td></tr>`).join('')}</table></div>
    <div class="card"><h2>建築外觀</h2><div class="muted" style="margin-bottom:8px">金幣價和鑽石價擇一填；兩個都留空＝不能購買。</div>
    <table><tr><th>外觀</th><th>建築</th><th>名稱</th><th>金幣價</th><th>鑽石價</th><th></th></tr>
    ${(C.skins||[]).map(k=>`<tr><td><img src="assets/th_${k.style}_${({home:'academy',barn:'farm',shop:'shop',fountain:'fountain',pen:'play',decor:'forge'})[k.bld]}.webp" style="width:40px;height:40px;object-fit:contain"></td><td>${({home:'我的家',barn:'穀倉',shop:'種子商店',fountain:'噴水池',pen:'萌獸園',decor:'裝飾店'})[k.bld]}</td>
      <td><input id="k_${k.id}_name" value="${esc(k.name)}" style="width:6em"></td><td><input class="num" id="k_${k.id}_gold" type="number" value="${k.gold??''}"></td><td><input class="num" id="k_${k.id}_gems" type="number" value="${k.gems??''}"></td><td><button class="btn" data-kid="${k.id}">儲存</button></td></tr>`).join('')}</table></div>`);
  document.querySelectorAll('[data-sk]').forEach(b=>b.onclick=async()=>{ try{ await rpc('adm_setting_set',{p_key:b.dataset.sk,p_value:+$('s_'+b.dataset.sk).value}); toast('已儲存'); }catch(e){ toast(e.message); } });
  document.querySelectorAll('[data-cid]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.cid, v=f=>+$(`c_${id}_${f}`).value;
    try{ await rpc('adm_crop_save',{p_id:id,p_seed:v('seed'),p_grow_sec:v('grow_sec'),p_yield:v('yield'),p_price:v('price'),p_exp:v('exp'),p_lv:v('lv')}); toast('已儲存'); }catch(e){ toast(e.message); } });
  document.querySelectorAll('[data-kid]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.kid, v=f=>$(`k_${id}_${f}`).value, n=f=>v(f)===''?null:+v(f);
    try{ await rpc('adm_skin_save',{p_id:id,p_name:v('name'),p_gold:n('gold'),p_gems:n('gems')}); toast('已儲存'); }catch(e){ toast(e.message); } });
  document.querySelectorAll('[data-gid]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.gid, v=f=>$(`g_${id}_${f}`).value, n=f=>v(f)===''?null:+v(f);
    try{ await rpc('adm_gear_save',{p_id:id,p_name:v('name'),p_val:+v('val'),p_gold:n('gold'),p_gems:n('gems'),p_lv:+v('lv')}); toast('已儲存'); }catch(e){ toast(e.message); } });
  document.querySelectorAll('[data-li]').forEach(b=>b.onclick=async()=>{ const i=b.dataset.li;
    try{ await rpc('adm_land_save',{p_idx:+i,p_lv:+$(`l_${i}_lv`).value,p_cost:+$(`l_${i}_cost`).value}); toast('已儲存'); }catch(e){ toast(e.message); } });
}

/* 更新紀錄 */
async function pageCl(){
  const L = await rpc('adm_changelog');
  M(`<div class="card"><h2>更新紀錄</h2>${L.map(c=>`<div class="cl" style="border-bottom:1px solid var(--line);padding:10px 0"><h3>${esc(c.title)}</h3><div class="muted">${dt(c.at)}</div><p>${esc(c.body)}</p></div>`).join('')||'<span class="muted">沒有紀錄</span>'}</div>`);
}

/* 操作紀錄 */
async function pageLg(){
  const L = await rpc('adm_logs');
  M(`<div class="card"><h2>後台操作紀錄（最近 100 筆）</h2>${L.length?`<table><tr><th>時間</th><th>管理員</th><th>動作</th><th>內容</th></tr>${L.map(l=>`<tr><td style="white-space:nowrap">${dt(l.at)}</td><td>${esc(l.admin||'')}</td><td>${ACT[l.action]||l.action}</td><td class="log">${esc(JSON.stringify(l.detail))}</td></tr>`).join('')}</table>`:'<span class="muted">還沒有操作紀錄</span>'}</div>`);
}

boot();
</script>
</body>
</html>
