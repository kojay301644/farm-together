<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一起種田吧｜營運後台</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--ink:#3A3226;--ink2:#7A6E5D;--line:#E9E1D3;--green:#3BB273;--green-d:#2E9660;--orange:#FF9F43;--red:#F2545B;--bg:#F4F7EF}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:0}
header{background:#2E3B2A;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
header .who{font-size:13px;opacity:.85}
header a{color:#BDE6A8;font-size:13px}
nav{display:flex;gap:4px;padding:10px 14px 0;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line)}
nav button{background:none;padding:10px 14px;font-weight:700;font-size:14px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--green-d);border-color:var(--green)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat .n{font-size:26px;font-weight:900;color:var(--green-d)}
.stat .l{font-size:12px;color:var(--ink2);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--ink2);font-size:12px;font-weight:700;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover{background:#F8FBF4}
input,select,textarea{font-family:inherit;font-size:14px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--green)}
input.num{width:84px}
textarea{width:100%;min-height:90px}
.btn{background:var(--green);color:#fff;font-weight:700;padding:8px 14px;border-radius:8px;font-size:14px}
.btn.o{background:var(--orange)}.btn.r{background:var(--red)}.btn.g{background:#E9E4DA;color:var(--ink)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.nbad{background:#E5484D;color:#fff;border-radius:9px;padding:0 6px;font-size:11px}.nbad:empty{display:none}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;background:#EEF6E8;color:var(--green-d)}
.tag.r{background:#FDECEC;color:#C93D44}.tag.o{background:#FFF1DC;color:#D97A12}
.muted{color:var(--ink2);font-size:12px}
.plots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.plot{background:var(--bg);border-radius:8px;padding:6px;font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3A3226;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.savebar{position:sticky;top:52px;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FFFDF6;border:2px solid #E6D9C3;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.06)}
#saveAll.hot{background:#F2994A;box-shadow:0 0 0 3px rgba(242,153,74,.3)}
tr[data-dirty] td{background:#FFF4CC}.card[data-dirty]{outline:3px solid #FFD66B}
button.ok{background:#3BB273!important;color:#fff!important}button.bad{background:#E5484D!important;color:#fff!important}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center}
.login{background:#fff;padding:26px;border-radius:16px;width:340px;text-align:center}
.login input{width:100%;margin-bottom:10px}
.log{font-size:12px;font-family:ui-monospace,monospace;color:var(--ink2);white-space:pre-wrap;word-break:break-all}
.cl h3{margin:0;font-size:15px}.cl p{margin:4px 0 0;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<header><h1>🌱 一起種田吧｜營運後台</h1><span class="who" id="who"></span><a href="./" target="_blank">開啟遊戲</a></header>
<nav id="nav" style="display:none">
  <button data-t="ov" class="on">總覽</button><button data-t="rp">🐞 回報 <span class="nbad" id="rpBad"></span></button><button data-t="pl">玩家管理</button><button data-t="cs">🎰 娛樂廳</button><button data-t="nt">公告</button>
  <button data-t="cf">遊戲數值</button><button data-t="cl">更新紀錄</button><button data-t="gf">發獎／兌換碼</button><button data-t="ev">活動／維護</button><button data-t="bt">電腦玩家</button><button data-t="lg">操作紀錄</button>
</nav>
<main id="main"><div class="center"><div class="muted">讀取中…</div></div></main>
<div class="toast" id="toast"></div>

<script src="supabase.js"></script>
<script>
const sb = window.supabase.createClient('https://qnxnuyfvkrvhnaewvrik.supabase.co','sb_publishable_nX97hqqEgiGRwKQMOz56ow_uvMEAdht');
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tT; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),2200); }
async function rpc(fn, args){ const {data,error} = await sb.rpc(fn, args||{}); if(error) throw new Error(error.message); return data; }
const dt = ms => ms ? new Date(ms).toLocaleString('zh-TW',{hour12:false}) : '—';
const ago = ms => { if(!ms) return '從未'; const s=(Date.now()-ms)/1000; if(s<120) return '剛剛'; if(s<3600) return Math.floor(s/60)+' 分鐘前'; if(s<86400) return Math.floor(s/3600)+' 小時前'; return Math.floor(s/86400)+' 天前'; };
const KIND = {steal:'偷菜',help_weed:'幫除草',help_bug:'幫除蟲',help_water:'幫澆水',prank_weed:'放草',prank_bug:'放蟲'};
const ACT = {give:'補發',ban:'停權',unban:'解除停權',notice:'公告',setting:'改設定',crop:'改作物',land:'改開墾'};
let CROPN = {}, CFG = {};
let tab = 'ov';

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return showLogin();
  let ok=false; try{ ok = await rpc('adm_check'); }catch(e){}
  if(!ok){ $('main').innerHTML = `<div class="center"><div class="login"><h2>沒有管理員權限</h2><p class="muted">目前登入：${esc(session.user.email)}</p><button class="btn g" id="lo">登出</button></div></div>`; $('lo').onclick=async()=>{await sb.auth.signOut(); location.reload();}; return; }
  $('who').innerHTML = `${esc(session.user.email)}　<a href="#" id="lo">登出</a>`; $('lo').onclick=async e=>{e.preventDefault(); await sb.auth.signOut(); location.reload();};
  $('nav').style.display='flex';
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  try{ const c = await rpc('farm_config'); CFG=c; c.crops.forEach(x=>CROPN[x.id]=x.name); }catch(e){}
  go('ov'); rpBadge(); setInterval(rpBadge, 60000);
}
/* ================= 玩家回報 ================= */
const RPK = {bug:'🐞 遊戲錯誤',idea:'💡 建議',pay:'💎 儲值問題',abuse:'🚨 檢舉玩家',other:'💬 其他',crash:'💥 自動錯誤'};
const RPS = {new:'🕐 未處理',doing:'🔧 處理中',done:'✅ 已解決'};
let rpFilter = 'new', rpAuto = false;
async function rpBadge(){ try{ const r = await rpc('adm_reports', {p_status:'new', p_auto:false}); const n=r.counts.new; $('rpBad').textContent = n ? n : ''; }catch(e){} }
async function pageRp(){
  M(`<div class="card"><div class="muted">讀取中…</div></div>`);
  let R; try{ R = await rpc('adm_reports', {p_status: rpAuto ? null : (rpFilter||null), p_auto: rpAuto}); }catch(e){ return M(`<div class="card">讀取失敗：${esc(e.message)}</div>`); }
  const c = R.counts; $('rpBad').textContent = c.new ? c.new : '';
  const tabs = `<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">
    ${[['new',`🕐 未處理（${c.new}）`],['doing',`🔧 處理中（${c.doing}）`],['done','✅ 已解決'],['','全部']].map(([k,t])=>`<button class="btn ${!rpAuto&&rpFilter===k?'':'g'}" data-rf="${k}">${t}</button>`).join('')}
    <button class="btn ${rpAuto?'':'g'}" data-ra="1">💥 自動錯誤紀錄（24 小時 ${c.crash24} 筆）</button></div>`;
  const rows = R.list.map(r=>{ const m=r.meta||{};
    return `<div class="card rp"><div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><b>${RPK[r.kind]||esc(r.kind)}</b><span class="tag">${RPS[r.status]||r.status}</span>
      <a href="#" data-pid="${r.uid}">${esc(r.nick||'（已刪除）')}</a><span class="muted">${dt(r.at)}</span></div>
      <div style="white-space:pre-wrap;margin:8px 0;font-size:15px">${esc(r.body)}</div>
      ${r.img?`<a href="${esc(r.img)}" target="_blank"><img src="${esc(r.img)}" style="max-width:220px;max-height:220px;border-radius:8px;border:1px solid #ddd"></a>`:''}
      <details style="margin:6px 0"><summary class="muted">裝置與錯誤資料</summary><div class="muted" style="font-size:12px;line-height:1.6">
        裝置：${esc(m.dev||'')}（${esc(m.app||'')}，${esc(m.size||'')}）・Lv${esc(m.lv||'')}・版本 ${esc(m.build||'')}<br>畫面：${esc(m.screen||'')}<br>${esc(m.ua||'')}
        ${(m.errs||[]).length?`<br><b>最近錯誤：</b><br>${m.errs.map(e=>`${esc(e.t)}　${esc(e.m)}`).join('<br>')}`:''}</div></details>
      ${rpAuto ? '' : `<textarea id="rr_${r.id}" placeholder="回覆玩家（會推播通知）" style="width:100%;min-height:60px">${esc(r.reply||'')}</textarea>
      <div class="row" style="gap:6px;margin-top:6px">${['doing','done'].map(s=>`<button class="btn ${s==='done'?'':'g'}" data-rs="${r.id}|${s}">${s==='done'?'✅ 回覆並標為已解決':'🔧 回覆並標為處理中'}</button>`).join('')}
      ${r.status!=='new'?`<button class="btn g" data-rs="${r.id}|new">改回未處理</button>`:''}${r.rat?`<span class="muted">已回覆 ${dt(r.rat)}</span>`:''}</div>`}</div>`; }).join('');
  M(`<div class="card"><h2>🐞 玩家回報</h2>${tabs}<div class="muted">「自動錯誤紀錄」是遊戲發生程式錯誤時自動送上來的，同一個人同樣的錯誤 1 小時只記 1 次。</div></div>${rows || '<div class="card muted">沒有資料</div>'}`);
  document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{ rpFilter=b.dataset.rf; rpAuto=false; pageRp(); });
  document.querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{ rpAuto=true; pageRp(); });
  document.querySelectorAll('[data-pid]').forEach(a=>a.onclick=e=>{ e.preventDefault(); if(a.dataset.pid && a.dataset.pid!=='null'){ showPlayer(a.dataset.pid); } });
  document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{ const [id,st]=b.dataset.rs.split('|'); const ta=$('rr_'+id);
    try{ await rpc('adm_report_set', {p_id:+id, p_status:st, p_reply: ta ? ta.value : null}); toast('已更新'); pageRp(); }catch(e){ toast(e.message); } });
}
// ---------- 娛樂廳輸贏紀錄 ----------
const CSG = { mj:'🀄 麻將', b2:'🃏 大老二', bc:'🎴 百家樂' }, CS_BIG = 100000;
let csDays = 1, csGame = '', csQ = '';
const csAmt = v => `<b style="color:${v>0?'#1E9E55':v<0?'#D3403A':'#666'}">${v>0?'+':''}${(v||0).toLocaleString()}</b>`;
async function pageCs(){
  M(`<div class="card"><div class="muted">讀取中…</div></div>`);
  let R; try{ R = await rpc('adm_casino', { p_days: csDays, p_game: csGame || null, p_q: csQ || null }); }catch(e){ return M(`<div class="card">讀取失敗：${esc(e.message)}</div>`); }
  const btn = (on, attr, t) => `<button class="btn ${on?'':'g'}" ${attr}>${t}</button>`;
  const filt = `<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:8px">${[[1,'今天'],[7,'7 天'],[30,'30 天'],[0,'全部']].map(([d,t])=>btn(csDays===d,`data-cd="${d}"`,t)).join('')}
    <span style="width:12px"></span>${[['','全部遊戲'],['mj',CSG.mj],['b2',CSG.b2],['bc',CSG.bc]].map(([g,t])=>btn(csGame===g,`data-cg="${g}"`,t)).join('')}</div>`;
  const sum = R.summary.length ? `<table class="tb"><tr><th>遊戲</th><th>局數</th><th>玩家總輸贏</th><th>娛樂廳收入</th></tr>${R.summary.map(x=>`<tr><td>${CSG[x.game]||esc(x.game)}</td><td>${x.hands.toLocaleString()}</td><td>${csAmt(x.net)}</td><td>${csAmt(x.house)}</td></tr>`).join('')}
    <tr><td><b>合計</b></td><td>${R.summary.reduce((a,x)=>a+x.hands,0).toLocaleString()}</td><td>${csAmt(R.summary.reduce((a,x)=>a+x.net,0))}</td><td>${csAmt(R.summary.reduce((a,x)=>a+x.house,0))}</td></tr></table>
    <div class="muted" style="margin-top:6px">娛樂廳收入：麻將、大老二是 5% 場地費；百家樂是莊家（系統）的賺賠。這兩欄從 ${'2026/11/12'} 之後才開始記，之前的局只有玩家輸贏。</div>` : '<div class="muted">這段時間沒有紀錄</div>';
  const rank = (L, k) => L.length ? `<table class="tb"><tr><th>#</th><th>玩家</th><th>總輸贏</th><th>局數</th><th>${k==='best'?'單局最多贏':'單局最多輸'}</th></tr>${L.map((x,i)=>`<tr><td>${i+1}</td><td><a href="#" data-cp="${x.uid}">${esc(x.nick||'')}</a></td><td>${csAmt(x.net)}</td><td>${x.n}</td><td>${csAmt(x[k])}</td></tr>`).join('')}</table>` : '<div class="muted">沒有</div>';
  const recent = R.recent.length ? `<table class="tb"><tr><th>時間</th><th>遊戲</th><th>桌／局</th><th>玩家</th><th>輸贏</th></tr>${R.recent.map(x=>`<tr${Math.abs(x.amt)>=CS_BIG?' style="background:#FFE9E9"':''}><td>${dt(x.at)}</td><td>${CSG[x.game]||esc(x.game)}</td><td>#${x.tid}／${x.hand}</td><td><a href="#" data-cp="${x.uid}">${esc(x.nick||'')}</a></td><td>${csAmt(x.amt)}${Math.abs(x.amt)>=CS_BIG?' ⚠️':''}</td></tr>`).join('')}</table>` : '<div class="muted">沒有紀錄</div>';
  M(`<div class="card"><h2>🎰 娛樂廳輸贏</h2>${filt}${sum}</div>
    <div class="row" style="gap:12px;align-items:flex-start;flex-wrap:wrap"><div class="card" style="flex:1;min-width:300px"><h2>🏆 贏最多</h2>${rank(R.winners,'best')}</div><div class="card" style="flex:1;min-width:300px"><h2>💸 輸最多</h2>${rank(R.losers,'worst')}</div></div>
    <div class="card"><h2>📜 最近紀錄</h2><div class="row" style="gap:6px;margin-bottom:8px"><input id="csQ" placeholder="搜尋玩家名字" value="${esc(csQ)}"><button class="btn" id="csGo">搜尋</button></div>
      <div class="muted" style="margin-bottom:6px">單局輸贏超過 ${CS_BIG.toLocaleString()} 會標紅 ⚠️</div>${recent}</div>`);
  document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{ csDays=+b.dataset.cd; pageCs(); });
  document.querySelectorAll('[data-cg]').forEach(b=>b.onclick=()=>{ csGame=b.dataset.cg; pageCs(); });
  $('csGo').onclick = ()=>{ csQ = $('csQ').value.trim(); pageCs(); };
  $('csQ').onkeydown = e=>{ if(e.key==='Enter') $('csGo').click(); };
  document.querySelectorAll('[data-cp]').forEach(a=>a.onclick=e=>{ e.preventDefault(); csPlayer(a.dataset.cp); });
}
async function csPlayer(id){
  M(`<div class="card"><div class="muted">讀取中…</div></div>`);
  let P; try{ P = await rpc('adm_casino_player', { p_id: id }); }catch(e){ return M(`<div class="card">讀取失敗：${esc(e.message)}</div>`); }
  M(`<div class="card"><button class="btn g" id="csBack">← 返回</button> <button class="btn g" id="csPl">看玩家資料</button><h2 style="margin-top:10px">🎰 ${esc(P.nick||'')} 的娛樂廳紀錄</h2>
    <table class="tb"><tr><th>遊戲</th><th>局數</th><th>總輸贏</th></tr>${P.by_game.map(x=>`<tr><td>${CSG[x.game]||esc(x.game)}</td><td>${x.n}</td><td>${csAmt(x.net)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">沒有紀錄</td></tr>'}</table></div>
    <div class="card"><h2>每一局（最近 200 局）</h2><table class="tb"><tr><th>時間</th><th>遊戲</th><th>桌／局</th><th>輸贏</th></tr>${P.list.map(x=>`<tr${Math.abs(x.amt)>=CS_BIG?' style="background:#FFE9E9"':''}><td>${dt(x.at)}</td><td>${CSG[x.game]||esc(x.game)}</td><td>#${x.tid}／${x.hand}</td><td>${csAmt(x.amt)}</td></tr>`).join('')}</table></div>`);
  $('csBack').onclick = pageCs; $('csPl').onclick = ()=>showPlayer(id);
}
function showLogin(){
  $('main').innerHTML = `<div class="center"><div class="login"><h2>管理員登入</h2>
    <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="密碼">
    <button class="btn" id="li" style="width:100%">登入</button>
    <div style="margin:12px 0" class="muted">或</div>
    <button class="btn g" id="gl" style="width:100%">用 Google 帳號登入</button></div></div>`;
  $('li').onclick = async()=>{ const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value}); if(error) return toast('登入失敗：'+error.message); location.reload(); };
  $('gl').onclick = ()=>sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin+location.pathname}});
}
function go(t){ tab=t; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===t)); ({rp:pageRp,cs:pageCs,ov:pageOv,pl:pagePl,nt:pageNt,cf:pageCf,cl:pageCl,gf:pageGf,ev:pageEv,bt:pageBt,lg:pageLg})[t](); }
const M = h => $('main').innerHTML = h;

/* 總覽 */
async function pageOv(){
  M('<div class="muted">讀取中…</div>');
  const o = await rpc('adm_overview');
  const st = (n,l)=>`<div class="stat"><div class="n">${Number(n).toLocaleString()}</div><div class="l">${l}</div></div>`;
  const maxN = Math.max(1, ...o.lv_dist.map(x=>x.n));
  M(`<div class="card"><h2>今日概況</h2><div class="grid">
    ${st(o.players,'總玩家數')}${st(o.new_today,'今日新註冊')}${st(o.active_today,'今日上線')}${st(o.active_7d,'7 天內上線')}
    ${st(o.steals_today,'今日偷菜次數')}${st(o.friendships,'好友配對數')}${st(o.banned,'停權人數')}${st(o.gems_total,'全服鑽石總數')}</div></div>
    <div class="card"><h2>等級分布</h2>${o.lv_dist.map(x=>`<div class="row"><span style="width:50px" class="muted">Lv${x.lv}</span><div style="height:14px;border-radius:7px;background:var(--green);width:${Math.max(4,x.n/maxN*70)}%"></div><b>${x.n}</b></div>`).join('')}</div>`);
}

/* 玩家管理 */
async function pagePl(q){
  M(`<div class="card"><div class="row"><input id="q" placeholder="搜尋暱稱或 Email" value="${esc(q||'')}" style="flex:1;min-width:200px"><button class="btn" id="qs">搜尋</button></div><div id="plist" class="muted">讀取中…</div></div><div id="pdet"></div>`);
  $('qs').onclick = ()=>pagePl($('q').value.trim()); $('q').onkeydown = e=>{ if(e.key==='Enter') pagePl($('q').value.trim()); };

/* 儲存按鈕：按了一定有回饋（儲存中 → ✓ 已儲存／✗ 失敗），改過沒存的那列會變黃 */
function rowOf(b){ return b.closest('tr') && !b.dataset.sign ? b.closest('tr') : b.closest('.card'); }
function updDirty(){ const n=document.querySelectorAll('#main [data-dirty]').length, el=$('dirtyN'); if(el) el.textContent = n ? `有 ${n} 項修改還沒儲存` : '沒有未儲存的修改'; const sa=$('saveAll'); if(sa) sa.classList.toggle('hot', n>0); }
async function runSave(b, quiet){
  const old=b.dataset.lbl||(b.dataset.lbl=b.textContent); b.disabled=true; b.textContent='儲存中…'; b.classList.remove('ok','bad');
  try{ await b._save(); b.textContent='✓ 已儲存'; b.classList.add('ok'); const r=rowOf(b); if(r){ r.removeAttribute('data-dirty'); r.querySelectorAll('[data-dirty]').forEach(x=>x.removeAttribute('data-dirty')); } if(!quiet) toast('已儲存'); return true; }
  catch(e){ b.textContent='✗ 失敗'; b.classList.add('bad'); toast('儲存失敗：'+e.message); return false; }
  finally{ b.disabled=false; updDirty(); setTimeout(()=>{ if(!b.disabled){ b.textContent=b.dataset.lbl; b.classList.remove('ok','bad'); } }, 2000); }
}
function wireSaves(){
  const btns=[...document.querySelectorAll('#main button')].filter(b=>b._save);
  btns.forEach(b=>b.onclick=()=>runSave(b));
  document.querySelectorAll('#main input, #main select, #main textarea').forEach(inp=>inp.addEventListener('input',()=>{ const r=inp.closest('[data-signrow]') ? inp.closest('.card') : (inp.closest('tr')||inp.closest('.card')); if(r) r.setAttribute('data-dirty','1'); updDirty(); }));
  if($('saveAll')) $('saveAll').onclick=async()=>{
    const todo=btns.filter(b=>{ const r=rowOf(b); return r && r.hasAttribute('data-dirty'); });
    if(!todo.length) return toast('沒有要儲存的修改');
    $('saveAll').disabled=true; let ok=0, bad=0;
    for(const b of todo){ (await runSave(b, true)) ? ok++ : bad++; }
    $('saveAll').disabled=false; toast(bad ? `儲存完成 ${ok} 項，失敗 ${bad} 項（紅色那幾列）` : `全部儲存好了（${ok} 項）`); };
  updDirty();
}

/* 更新紀錄 */
async function pageCl(data){
  const L = data || await rpc('adm_changelog');
  M(`<div class="card"><h2>新增更新紀錄</h2><div class="row"><input id="clT" placeholder="標題" style="flex:1"></div><textarea id="clB" placeholder="內容（玩家看得到）" style="width:100%;min-height:80px;margin-top:8px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="clAdd">新增</button></div></div>
    <div class="card"><h2>更新紀錄</h2>${L.map(c=>`<div style="border-bottom:1px solid var(--line);padding:10px 0"><div class="muted">${dt(c.at)}</div>
      <input data-clt="${c.id}" value="${esc(c.title)}" style="width:100%;font-weight:800"><textarea data-clb="${c.id}" style="width:100%;min-height:70px;margin-top:6px">${esc(c.body||'')}</textarea>
      <div class="row"><button class="btn" data-cls="${c.id}">儲存</button><button class="btn" style="background:#F2545B" data-cld="${c.id}">刪除</button></div></div>`).join('')||'<span class="muted">還沒有</span>'}</div>`);
  $('clAdd').onclick=async()=>{ try{ pageCl(await rpc('adm_changelog_save',{p_id:null,p_title:$('clT').value,p_body:$('clB').value})); toast('已新增'); }catch(e){ toast(e.message); } };
  document.querySelectorAll('[data-cls]').forEach(b=>b.onclick=async()=>{ const id=+b.dataset.cls; try{ pageCl(await rpc('adm_changelog_save',{p_id:id,p_title:document.querySelector(`[data-clt="${id}"]`).value,p_body:document.querySelector(`[data-clb="${id}"]`).value})); toast('已儲存'); }catch(e){ toast(e.message); } });
  document.querySelectorAll('[data-cld]').forEach(b=>b.onclick=async()=>{ if(!confirm('確定刪除這筆更新紀錄？')) return; try{ pageCl(await rpc('adm_changelog_del',{p_id:+b.dataset.cld})); toast('已刪除'); }catch(e){ toast(e.message); } });
}

const STYLE = {busy:'勤勞型',casual:'休閒型',thief:'愛偷菜',helper:'熱心型',normal:'一般'};

      <td><input class="num" type="number" min="1" max="30" data-l="${b.id}" value="${b.start_lv}"></td><td>${b.friends}</td><td>${b.steal_n}</td><td style="white-space:nowrap">${dt(b.last_act)}</td>

      <td style="white-space:nowrap"><button class="btn" data-sv="${b.id}">儲存</button> <button class="btn o" data-rs="${b.id}">重玩</button></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:10px"><button class="btn o" id="rsBots">全部電腦玩家重玩</button></div></div>

    <p>所有玩家（真人＋電腦）的等級、經驗、金幣、鑽石、種子、作物、田地、牧場、寵物、裝備、裝飾、建築外觀、城鎮色調、偷菜紀錄全部回到新手狀態。<br><b>保留</b>：帳號、暱稱、頭像、好友關係。電腦玩家會回到各自設定的起始等級。<b>做了就不能復原。</b></p>

  $('rsBots').onclick=async()=>{ if(!confirm('全部電腦玩家都重玩？')) return; try{ pageBt(await rpc('adm_bot_reset',{p_id:null})); toast('全部電腦玩家已重玩'); }catch(e){ toast(e.message); } };
  $('rsAll').onclick=async()=>{ if($('rsTxt').value.trim()!=='全部重玩') return toast('請先輸入「全部重玩」');
    if(!confirm('最後確認：所有玩家的進度都會清空，不能復原。確定嗎？')) return;
    try{ const r=await rpc('adm_reset_all',{p_confirm:'全部重玩'}); toast(`已重玩，共 ${r.players} 位玩家`); pageBt(); }catch(e){ toast(e.message); } };
}

/* ================= 獎勵設定元件（發獎、兌換碼、玩家補發共用） ================= */
const BN=k=>((CFG.beasts||[]).find(x=>x.id===k)||{}).name||k, GN=k=>{ const g=(CFG.gear||[]).find(x=>x.id===k); return g?`${g.name} ${['','I','II','III','IV'][g.tier]}`:k; },
  DN=k=>((CFG.decor||[]).find(x=>x.id===k)||{}).name||k, SN=k=>((CFG.skins||[]).find(x=>x.id===k)||{}).name||k, TN=k=>((CFG.tones||[]).find(x=>x.id===k)||{}).name||k,
  AN=k=>((CFG.animals||[]).find(x=>x.id===k)||{}).name||k;
const RW_TYPES={seeds:['種子',()=>(CFG.crops||[]).map(c=>[c.id,c.name])],crops:['作物',()=>(CFG.crops||[]).map(c=>[c.id,c.name])],gear:['寵物裝備',()=>(CFG.gear||[]).map(g=>[g.id,GN(g.id)])],
  decor:['裝飾',()=>(CFG.decor||[]).map(d=>[d.id,d.name])],beasts:['寵物',()=>(CFG.beasts||[]).map(b=>[b.id,b.name])],tones:['城鎮色調',()=>(CFG.tones||[]).filter(t=>t.id!=='spring').map(t=>[t.id,t.name])],
  skins:['建築外觀',()=>(CFG.skins||[]).map(k=>[k.id,`${({home:'家',barn:'穀倉',shop:'建築商店',fountain:'噴水池',pen:'寵物園',decor:'裝備商店'})[k.bld]||k.bld}・${k.name}`])]};
function rwBuilder(px){ return `<div class="row">金幣 <input class="num" id="${px}_gold" type="number" min="0" value="0"> 鑽石 <input class="num" id="${px}_gems" type="number" min="0" value="0"> 經驗 <input class="num" id="${px}_exp" type="number" min="0" value="0"></div>
  <div id="${px}_items"></div><div class="row"><select id="${px}_t">${Object.entries(RW_TYPES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><select id="${px}_i"></select>
  <input class="num" id="${px}_n" type="number" min="1" value="1"><button class="btn" id="${px}_add" type="button">＋ 加入</button></div>`; }
const RWX={};
function rwBind(px){ RWX[px]=[];
  const fill=()=>{ $(px+'_i').innerHTML=RW_TYPES[$(px+'_t').value][1]().map(([v,n])=>`<option value="${v}">${esc(n)}</option>`).join(''); $(px+'_n').style.display=['beasts','tones','skins'].includes($(px+'_t').value)?'none':''; };
  const draw=()=>{ $(px+'_items').innerHTML=RWX[px].map((x,i)=>`<span class="tag" style="margin:2px">${RW_TYPES[x.t][0]}：${esc(x.label)}${x.n>1?` ×${x.n}`:''} <a href="#" data-rx="${i}">✕</a></span>`).join('');
    document.querySelectorAll(`#${px}_items [data-rx]`).forEach(a=>a.onclick=e=>{ e.preventDefault(); RWX[px].splice(+a.dataset.rx,1); draw(); }); };
  $(px+'_t').onchange=fill; fill();
  $(px+'_add').onclick=()=>{ const t=$(px+'_t').value, sel=$(px+'_i'); if(!sel.value) return; RWX[px].push({t, id:sel.value, label:sel.options[sel.selectedIndex].text, n:Math.max(1,+$(px+'_n').value||1)}); draw(); };
}
function rwRead(px){ const rw={}; ['gold','gems','exp'].forEach(k=>{ const v=+$(px+'_'+k).value||0; if(v>0) rw[k]=v; });
  (RWX[px]||[]).forEach(x=>{ if(['beasts','tones','skins'].includes(x.t)){ (rw[x.t]=rw[x.t]||[]).includes(x.id)||rw[x.t].push(x.id); } else { rw[x.t]=rw[x.t]||{}; rw[x.t][x.id]=(rw[x.t][x.id]||0)+x.n; } });
  return rw; }
function rwText(rw){ const o=[]; if(rw.gold) o.push(`金幣 ${rw.gold}`); if(rw.gems) o.push(`鑽石 ${rw.gems}`); if(rw.exp) o.push(`經驗 ${rw.exp}`);
  const nm={seeds:k=>CROPN[k]+'種子',crops:k=>CROPN[k],gear:GN,decor:DN,beasts:BN,tones:TN,skins:SN};
  ['seeds','crops','gear','decor'].forEach(t=>Object.entries(rw[t]||{}).forEach(([k,n])=>o.push(`${nm[t](k)}×${n}`)));
  ['beasts','tones','skins'].forEach(t=>(rw[t]||[]).forEach(k=>o.push(nm[t](k))));
  return o.join('、')||'（沒有）'; }

/* ================= 發獎、兌換碼 ================= */
async function pageGf(){
  let G=[], K=[]; try{ [G,K]=await Promise.all([rpc('adm_gifts'),rpc('adm_codes')]); }catch(e){ return M(`<div class="card"><h2>發獎／兌換碼</h2><p class="muted">伺服器還沒更新（請先執行 SQL 014）：${esc(e.message)}</p></div>`); }
  M(`<div class="card"><h2>🎁 全服發獎（禮物信箱）</h2><p class="muted">送出後，所有玩家（含之後新加入的）登入時信箱會跳出來，按領取就拿到。</p>
    <div class="row"><input id="gfT" placeholder="標題（例如：開服慶祝禮）" style="flex:1"> 有效天數 <input class="num" id="gfD" type="number" min="0" value="7"> <span class="muted">0＝不過期</span></div>
    <textarea id="gfB" placeholder="說明（可留空）" style="width:100%;min-height:50px;margin-top:6px"></textarea>${rwBuilder('gf')}
    <div class="row" style="margin-top:8px"><button class="btn o" id="gfGo">發送給全服</button></div></div>
    <div class="card"><h2>發過的禮物</h2>${G.length?`<table><tr><th>時間</th><th>標題</th><th>獎勵</th><th>對象</th><th>已領</th><th>到期</th><th></th></tr>${G.map(g=>`<tr><td style="white-space:nowrap">${dt(g.at)}</td><td>${esc(g.title)}</td><td>${esc(rwText(g.reward))}</td><td>${g.target?esc(g.target):'全服'}</td><td>${g.claimed}</td><td style="white-space:nowrap">${g.exp?dt(g.exp):'不過期'}</td><td>${!g.exp||g.exp>Date.now()?`<button class="btn" style="background:#F2545B" data-gs="${g.id}">停止</button>`:''}</td></tr>`).join('')}</table>`:'<span class="muted">還沒有</span>'}</div>
    <div class="card"><h2>🔑 建立兌換碼</h2><p class="muted">玩家在「設定 → 兌換碼」輸入就能領，每個帳號每個碼只能領一次。</p>
    <div class="row">兌換碼 <input id="cdC" placeholder="例如 FARM2026" style="width:10em;text-transform:uppercase"> 可用次數 <input class="num" id="cdM" type="number" min="0" value="0"> <span class="muted">0＝不限</span> 有效天數 <input class="num" id="cdD" type="number" min="0" value="30"> <input id="cdN" placeholder="備註" style="flex:1"></div>
    ${rwBuilder('cd')}<div class="row" style="margin-top:8px"><button class="btn o" id="cdGo">建立</button></div></div>
    <div class="card"><h2>兌換碼列表</h2>${K.length?`<table><tr><th>兌換碼</th><th>獎勵</th><th>已用／上限</th><th>到期</th><th>備註</th><th>啟用</th></tr>${K.map(k=>`<tr><td><b>${esc(k.code)}</b></td><td>${esc(rwText(k.reward))}</td><td>${k.used}／${k.max||'不限'}</td><td style="white-space:nowrap">${k.exp?dt(k.exp):'不過期'}</td><td>${esc(k.note||'')}</td><td><input type="checkbox" data-ca="${esc(k.code)}" ${k.active?'checked':''}></td></tr>`).join('')}</table>`:'<span class="muted">還沒有</span>'}</div>`);
  rwBind('gf'); rwBind('cd');
  $('gfGo').onclick=async()=>{ const rw=rwRead('gf'); if(!$('gfT').value.trim()) return toast('請填標題'); if(!Object.keys(rw).length) return toast('請設定獎勵');
    if(!confirm(`發送給全服？\n${rwText(rw)}`)) return; try{ await rpc('adm_gift_send',{p_title:$('gfT').value,p_body:$('gfB').value||null,p_reward:rw,p_target:null,p_days:+$('gfD').value||0}); toast('已發送'); pageGf(); }catch(e){ toast(e.message); } };
  document.querySelectorAll('[data-gs]').forEach(b=>b.onclick=async()=>{ if(!confirm('停止這個禮物？還沒領的玩家就領不到了')) return; try{ await rpc('adm_gift_stop',{p_id:+b.dataset.gs}); toast('已停止'); pageGf(); }catch(e){ toast(e.message); } });
  $('cdGo').onclick=async()=>{ const rw=rwRead('cd'); if(!Object.keys(rw).length) return toast('請設定獎勵');
    try{ await rpc('adm_code_save',{p_code:$('cdC').value,p_reward:rw,p_max:+$('cdM').value||0,p_days:+$('cdD').value||0,p_active:true,p_note:$('cdN').value||null}); toast('已建立'); pageGf(); }catch(e){ toast(e.message); } };
  document.querySelectorAll('[data-ca]').forEach(c=>c.onchange=async()=>{ try{ await rpc('adm_code_save',{p_code:c.dataset.ca,p_reward:null,p_max:null,p_days:null,p_active:c.checked,p_note:null}); toast(c.checked?'已啟用':'已停用'); }catch(e){ toast(e.message); } });
}

/* ================= 活動加倍、維護模式、跑馬燈 ================= */
async function pageEv(){
  const C = await rpc('adm_config'), S={}; C.settings.forEach(x=>S[x.key]=x.value);
  const loc=sec=>{ if(!+sec) return ''; const d=new Date(sec*1000); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
  const now=Date.now()/1000, act=now>=+S.ev_start && now<=+S.ev_end;
  M(`<div class="card"><h2>🎉 活動加倍</h2><p class="muted">在設定的時間內，經驗、收成數量、賣東西拿到的金幣會乘上倍數（1＝不加倍）。玩家畫面上方跑馬燈會顯示活動名稱。${act?'<b style="color:#2E9660">目前活動進行中</b>':''}</p>
    <div class="row">活動名稱 <input id="evN" value="${esc(S.ev_name||'')}" placeholder="例如：週末豐收祭" style="flex:1"></div>
    <div class="row">開始 <input id="evS" type="datetime-local" value="${loc(S.ev_start)}"> 結束 <input id="evE" type="datetime-local" value="${loc(S.ev_end)}"></div>
    <div class="row">經驗 × <input class="num" id="evX" type="number" step="0.1" min="0" value="${S.ev_exp??1}"> 收成 × <input class="num" id="evY" type="number" step="0.1" min="0" value="${S.ev_yield??1}"> 賣價 × <input class="num" id="evG" type="number" step="0.1" min="0" value="${S.ev_gold??1}"></div>
    <div class="row"><button class="btn o" id="evGo">儲存活動</button><button class="btn" id="evStop" style="background:#F2545B">馬上結束活動</button></div></div>
    <div class="card"><h2>🛠️ 維護模式</h2><p class="muted">開啟後，管理員以外的玩家都會看到維護畫面、不能操作（電腦玩家也會暫停）。</p>
    <div class="row">狀態：<b style="color:${+S.maint_on?'#F2545B':'#2E9660'}">${+S.maint_on?'維護中':'正常'}</b></div>
    <div class="row"><input id="mtM" value="${esc(S.maint_msg||'')}" placeholder="維護公告（例如：預計 22:00 恢復）" style="flex:1"><button class="btn" id="mtGo" style="background:${+S.maint_on?'#3BB273':'#F2545B'}">${+S.maint_on?'結束維護':'開始維護'}</button></div></div>
    <div class="card"><h2>📢 跑馬燈</h2><div class="row">偷菜、被狗咬的跑馬燈：<b>${+(S.ticker_on??1)?'顯示中':'已關閉'}</b><button class="btn" id="tkGo">${+(S.ticker_on??1)?'關閉':'打開'}</button></div></div>`);
  const sec=id=>{ const v=$(id).value; return v?Math.floor(new Date(v).getTime()/1000):0; };
  $('evGo').onclick=async()=>{ const st=sec('evS'), en=sec('evE'); if(!st||!en||en<=st) return toast('請設定正確的開始和結束時間');
    try{ await rpc('adm_setting_put',{p_key:'ev_name',p_value:$('evN').value});
      for(const [k,v] of [['ev_start',st],['ev_end',en],['ev_exp',+$('evX').value||1],['ev_yield',+$('evY').value||1],['ev_gold',+$('evG').value||1]]) await rpc('adm_setting_set',{p_key:k,p_value:v});
      toast('活動已儲存'); pageEv(); }catch(e){ toast(e.message); } };
  $('evStop').onclick=async()=>{ if(!confirm('馬上結束活動？')) return; try{ await rpc('adm_setting_set',{p_key:'ev_end',p_value:Math.floor(Date.now()/1000)-1}); toast('活動已結束'); pageEv(); }catch(e){ toast(e.message); } };
  $('mtGo').onclick=async()=>{ const on=+S.maint_on?0:1; if(on && !confirm('開始維護？玩家會馬上不能操作')) return;
    try{ await rpc('adm_setting_put',{p_key:'maint_msg',p_value:$('mtM').value}); await rpc('adm_setting_set',{p_key:'maint_on',p_value:on}); toast(on?'已開始維護':'已結束維護'); pageEv(); }catch(e){ toast(e.message); } };
  $('tkGo').onclick=async()=>{ try{ await rpc('adm_setting_set',{p_key:'ticker_on',p_value:+(S.ticker_on??1)?0:1}); toast('已更新'); pageEv(); }catch(e){ toast(e.message); } };
}

boot();
</script>
</body>
</html>
