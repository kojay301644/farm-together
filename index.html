<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>一起種田吧</title>
<meta name="description" content="開心農場風格的小鎮種田遊戲：種菜、收成、加好友、偷菜！">
<meta name="theme-color" content="#3BB273">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="一起種田吧">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="一起種田吧">
<meta property="og:description" content="開心農場風格的小鎮種田遊戲：種菜、收成、加好友、偷菜！">
<meta property="og:image" content="https://kojay301644.github.io/farm-together/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3A3226; --ink2:#7A6E5D; --card:#FFFFFF; --line:#EFE6D8;
  --green:#3BB273; --green-d:#2E9660; --orange:#FF9F43; --orange-d:#F0851A;
  --gold:#FFC93C; --sky1:#AEE1FF; --sky2:#E8F7FF; --grass:#8ACB5B; --grass-d:#6DB548;
  --red:#F2545B; --blue:#3DA5F4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:#8fcdfb;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}

/* 地圖 */
#map{position:fixed;inset:0;overflow:auto;scrollbar-width:none;cursor:grab}
#map::-webkit-scrollbar{display:none}
#map.drag{cursor:grabbing}
#world{display:block}
.tap{cursor:pointer}
.tap.hit{animation:hit .25s ease-out}
@keyframes hit{50%{transform:translateY(-4px)}}
.tap.hit{transform-box:fill-box;transform-origin:center bottom}
.ripe .crop{animation:bob 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{50%{transform:translateY(-2px) scale(1.04)}}
.spark{animation:tw 1.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.blades{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
.flow{stroke-dasharray:14 22;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.wave{animation:wave 3s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(4px);opacity:.5}}
.walk .lg1{animation:lg 0.5s ease-in-out infinite}
.walk .lg2{animation:lg 0.5s ease-in-out infinite reverse}
@keyframes lg{50%{transform:translateY(-2px)}}
.walk .bd{animation:bdy .5s ease-in-out infinite}
@keyframes bdy{50%{transform:translateY(-1px)}}
.smoke{animation:smk 3s ease-out infinite}
@keyframes smk{from{transform:translateY(0);opacity:.8}to{transform:translateY(-26px);opacity:0}}
.plab{pointer-events:none}

/* 上方資訊 */
.hud{position:fixed;left:0;right:0;top:0;z-index:20;padding:10px 10px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.top{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.96);border-radius:20px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;flex:none}
.who{flex:1;min-width:0}
.who .nm{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:700}
.lvtag{background:var(--green);color:#fff;border-radius:8px;padding:0 7px;font-weight:900}
.bar{flex:1;height:8px;background:#EEF2E6;border-radius:8px;overflow:hidden;max-width:160px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7ED957,var(--green));border-radius:8px;transition:width .4s}
.gold{display:flex;align-items:center;gap:6px;background:#FFF6DB;border-radius:14px;padding:6px 12px;font-weight:900;font-size:16px}
.coin{width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -2px 0 #E8A919;display:inline-block;position:relative}
.coin:after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid #E8A919}
.hint{max-width:720px;margin:8px auto 0;background:rgba(255,255,255,.92);border-radius:14px;padding:7px 12px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.hint b{color:var(--green-d)}

/* 工具列 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.dock-in{max-width:720px;margin:0 auto;background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 -2px 14px rgba(0,0,0,.1),0 4px 0 rgba(0,0,0,.08);padding:8px;pointer-events:auto}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tool{background:#F6F1E8;border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;color:var(--ink2);position:relative}
.tool svg{width:30px;height:30px}
.tool.on{background:#E3F6EA;color:var(--green-d);box-shadow:inset 0 0 0 2px var(--green)}
.tool .badge{position:absolute;top:2px;right:4px;background:var(--orange);color:#fff;border-radius:8px;font-size:10px;padding:0 5px}
.home{max-width:720px;margin:0 auto 8px;display:flex;justify-content:flex-end;pointer-events:none}
.home .bagbtn.pal{margin-right:auto;margin-left:6px;background:linear-gradient(#7ED957,#3FAE5A)}
.home .bagbtn{background:linear-gradient(#FFB45E,#F28B2E);color:#fff;border:2.5px solid #3A3226;box-shadow:0 3px 0 #3A3226;font-size:14px;padding:6px 14px}
.home button{pointer-events:auto;background:#fff;border-radius:16px;padding:7px 12px;font-weight:900;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.1);display:flex;align-items:center;gap:4px}

/* 視窗 */
.ov{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:8px}
.ov.show{display:flex}
@media(min-width:560px){.ov{align-items:center}}
.md{position:relative;background:var(--card);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(20px);opacity:0}}
.md h3{margin:0;padding:16px 18px 10px;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:space-between}
.md .x{background:#F3EEE5;width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:900}
.md .bd{padding:0 18px 12px;overflow:auto;zoom:1.1}
.md h3{font-size:21px}
.mmore{position:absolute;left:50%;bottom:14px;transform:translate(-50%,10px);z-index:3;border:0;border-radius:999px;background:#3BB273;color:#fff;font-weight:900;font-size:14px;padding:7px 16px;box-shadow:0 4px 0 #2A8E57,0 6px 14px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.25s;animation:mmb 1.4s ease-in-out infinite}
.mmore.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.md:has(.ft) .mmore{bottom:78px}
.md.hasmore .bd{-webkit-mask-image:linear-gradient(#000 calc(100% - 46px),transparent);mask-image:linear-gradient(#000 calc(100% - 46px),transparent)}
@keyframes mmb{0%,100%{margin-bottom:0}50%{margin-bottom:5px}}
.md .ft{padding:10px 18px 16px;display:flex;gap:8px}
.btn{flex:1;background:var(--green);color:#fff;font-weight:900;font-size:15px;padding:11px;border-radius:14px;box-shadow:0 3px 0 var(--green-d)}
.btn.sub{background:#EFE9DF;color:var(--ink);box-shadow:0 3px 0 #DDD3C3}
.btn.o{background:var(--orange);box-shadow:0 3px 0 var(--orange-d)}
.btn.r{background:var(--red);box-shadow:0 3px 0 #C93D44}
.btn:disabled,.mini:disabled{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:54px;height:46px;flex:none;background:#F4F9EC;border-radius:12px}
.row .ic svg{width:100%;height:100%}
.row .tx{flex:1;min-width:0}
.row .tx b{font-size:15px}
.row .tx div{font-size:12px;color:var(--ink2);font-weight:700}
.mini{background:var(--green);color:#fff;font-weight:900;font-size:13px;padding:7px 10px;border-radius:10px;box-shadow:0 2px 0 var(--green-d);white-space:nowrap}
.mini.o{background:var(--orange);box-shadow:0 2px 0 var(--orange-d)}
.lock{font-size:12px;font-weight:900;color:#B0A592;background:#F3EEE5;border-radius:10px;padding:6px 10px}
.tag{display:inline-block;background:#FFF1DC;color:var(--orange-d);border-radius:6px;padding:0 6px;font-size:11px;font-weight:900;margin-left:4px}
.sec{font-size:13px;font-weight:900;color:var(--ink2);margin:12px 0 2px}
.empty{color:var(--ink2);text-align:center;padding:22px 0;font-weight:700;font-size:14px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:#F3EEE5;border-radius:10px;padding:8px 0;font-weight:900}
.seg button.on{background:var(--green);color:#fff}

.toast{position:fixed;left:50%;top:120px;transform:translateX(-50%);background:rgba(58,50,38,.92);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.fl{position:fixed;z-index:70;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:up 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes up{to{transform:translate(-50%,-46px);opacity:0}}

/* 登入 */
.login{position:fixed;inset:0;z-index:100;background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--grass) 55%);display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{background:#fff;border-radius:28px;padding:26px 22px;width:100%;max-width:380px;text-align:center;box-shadow:0 6px 0 var(--line)}
.logo{font-size:34px;font-weight:900;color:var(--green-d);letter-spacing:2px;margin:6px 0 2px}
.logo span{color:var(--orange)}
.login p{color:var(--ink2);font-weight:700;font-size:13px;margin:4px 0 16px}
.login input{width:100%;font-family:inherit;font-size:17px;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--line);outline:none;text-align:center;margin-bottom:12px;color:var(--ink)}
.login input:focus{border-color:var(--green)}
.login input{margin-bottom:10px}
.amsg{font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
.link{background:none;color:var(--ink2);font-weight:700;font-size:13px;text-decoration:underline;margin-top:6px}
.or{display:flex;align-items:center;gap:10px;color:#B0A592;font-size:12px;font-weight:700;margin:12px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;font-weight:900;font-size:15px}
.gbtn.off{opacity:.5}
.tabs{display:flex;gap:6px;margin-bottom:6px;position:sticky;top:0;background:#fff;padding-bottom:6px;z-index:1}
.tabs button{flex:1;background:#F3EEE5;border-radius:10px;padding:8px 0;font-weight:900;font-size:13px}
.tabs button.on{background:var(--green);color:#fff}
.rk .rkn{width:26px;text-align:center;font-weight:900;font-size:16px;color:var(--ink2);flex:none}
.rk.mine{background:#F4FBEF;border-radius:12px;padding-left:6px;padding-right:6px}
.myrank{margin-top:10px;background:#FFF6DB;border-radius:12px;padding:10px;text-align:center;font-weight:700;font-size:13px}
.myrank b{color:var(--orange-d);font-size:16px}
.cur{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.cur .gold{padding:3px 10px;font-size:14px}
.gem{background:#EEEBFF;cursor:pointer}
.gemcard{border:2px solid #E6E1FF;border-radius:14px;padding:10px;text-align:center;position:relative}
.gemcard b{font-size:18px;color:#5B4ED6}
.gemcard .price{font-weight:900;margin-top:4px}
.gemcard .bonus{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:900;border-radius:8px;padding:1px 6px}
.gemgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.soon{background:#FFF6DB;border-radius:12px;padding:10px;font-size:13px;font-weight:700;text-align:center;margin:6px 0 10px}
.homebtns{display:flex;gap:8px;margin-top:10px}
.plink{color:var(--ink2);font-size:12px;font-weight:700}
.help h4{margin:14px 0 4px;font-size:15px}
.help p,.help li{font-size:13px;font-weight:500;line-height:1.75;color:var(--ink);margin:2px 0}
.help ul{margin:2px 0;padding-left:20px}
.urlbox{margin-top:12px;background:#F3EEE5;border-radius:10px;padding:8px;font-size:12px;font-weight:700;text-align:center;word-break:break-all;user-select:text;-webkit-user-select:text}
.tut{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));z-index:30;padding:0 12px;pointer-events:none}
.tutin{max-width:520px;margin:0 auto;background:#3A3226;color:#fff;border-radius:18px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.6;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:auto}
.tutin b{color:#FFE066}
.tutn{display:inline-block;background:var(--orange);border-radius:8px;padding:0 7px;font-size:11px;margin-right:6px;vertical-align:1px}
.tutbtns{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.tutarrow{position:fixed;z-index:31;font-size:34px;transform:translate(-50%,-100%);pointer-events:none;animation:tbounce .8s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
@keyframes tbounce{50%{transform:translate(-50%,calc(-100% - 10px))}}
.dot{font-style:normal;background:var(--red);color:#fff;border-radius:8px;padding:0 6px;font-size:11px}
.avatar.sm{width:40px;height:40px;font-size:16px;flex:none}
.mini.sub{background:#EFE9DF;color:var(--ink);box-shadow:0 2px 0 #DDD3C3}
.inp{flex:1;font-family:inherit;font-size:15px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);outline:none;color:var(--ink);min-width:0}
.inp:focus{border-color:var(--green)}

/* ===== 手繪風升級：動畫與特效 ===== */
.sway{animation:sway 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-2.2deg) skewX(1.5deg)}50%{transform:rotate(2.2deg) skewX(-1.5deg)}}
.wsway{animation:sway 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.tsway{animation:tsway 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes tsway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.tuft{animation:sway 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.crawl{animation:crawl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes crawl{0%,100%{transform:translateX(-2px) scaleX(1)}50%{transform:translateX(3px) scaleX(.9)}}
.crawl .seg{animation:segbob .5s ease-in-out infinite;transform-box:fill-box}
@keyframes segbob{50%{transform:translateY(-1.2px)}}
.drip{animation:drip 1.4s ease-in-out infinite;transform-box:fill-box}
@keyframes drip{50%{transform:translateY(-3px)}}
.hop{animation:hop .45s ease-in-out infinite paused;transform-box:fill-box;transform-origin:50% 100%}
.walk .hop{animation-play-state:running}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-6px) scale(.96,1.04)}80%{transform:translateY(0) scale(1.05,.95)}}
.bfly{animation:flap .25s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes flap{50%{transform:scaleX(.35)}}
.floaty{animation:floaty 3.5s ease-in-out infinite}
.sunrays{animation:spin 160s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes floaty{50%{transform:translateY(-8px)}}
.bird{animation:bird 38s linear infinite}
@keyframes bird{from{transform:translateX(-200px)}to{transform:translateX(1600px)}}
.lampglow{opacity:0;transition:opacity 1.5s;pointer-events:none}
body.night .lampglow{opacity:1;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.75}}
#tint{position:fixed;inset:0;z-index:6;pointer-events:none;mix-blend-mode:multiply;transition:background 2s}
body.lowfx .sway,body.lowfx .wsway,body.lowfx .tsway,body.lowfx .tuft,body.lowfx .crawl,body.lowfx .crawl .seg,body.lowfx .wave,body.lowfx .flow,body.lowfx .bird,body.lowfx .floaty,body.lowfx .cloud{animation:none!important}
body.lowfx .bird{display:none}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.fxp{position:fixed;pointer-events:none;will-change:transform,opacity}
.fxp.can{animation:can 1.1s ease-in-out forwards;transform-origin:20% 80%}
@keyframes can{0%{opacity:0;transform:translateY(-10px) rotate(0)}15%{opacity:1}30%,75%{transform:rotate(-38deg)}100%{opacity:0;transform:rotate(-10deg) translateY(-6px)}}
.fxp.drop{width:5px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#5BC2F5;border:1.2px solid #2D7FB0;animation:drop .7s ease-in forwards;opacity:0}
@keyframes drop{0%{opacity:1;transform:translateY(0)}100%{opacity:.2;transform:translateY(46px)}}
.fxp.ripple{width:16px;height:7px;border-radius:50%;border:2px solid #9BDCF8;opacity:0;animation:ripple .7s ease-out forwards}
@keyframes ripple{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
.fxp.seed{width:7px;height:9px;border-radius:50%;background:#E9C77B;border:1.3px solid #4B3423;animation:seed .55s cubic-bezier(.3,0,.7,1) forwards}
@keyframes seed{0%{transform:translate(0,0)}50%{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.1 - 30px))}100%{transform:translate(var(--dx),var(--dy));opacity:.3}}
.fxp.dirt{width:9px;height:9px;border-radius:50%;background:#8B5E3C;border:1.3px solid #4B3423;animation:burst .6s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.fxp.leaf{font-size:15px;animation:burst .8s ease-out forwards}
.fxp.star{color:#FFE066;font-size:16px;text-shadow:0 0 2px #4B3423;animation:burst .7s ease-out forwards}
.fxp.fly svg{width:54px;height:40px}
.fxp.fly{animation:fly 1.1s cubic-bezier(.5,-0.3,.6,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.6)}25%{transform:translate(0,-34px) scale(1.15)}100%{transform:translate(var(--tx),var(--ty)) scale(.35);opacity:.2}}
.fxp.grab{animation:grab .9s ease-in-out forwards}
@keyframes grab{0%{transform:translateY(-30px);opacity:0}35%{transform:translateY(18px);opacity:1}55%{transform:translateY(18px) rotate(-10deg)}100%{transform:translateY(-50px);opacity:0}}
.fxp.smoke2{width:22px;height:22px;border-radius:50%;background:#B58CE8;border:2px solid #6B4BA0;opacity:0;animation:smk2 1s ease-out forwards}
@keyframes smk2{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:translateY(-36px) scale(1.8)}}
.fxp.pop{animation:popup 1s ease-out forwards}
@keyframes popup{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.2);opacity:1}100%{transform:translateY(-24px) scale(1);opacity:0}}
.fxp.conf{width:8px;height:12px;border-radius:2px;animation:conf 2s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.bump{animation:bumpk .6s ease-out}
@keyframes bumpk{30%{transform:scale(1.12)}}
/* 讀取畫面 */
#loader{position:fixed;inset:0;z-index:200;background:linear-gradient(#AEE1FF,#E8F7FF 60%,#9BD36A 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
#loader .lg{font-size:30px;font-weight:900;color:#2E9660;letter-spacing:2px}

let modalKey = '';
function modal(title, body, btns){
  // 同一個視窗重新整理（例如買東西後）時，保留原本捲動的位置，不要跳回最上面
  const key = String(title).replace(/<[\s\S]*$/, '').trim(), oldBd = $('md').querySelector('.bd');
  const keep = $('ov').classList.contains('show') && key === modalKey && oldBd ? oldBd.scrollTop : 0;
  modalKey = key;
  $('md').innerHTML = `<h3><span>${title}</span><button class="x" id="mx">×</button></h3><div class="bd">${body}</div>${btns&&btns.length?'<div class="ft" id="mft"></div>':''}`;
  $('mx').onclick = closeModal;
  if(btns && btns.length){
    const ft=$('mft');
    btns.forEach(([t,cls,fn])=>{ const b=document.createElement('button'); b.className='btn '+(cls||''); b.textContent=t; b.onclick=fn; ft.appendChild(b); });
  }
  $('md').insertAdjacentHTML('beforeend','<button class="mmore" id="mMore">往下滑還有 ⌄</button>');
  const bd=$('md').querySelector('.bd'), mm=$('mMore');
  const upd=()=>{ const more = bd.scrollHeight - bd.scrollTop - bd.clientHeight > 24; mm.classList.toggle('on', more); $('md').classList.toggle('hasmore', more); };
  bd.addEventListener('scroll', upd, {passive:true}); mm.onclick=()=>bd.scrollBy({top:bd.clientHeight*0.7, behavior:'smooth'});
  bd.querySelectorAll('img').forEach(im=>{ if(!im.complete) im.addEventListener('load', upd, {once:true}); });
  $('ov').classList.add('show'); document.body.classList.add('modalopen');
  if(keep) bd.scrollTop = keep;
  upd(); setTimeout(upd, 120); setTimeout(upd, 600);
}
function closeModal(){ modalKey=''; $('ov').classList.remove('show'); document.body.classList.remove('modalopen'); }

function ol(s, w=2, c=INK){
  return s.replace(/<(circle|ellipse|rect|polygon|path)\b([^>]*?)(\/?)>/g, (m,tag,attrs,sl)=>{
    if(/stroke=|fill="none"|rgba\(0,0,0|class="nool"|opacity=/.test(attrs)) return m;
    return `<${tag}${attrs} stroke="${c}" stroke-width="${w}" stroke-linejoin="round"${sl}>`;
  });
}

/* 每幀姿勢（照寵物的算法） */
function farmerPose(m, dt, moving){
  const P=m.parts; if(!P||!P.root) return; const c=m.c, n=m.n, act=m.act;
  m.anim+=dt; if(moving) m.ph+=dt*c.spd*(m.task?14:9);
  let f=0,u=1,p=1,h=0;
  if(moving){ if(c.type==='waddle'){ h=Math.sin(m.ph)*.13; f=Math.abs(Math.sin(m.ph))*n*.03; }
    else if(c.type==='float') h=Math.sin(m.ph)*.05;
    else { const k=Math.cos(m.ph*2)*.012; p=1+k; u=1-k; } }
  if(c.type==='float') f+=n*(.12+Math.sin(m.anim*2.2)*.04);
  if(!moving){ const k=Math.sin(m.anim*2.6)*.025; u=1+k; p=1-k;
    if(act==='work'||act==='water') h=Math.sin(m.anim*10)*.06;
    if(act==='angry') h=Math.sin(m.anim*40)*.05;
    if(act==='look') h=Math.sin(m.anim*2.5)*.1; }
  if(!moving && (act==='cheer'||act==='wave'||act==='stretch')){ m.jump=(m.jump||0)+dt; if(m.jump>(act==='cheer'?.55:.9)) m.jump=0; } else m.jump=0;
  if(m.jump>0 && m.jump<.45){ const k=Math.sin(m.jump/.45*Math.PI); f+=k*n*(act==='cheer'?.35:.18); p*=1+k*.08; u*=1-k*.05; }
  P.root.setAttribute('transform',`translate(0 ${(-f).toFixed(2)}) rotate(${(h*57.3).toFixed(2)}) scale(${u.toFixed(3)} ${p.toFixed(3)})`);
  P.sh.setAttribute('transform',`scale(${Math.max(.3,1-f/n*.6).toFixed(3)} 1)`);
  if(P.a){ const E=c.type==='quad'?1:1.15, i=m.ph;
    const leg=(el,kk,ph)=>{ const lift=moving?Math.max(0,kk)*n*.075*E:0, dx=moving?Math.cos(ph)*n*.045*E:0; el.setAttribute('transform',`translate(${dx.toFixed(2)} ${(-lift).toFixed(2)})`); };
    leg(P.a,Math.sin(i),Math.sin(i)>0?i:i+Math.PI); leg(P.b,Math.sin(i+Math.PI),Math.sin(i+Math.PI)>0?i:i+Math.PI);
    P.t.setAttribute('transform',`translate(0 ${moving?(-Math.abs(Math.cos(i))*n*.03).toFixed(2):0})`); }
}

/* 自由走動：整座島都能走，不踩建築與裝飾；偶爾從牧場門進出 */
const ISL=[672*IS,360*IS,545*IS,292*IS];
function walkable(gx,gy){ const [x,y]=iso(gx,gy);
  if(((x-ISL[0])/ISL[2])**2+((y-ISL[1])/ISL[3])**2>1) return false;
  for(const [ox,oy,rx,ry] of OBST) if(((x-ox)/rx)**2+((y-oy)/ry)**2<1) return false;
  if(RANCH && gx>RANCH[0]-0.15 && gx<RANCH[0]+RANCH[2]+0.15 && gy>RANCH[1]-0.15 && gy<RANCH[1]+RANCH[3]+0.15) return false;
  return true; }
function clearLine(a,b){ const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/0.25); for(let k=1;k<=n;k++){ if(!walkable(a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n)) return false; } return true; }
function inRanch(gx,gy){ return RANCH && gx>RANCH[0]-0.2 && gx<RANCH[0]+RANCH[2]+0.2 && gy>RANCH[1]-0.2 && gy<RANCH[1]+RANCH[3]+0.2; }
function ranchClear(a,b){ const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/0.2); for(let k=1;k<=n;k++){ if(inRanch(a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n)) return false; } return true; }
/* 繞過牧場的路線（回傳途經點，不含終點） */
function viaAround(from, to){
  if(!RANCH || ranchClear(from,to)) return [];
  const [X,Y,W,D]=RANCH, m=0.6, C=[[X-m,Y-m],[X+W+m,Y-m],[X-m,Y+D+m],[X+W+m,Y+D+m]], L=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
  let best=null, bl=1e9;
  for(const c of C) if(ranchClear(from,c) && ranchClear(c,to)){ const l=L(from,c)+L(c,to); if(l<bl){ bl=l; best=[c]; } }
  if(best) return best;
  for(const c1 of C) for(const c2 of C) if(c1!==c2 && ranchClear(from,c1) && ranchClear(c1,c2) && ranchClear(c2,to)){ const l=L(from,c1)+L(c1,c2)+L(c2,to); if(l<bl){ bl=l; best=[c1,c2]; } }
  return best||[];
}
function pickRoam(m){
  if(!walkable(m.x,m.y)){ // 卡在不能走的地方（例如牧場裡），先走到最近的空地
    for(let r=0.4;r<8;r+=0.4) for(let a=0;a<16;a++){ const g=[m.x+Math.cos(a/16*Math.PI*2)*r, m.y+Math.sin(a/16*Math.PI*2)*r]; if(walkable(g[0],g[1]) && !inRanch(g[0],g[1])){ m.route=viaAround([m.x,m.y],g).slice(1); return g; } }
  }
  for(let k=0;k<40;k++){ const a=Math.random()*Math.PI*2, r=1.5+Math.random()*5, g=[m.x+Math.cos(a)*r, m.y+Math.sin(a)*r];
    if(walkable(g[0],g[1]) && clearLine([m.x,m.y],g)) return g; }
  return [m.x,m.y]; }
/* 農場主人的移動與動作 */
function farmerStep(m, dt){
  let moving=false;
  if(m.wait>0){ m.wait-=dt; if(m.wait<=0){ setAct(m,null); if(m.task && m.task.started) m.task=null; } }
  else {
    if(!m.task && m.jobs && m.jobs.length){ m.task=m.jobs.shift(); m.goal=null; }
    if(!m.task && !m.goal) m.goal = (m.route && m.route.length) ? m.route.shift() : pickRoam(m);
    if(m.task && !m.task.via){ m.task.via = viaAround([m.x,m.y], m.task.pos); }
    const goal = m.task ? (m.task.via.length ? m.task.via[0] : m.task.pos) : m.goal;
    const dx=goal[0]-m.x, dy=goal[1]-m.y, dist=Math.hypot(dx,dy), step=(m.task?2.4:m.speed*(m.c?Math.max(.6,Math.min(1.3,m.c.spd)):1))*dt;
    if(dist<=step && m.task && m.task.via.length){ m.x=goal[0]; m.y=goal[1]; m.task.via.shift(); moving=true; }
    else if(dist<=step){ m.x=goal[0]; m.y=goal[1];
      if(m.task){ m.task.started=true; if(m.task.look){ const sd=(m.task.look[0]-m.x)-(m.task.look[1]-m.y); if(Math.abs(sd)>0.05) m.face=sd>0?1:-1; }
        setAct(m,m.task.act); m.wait=m.task.dur; emote(m,m.task.emo); }
      else { m.goal=null; if(m.route && m.route.length){ m.wait=0.2+Math.random()*0.6; } else { m.wait=1+Math.random()*3;
        const r=Math.random(); if(r<0.5) setAct(m, ['wave','stretch','look','wave'][Math.floor(Math.random()*4)]); } }
    } else { m.x+=dx/dist*step; m.y+=dy/dist*step; moving=true; const sdx=dx-dy; if(Math.abs(sdx)>0.01) m.face=sdx>0?1:-1; }
  }
  farmerPose(m, dt, moving);
  const [sx,sy]=iso(m.x,m.y);
  m.el.setAttribute('transform',`translate(${sx.toFixed(1)} ${sy.toFixed(1)}) scale(${m.face*m.s} ${m.s})`);
  if(m.moving!==moving){ m.moving=moving; m.el.classList.toggle('walk',moving); m.el.classList.toggle('run',moving && !!m.task); }
}
/* 移動動畫 */
let lastF=performance.now();
/* 省電：畫面最多 30fps（省電模式 20fps），開著視窗或切到背景時整個停下來 */
const FPS_CAP = () => (typeof LOWFX!=='undefined' && LOWFX) ? 20 : 30;
const PAUSED = () => document.hidden || document.body.classList.contains('modalopen');
function animate(now){
  if(PAUSED() || now-lastF < 1000/FPS_CAP()-2){ if(PAUSED()) lastF=now; requestAnimationFrame(animate); return; }
  const dt=Math.min(0.1,(now-lastF)/1000); lastF=now;
  for(const m of movers){
    if(m.fly && LOWFX){ m.el.style.display='none'; continue; }
    if(m.farmer){ farmerStep(m, dt); continue; }
    let moving=false;
    if(m.wait>0){ m.wait-=dt; }
    else {
      if(!m.goal){
        if(m.chick || m.fly){ const a=m.area; m.goal=[a[0]+Math.random()*(a[2]-a[0]), a[1]+Math.random()*(a[3]-a[1])]; }
        else { m.goal=m.path[m.tgt]; }
      }
      const dx=m.goal[0]-m.x, dy=m.goal[1]-m.y, dist=Math.hypot(dx,dy), step=m.speed*dt;
      if(dist<=step){ m.x=m.goal[0]; m.y=m.goal[1]; m.goal=null;
        if(m.chick) m.wait=0.6+Math.random()*2.5; else if(m.fly) m.wait=Math.random()*0.6; else { m.tgt=(m.tgt+1)%m.path.length; m.wait=(m.farmer?0.8:1)+Math.random()*3; } }
      else { m.x+=dx/dist*step; m.y+=dy/dist*step; moving=true;
        const sdx=(dx-dy); if(Math.abs(sdx)>0.01) m.face = (sdx>0?1:-1) * (m.petFace||1); }
    }
    let [sx,sy]=iso(m.x,m.y); if(m.fly) sy -= 30 + Math.sin(now/400 + m.x)*8;
    m.el.setAttribute('transform',`translate(${sx.toFixed(1)} ${sy.toFixed(1)}) scale(${m.face*m.s} ${m.s})`);
    if(m.tag) m.tag.setAttribute('transform',`scale(${m.face} 1)`);
    if(m.moving!==moving){ m.moving=moving; m.el.classList.toggle('walk',moving); }
  }
  requestAnimationFrame(animate);
}

const map=$('map'), world=$('world');
let scale=1;
let VBX=VX, VBY=VY, VBW=WW, VBH=WH;
function layout(){
  const vw=innerWidth, vh=innerHeight;
  scale = vw<700 ? Math.max(vw/WW, 0.6) : Math.max(vw/WW, vh/WH, Math.min(vw/1300, vh/800));
  // 畫面比世界大時，用天空往外延伸補滿（不留空白）
  // 上下多留空間：最上面的建築可以拉到上方欄下面、最下面的可以拉到工具列上面
  const padT=70/scale, padB=100/scale, H0=WH+padT+padB;
  VBW=Math.max(WW, vw/scale); VBH=Math.max(H0, vh/scale); VBX=VX-(VBW-WW)/2; VBY=VY-padT-(VBH-H0)/2;
  world.setAttribute('viewBox',`${VBX} ${VBY} ${VBW} ${VBH}`);
  world.setAttribute('width',(VBW*scale).toFixed(0)); world.setAttribute('height',(VBH*scale).toFixed(0));
  world.style.margin='0';
}
function centerOn(gx,gy,smooth){
  const [x,y]=iso(gx,gy), vh=innerHeight, wide=innerWidth>=700, topH=wide?230:110, botH=wide?90:120;
  map.scrollTo({left:(x-VBX)*scale-innerWidth/2, top:(y-VBY)*scale-(topH+(vh-topH-botH)/2), behavior:smooth?'smooth':'auto'});
}
let drag=null, moved=false;
map.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse') return; drag={x:e.clientX,y:e.clientY,sl:map.scrollLeft,st:map.scrollTop}; moved=false; });
addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!moved && Math.abs(dx)+Math.abs(dy)>6){ moved=true; map.classList.add('drag'); }
  if(moved){ map.scrollLeft=drag.sl-dx; map.scrollTop=drag.st-dy; } });
addEventListener('pointerup',()=>{ drag=null; map.classList.remove('drag'); });

const SETPREF = (k, v) => { try{ localStorage.setItem('ytzt_'+k, v?'1':'0'); }catch(e){} };
let LOWFX = PREF('low', (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || (navigator.deviceMemory && navigator.deviceMemory <= 2));

/* 背景音樂：第一次點畫面後開始播（瀏覽器規定），切到背景自動暫停 */
let BGM = null;
function bgmSync(){
  if(!BGM_ON || document.hidden){ if(BGM) BGM.pause(); return; }
  if(!BGM){ BGM = new Audio('assets/bgm.mp3?v='+(typeof BUILD!=='undefined'?BUILD:'')); BGM.loop = true; BGM.volume = 0.35; }
  const p = BGM.play(); if(p && p.catch) p.catch(()=>{});
}
addEventListener('pointerdown', ()=>{ if(BGM_ON && (!BGM || BGM.paused)) bgmSync(); }, {passive:true});

/* ================= 音效（WebAudio 即時合成，不用音檔） ================= */
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
addEventListener('pointerdown', ()=>{ if(SFX_ON) audio(); }, {once:true});
function tone(f1, f2, dur, type='sine', vol=0.18, delay=0){
  const a=audio(); if(!a) return; const t=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain(); o.type=type;
  o.frequency.setValueAtTime(f1,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, freq, vol=0.15, delay=0){
  const a=audio(); if(!a) return; const t=a.currentTime+delay;
  const b=a.createBuffer(1, a.sampleRate*dur, a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=0.8;
  const g=a.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(a.destination); s.start(t);
}
function sfx(n){
  if(!SFX_ON) return;
  try{
    if(n==='water'){ noise(0.5, 1800, 0.22); noise(0.35, 900, 0.12, 0.15); }
    else if(n==='seed'){ [0,0.07,0.14].forEach(d=>tone(700+Math.random()*300, 1100, 0.07, 'triangle', 0.12, d)); }
    else if(n==='harvest'){ tone(420, 880, 0.12, 'sine', 0.22); tone(1320, 0, 0.18, 'triangle', 0.12, 0.1); }
    else if(n==='coin'){ tone(1320, 0, 0.09, 'square', 0.07); tone(1760, 0, 0.16, 'square', 0.07, 0.08); }
    else if(n==='steal'){ noise(0.25, 2500, 0.15); tone(900, 500, 0.18, 'triangle', 0.12, 0.05); tone(1200, 0, 0.12, 'triangle', 0.1, 0.2); }
    else if(n==='prank'){ tone(300, 180, 0.3, 'sawtooth', 0.06); tone(240, 140, 0.3, 'sawtooth', 0.05, 0.12); }
    else if(n==='poof'){ noise(0.18, 1200, 0.15); tone(600, 300, 0.12, 'sine', 0.08); }
    else if(n==='lvup'){ [523,659,784,1047].forEach((f,k)=>tone(f, 0, 0.22, 'triangle', 0.14, k*0.1)); }
    else if(n==='dig'){ noise(0.2, 400, 0.25); }
    else if(n==='tap'){ tone(900, 0, 0.04, 'sine', 0.06); }
    else if(n==='err'){ tone(220, 180, 0.15, 'square', 0.05); }
  }catch(e){}
}
function vib(ms){ if(VIB_ON && navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

// 數字跳動
function tweenNum(el, to){
  if(!el) return; const from = +(el.dataset.v||to); el.dataset.v = to;
  if(from===to || LOWFX){ el.textContent = to.toLocaleString(); return; }
  const t0=performance.now(), d=600; el.parentElement && el.parentElement.classList.add('bump');
  const step=n=>{ const p=Math.min(1,(n-t0)/d); el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3))).toLocaleString(); if(p<1) requestAnimationFrame(step); else el.parentElement && el.parentElement.classList.remove('bump'); };
  requestAnimationFrame(step);
}

/* 箭頭＋光圈指向目標；目標在地圖上就把畫面捲過去 */
let tutFocused = null;
function tutPoint(el){
  const a=$('tutArrow'), ring=$('tutRing');
  if(!el){ a.style.display='none'; ring.style.display='none'; return; }
  const inMap = map.contains(el);
  if(inMap && tutFocused!==el){
    tutFocused = el;
    const r0=el.getBoundingClientRect(), boxTop=$('tut').getBoundingClientRect().top || innerHeight-300;
    const wantY = 150 + (boxTop-150)/2;
    map.scrollBy({left: r0.left + r0.width/2 - innerWidth/2, top: r0.top + r0.height/2 - wantY, behavior:'smooth'});
  }
  const r=el.getBoundingClientRect();
  const d=Math.max(56, Math.min(150, Math.max(r.width, r.height)*0.75)), cy=r.top+r.height/2;
  const up = cy-d/2 < 110;   // 目標在最上面：箭頭改放下面往上指
  a.textContent = up ? '👆' : '👇';
  a.style.display=''; a.style.left=(r.left+r.width/2)+'px'; a.style.top=(up ? cy+d/2+44 : cy-d/2+10)+'px';
  ring.style.display=''; ring.style.width=ring.style.height=d+'px'; ring.style.left=(r.left+r.width/2)+'px'; ring.style.top=(r.top+r.height/2)+'px';
}

/* ================= 每日簽到（7 天一輪） ================= */
const signedToday = () => S && S.me.sign_day && S.me.today && String(S.me.sign_day).slice(0,10)===String(S.me.today).slice(0,10);
function signNext(){ // 今天簽的話會是第幾天
  const me=S.me; if(signedToday()) return me.sign_n;
  const y=new Date(String(me.today).slice(0,10)+'T00:00:00Z'); y.setUTCDate(y.getUTCDate()-1);
  return (me.sign_day && String(me.sign_day).slice(0,10)===y.toISOString().slice(0,10) && me.sign_n<7) ? me.sign_n+1 : 1; }
function signBadge(){ const b=$('bSign'); if(b) b.classList.toggle('dot', !!S && !signedToday()); }
function openSign(){
  if(!S) return; const me=S.me, rws=me.sign_rw||[], done=signedToday(), cur=signNext();
  const cells = rws.slice(0,7).map((rw,i)=>{ const d=i+1, got = done ? d<=cur : d<cur, now=!done && d===cur;
    return `<div class="sgd ${got?'got':''} ${now?'now':''} ${d===7?'big':''}"><b>第 ${d} 天</b><div class="sgr">${rewardHTML(rw)}</div>${got?'<i>✓</i>':''}</div>`; }).join('');
  modal('✍️ 每日簽到', `<div class="rhint" style="text-align:center">連續簽到 7 天，第 7 天大獎！中斷一天會從第 1 天重新開始</div><div class="sgrid">${cells}</div>`,
    [[done?'今天簽到過了，明天再來':'✍️ 簽到領獎', done?'sub':'', async()=>{ if(signedToday()) return closeModal();
      try{ const r=await rpc('farm_sign'); applyState(r.state); refresh(); sfx('lvup'); fxConfetti(); signBadge(); openSign(); toast(`第 ${r.day} 天簽到成功！`); if(r.gift) toast(r.gift); }catch(e){ toast(e.message); } }]]);
}
let signAuto = false;
function signMaybePop(){ // 每天第一次進遊戲自動跳出（教學進行中不跳）

/* 自動播種要種什麼、自動餵食要拿什麼餵 */

  const opts = CROPS.filter(c=>(me.crops[c.id]||0)>0 || me.auto_feed===c.id).map(c=>`<option value="${c.id}" ${me.auto_feed===c.id?'selected':''}>${c.name}（穀倉 ${me.crops[c.id]||0} 個）</option>`).join('');
  return `<div class="autoseed">🥕 餵動物要用：<select id="aFeed"><option value="">（自動挑最便宜的作物）</option>${opts}</select></div><div class="rhint">手動餵食和自動餵食裝備都會用這個；指定的作物不夠就不會餵</div>`; }

/* 下一階裝備與升級按鈕（裝備欄、背包裡都能直接升級） */
const gearNext = g => g && GEAR_LIST.find(x=>x.func===g.func && x.tier===g.tier+1);
function gearUpBtn(g){ const me=S.me, n=gearNext(g); if(!n) return '<span class="tag" style="background:#E8F8EE;color:#2E9660">已滿階</span>';
  if(n.gold!=null && me.lv<n.lv) return `<span class="lock">Lv${n.lv} 可升級</span>`;
  const poor = n.gold!=null ? me.gold<n.gold : (me.gems||0)<n.gems, cost = n.gold!=null ? `${n.gold.toLocaleString()} 金` : `💎${n.gems}`;
  return `<button class="mini ${n.gems!=null?'gem':''}" data-gup="${n.id}" ${poor?'disabled':''}>⬆️ 升 ${ROMAN[n.tier]} 階<br>${cost}</button>`; }
function openGearBag(slot){
  slot=slot||0; const me=S.me, pt=JSON.parse(JSON.stringify(partyOf(me))), mem=pt[slot]||pt[0], own=Object.entries(me.gear||{}).filter(([id,n])=>n>0 && GEAR[id]).map(([id,n])=>[GEAR[id],n]).sort((a,b)=>GEAR_LIST.indexOf(a[0])-GEAR_LIST.indexOf(b[0]));

  body += cur ? `<div class="row gon"><div class="ic">${gearImg(cur,44)}</div><div class="tx"><b>${gearTitle(cur)}</b> <span class="tag">${GEAR_FUNC[cur.func][1]} ${GEAR_FUNC[cur.func][0]}</span><div>${gearDesc(cur)}</div>${gearNext(cur)?`<div class="gnext">下一階 ${esc(gearTitle(gearNext(cur)))}：${gearDesc(gearNext(cur))}</div>`:''}</div><div class="ibtns">${gearUpBtn(cur)}<button class="mini o" data-uneq>卸下</button></div></div>`

      <div class="ibtns">${mem.g===g.id?'<span class="tag" style="background:#E8F8EE;color:#2E9660">裝備中</span>':`<button class="mini" data-eq="${g.id}">${(used[g.id]||0)>=n?'換過來':'插上'}</button>`}${mem.g===g.id?'':gearUpBtn(g)}</div></div>`).join('')
    : `<div class="empty">還沒有裝備<br><small>可以在綜合商店買、收成時撿到寶箱，或升到 Lv5／10／15／20 領禮物</small></div>`;

    if((used[id]||0)>=n){ for(let i=pt.length-1;i>=0;i--){ if(i!==slot && pt[i].g===id){ pt[i].g=null; break; } } }
    pt[slot].g=id; await saveParty(pt,'裝備好了！'); openGearBag(slot); });
  md.querySelectorAll('[data-uneq]').forEach(b=>b.onclick=async()=>{ pt[slot].g=null; await saveParty(pt); openGearBag(slot); });

/* 裝備商店（升級制）：每種功能先買 I 階，再一階一階升級；I、II 階用金幣，III、IV 階用鑽石 */
const gearOwned = (me, f) => GEAR_LIST.filter(g=>g.func===f && ((me.gear||{})[g.id]||0)>0).sort((a,b)=>b.tier-a.tier)[0] || null;
function openGearShop(){
  if(mode==='visit') return toast('回到自己的農場才能買東西');
  const me=S.me, funcs=[...new Set(GEAR_LIST.map(g=>g.func==='clear'?'feed':g.func))];
  petShopTab='gear';
  let body=petShopTabs()+`<div class="rhint" style="margin-bottom:6px">每種裝備只能有 1 件。先買 I 階，之後升級會直接變成下一階（插在寵物身上的也會自動換新）。<br>🎁 自己動手收成有機會掉出 I／II 階裝備寶箱（成熟 1 小時以上的作物 ${Math.round((+(CFG_SET.gear_drop??0.01))*1000)/10}%${+(CFG_SET.gear_drop_daily??0)>0?`，每天最多 ${+CFG_SET.gear_drop_daily} 個`:''}）。</div>`;
  funcs.forEach(f=>{ const tiers=GEAR_LIST.filter(g=>(g.func==='clear'?'feed':g.func)===f).sort((a,b)=>a.tier-b.tier); if(!tiers.length) return;

    const prices=tiers.map(g=>`<span class="tpr${cur&&g.tier<=cur.tier?' on':''}">${ROMAN[g.tier]} ${g.gold!=null?`${g.gold.toLocaleString()}金`:`💎${g.gems}`}</span>`).join('');
    let btn;
    if(!next) btn=`<span class="tag" style="background:#E8F8EE;color:#2E9660">已滿階</span>`;
    else { const lock=next.gold!=null && me.lv<next.lv, poor=next.gold!=null ? me.gold<next.gold : (me.gems||0)<next.gems, cost=next.gold!=null?`${next.gold.toLocaleString()} 金`:`💎${next.gems}`;
      btn = lock ? `<span class="lock">Lv${next.lv} 解鎖</span>` : `<button class="mini ${next.gems!=null?'gem':''}" data-bg="${next.id}" ${poor?'disabled':''}>${cur?'升到 '+ROMAN[next.tier]+' 階':'購買'}<br>${cost}</button>`; }

  });
  modal(`綜合商店　<span style="font-size:14px;color:var(--ink2)">${S.me.gold.toLocaleString()} 金・💎${(S.me.gems||0).toLocaleString()}</span>`, body);
  const md=$('md'); bindPetShopTabs();
  md.querySelectorAll('[data-bg]').forEach(b=>b.onclick=async()=>{ const g=GEAR[b.dataset.bg], upgrade=g.tier>1;
    try{ applyState(await rpc('farm_buy_gear',{p_id:g.id})); refresh(); sfx(upgrade?'lvup':'coin');
      if(upgrade){ fxConfetti(); toast(`升級成 ${gearTitle(g)}！`); return openGearShop(); }

let DECOR = [], DEC = {}, DECOR_MAX = 40, OBST_FIXED = [], decorSig = '', EDIT = null;
const DEC_R = {"balloon":1.249,"bench":0.83,"carousel":1.346,"crystal":0.978,"dragon":1.071,"flag":1.602,"flower":0.796,"gifts":0.924,"hay":0.898,"kennel":0.966,"lamp":1.969,"lantree":1.1,"mail":1.291,"mush":1.058,"picnic":0.713,"pond":0.819,"pumpkin":0.924,"rainbow":0.793,"sakura":1.109,"snowman":1.151,"statue":1.313,"swing":1.113,"torii":1.266,"xmas":1.131};
function setDecorConfig(list, st){ if(list){ DECOR=list; DEC={}; list.forEach(d=>DEC[d.id]=d); } if(st && st.decor_max!=null) DECOR_MAX=+st.decor_max; }
const decW = id => (DEC[id] && DEC[id].w) || 70;
const bonusTxt = d => !d || !d.bonus ? '' : d.bonus==='prank' ? `擺出來：惡作劇體力上限 +${d.bonus_val}` : `擺出來：偷菜體力上限 +${d.bonus_val}`;

/* 位置能不能擺：在島上、不壓到建築、田、牧場 */
function decorOK(gx, gy){
  const [x,y]=iso(gx,gy);
  if(((x-ISL[0])/(ISL[2]*0.97))**2+((y-ISL[1])/(ISL[3]*0.95))**2>1) return false;
  for(const [ox,oy,rx,ry] of OBST_FIXED) if(((x-ox)/rx)**2+((y-oy)/ry)**2<1) return false;
  if(RANCH && gx>RANCH[0]-0.3 && gx<RANCH[0]+RANCH[2]+0.3 && gy>RANCH[1]-0.3 && gy<RANCH[1]+RANCH[3]+0.3) return false;
  for(const [px,py] of PLOTS) if(gx>px-0.25 && gx<px+PS+0.25 && gy>py-0.25 && gy<py+PS+0.25) return false;
  return true;
}
function curDecor(){ if(EDIT) return EDIT.list; if(mode==='visit' && V) return V.owner.decor_place||[]; return (S && S.me.decor_place)||[]; }

function renderDecor(force){
  const L = $('decorL'); if(!L) return;
  const list = curDecor();
  const sig = JSON.stringify(list) + (EDIT?('e'+EDIT.sel):'');
  if(!force && sig===decorSig) return; decorSig = sig;
  const idx = list.map((d,i)=>i).sort((a,b)=>(list[a].x+list[a].y)-(list[b].x+list[b].y));
  L.innerHTML = idx.map(i=>{ const d=list[i], w=decW(d.i), h=w*(DEC_R[d.i]||1), [x,y]=iso(d.x,d.y);
    const bad = EDIT && !decorOK(d.x,d.y), sel = EDIT && EDIT.sel===i;
    const img = `<image href="${A('dc_'+d.i)}" x="${(x-w/2).toFixed(1)}" y="${(y-h*0.85).toFixed(1)}" width="${w}" height="${h.toFixed(1)}"${d.f?` transform="translate(${2*x} 0) scale(-1 1)"`:''}/>`;
    return `<g data-di="${i}" class="dec${sel?' sel':''}${bad?' bad':''}">${sel?`<ellipse cx="${x}" cy="${y}" rx="${w*0.5}" ry="${w*0.22}" fill="${bad?'rgba(242,84,91,.35)':'rgba(255,255,255,.45)'}" stroke="${bad?'#F2545B':'#3BB273'}" stroke-width="3" stroke-dasharray="8 5"/>`:''}${img}</g>`; }).join('');
  // 寵物繞開裝飾
  OBST = OBST_FIXED.concat(list.map(d=>{ const w=decW(d.i), [x,y]=iso(d.x,d.y); return [x, y-w*0.06, w*0.4, w*0.2]; }));
}

function screenToGrid(cx, cy){ const W=$('world'), pt=W.createSVGPoint(); pt.x=cx; pt.y=cy; const p=pt.matrixTransform(W.getScreenCTM().inverse()); return W2G(p.x, p.y); }
function enterDecorEdit(addId){
  if(mode==='visit') return;

  if(!bar){ bar=document.createElement('div'); bar.id='editBar'; document.body.appendChild(bar); }
  bar.style.display='';
  if(addId) decorAdd(addId); else renderEditBar();

}
function renderEditBar(){
  const bar=$('editBar'), s=EDIT.sel>=0, inv=S.me.decor_inv||{}, used={};
  EDIT.list.forEach(d=>used[d.i]=(used[d.i]||0)+1);
  const left = DECOR.filter(d=>(inv[d.id]||0)>(used[d.id]||0));
  bar.innerHTML = `<div class="ebin">
    <div class="ebrow">${s?`<button class="mini sub" id="eFlip">↔️ 翻轉</button><button class="mini sub" id="eBack">📦 收回</button>`:`<span class="ebtip">點裝飾選取，按住拖曳移動（${EDIT.list.length}/${DECOR_MAX}）</span>`}</div>
    <div class="ebinv">${left.length?left.map(d=>`<button class="ebitem" data-ea="${d.id}"><img src="${A('dc_'+d.id)}" alt=""><span>${(inv[d.id]||0)-(used[d.id]||0)}</span></button>`).join(''):'<span class="ebtip">背包裡的裝飾都擺出來了</span>'}</div>
    <div class="ebrow"><button class="btn sub" id="eCancel">取消</button><button class="btn" id="eDone">✔ 完成</button></div></div>`;
  if(s){ $('eFlip').onclick=()=>{ const d=EDIT.list[EDIT.sel]; d.f=!d.f; renderDecor(true); };
         $('eBack').onclick=()=>{ EDIT.list.splice(EDIT.sel,1); EDIT.sel=-1; renderDecor(true); renderEditBar(); }; }
  bar.querySelectorAll('[data-ea]').forEach(b=>b.onclick=()=>decorAdd(b.dataset.ea));
  $('eCancel').onclick=()=>exitDecorEdit(false);
  $('eDone').onclick=()=>exitDecorEdit(true);
}
function decorAdd(id){
  if(EDIT.list.length>=DECOR_MAX) return toast(`最多只能擺 ${DECOR_MAX} 個`);
  let [gx,gy]=screenToGrid(innerWidth/2, innerHeight*0.45);
  // 中間不能擺就找附近的空位
  if(!decorOK(gx,gy)){ for(let r=0.5;r<8;r+=0.5){ let found=false; for(let a=0;a<12;a++){ const x=gx+Math.cos(a/12*Math.PI*2)*r, y=gy+Math.sin(a/12*Math.PI*2)*r; if(decorOK(x,y)){ gx=x; gy=y; found=true; break; } } if(found) break; } }
  EDIT.list.push({i:id, x:+gx.toFixed(2), y:+gy.toFixed(2), f:false}); EDIT.sel=EDIT.list.length-1;
  sfx('tap'); renderDecor(true); renderEditBar();
}
async function exitDecorEdit(save){

    if(EDIT.list.some(d=>!decorOK(d.x,d.y))) return toast('有裝飾擺在不能放的地方（紅色），移開再按完成');

/* 拖曳 */
let decDrag=null;
function bindDecorLayer(){
  const L=$('decorL'); if(!L || L._bound) return; L._bound=true;
  L.addEventListener('pointerdown', e=>{
    if(!EDIT) return; const g=e.target.closest('[data-di]'); if(!g) return;
    e.stopPropagation(); e.preventDefault();
    const i=+g.dataset.di, d=EDIT.list[i], [gx,gy]=screenToGrid(e.clientX,e.clientY);
    EDIT.sel=i; decDrag={i, dx:d.x-gx, dy:d.y-gy, id:e.pointerId};
    try{ L.setPointerCapture(e.pointerId); }catch(_){}
    renderDecor(true); renderEditBar();
  });
  L.addEventListener('pointermove', e=>{ if(!decDrag || e.pointerId!==decDrag.id) return; e.preventDefault();
    const [gx,gy]=screenToGrid(e.clientX,e.clientY), d=EDIT.list[decDrag.i]; d.x=+(gx+decDrag.dx).toFixed(2); d.y=+(gy+decDrag.dy).toFixed(2); renderDecor(true); });
  const end=e=>{ if(decDrag){ decDrag=null; } };
  L.addEventListener('pointerup', end); L.addEventListener('pointercancel', end);
  L.addEventListener('touchstart', e=>{ if(EDIT && e.target.closest('[data-di]')) e.preventDefault(); }, {passive:false});
  // 點空白處取消選取
  $('map').addEventListener('click', e=>{ if(EDIT && !e.target.closest('[data-di]') && EDIT.sel>=0){ EDIT.sel=-1; renderDecor(true); renderEditBar(); } });
}

  const inParty = partyOf(who).map(p=>p.s), list = ownedBeasts(who).filter(sp=>!inParty.includes(sp) && BST[sp]).slice(0, 12);
  const sig = list.map(sp=>petKey(sp,who)).join(',') + (mode==='visit'); if(sig===parkSig) return; parkSig = sig;
  const mv=$('movers'); if(!mv) return;

  const [cx,cy,r]=PARK;
  list.forEach(sp=>{ const k=petKey(sp, who), n=50, w=n*(CHR_RATIO[k]||1);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');

    mv.appendChild(g);

function syncParty(){
  const who = mode==='visit' && V ? V.owner : S && S.me; if(!who || !farmerMover) return;
  const pt = partyOf(who);
  setMoverChar(farmerMover, petKey(pt[0].s, who0()), pt[0].g);

  while(partyMovers.length > extra.length){ const m=partyMovers.pop(); m.el.remove(); const i=movers.indexOf(m); if(i>=0) movers.splice(i,1); }
  while(partyMovers.length < extra.length){
    const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.innerHTML='<g class="mvin"></g>'; mv.appendChild(g);
    let px=farmerMover.x, py=farmerMover.y; for(let t=0;t<30;t++){ const a=Math.random()*Math.PI*2, r=1+Math.random()*3, x=farmerMover.x+Math.cos(a)*r, y=farmerMover.y+Math.sin(a)*r; if(walkable(x,y)){ px=x; py=y; break; } }

/* 比對前後狀態，看出是寵物裝備自動做的事 → 叫對應的寵物跑過去 */
function autoJobs(a, b){
  if(typeof petDo!=='function') return;
  const A={}; (a.plots||[]).forEach(p=>A[p.i]=p);
  (b.plots||[]).forEach(p=>{ const o=A[p.i]; if(!o) return;
    if(o.s==='empty' && p.s==='grow') petDo('plant', p.i);
    else if(o.s==='grow' && p.s==='empty') petDo('harvest', p.i);
    else if(o.s==='grow' && p.s==='grow' && o.c===p.c){
      if((p.wu||0) > (o.wu||0) + 1000 && (o.wu||0) < Date.now()+(b.off||0)) petDo('water', p.i);
      if((p.w||0) < (o.w||0)) petDo('weed', p.i);
      if((p.b||0) < (o.b||0)) petDo('bug', p.i); } });
  const R={}; (a.ranch||[]).forEach(r=>R[r.slot]=r);
  (b.ranch||[]).forEach(r=>{ const o=R[r.slot]; if(!o) return;
    if(!o.ra && r.ra) petDo('feed', 'ranch');
    else if(o.ra && !r.ra) petDo('harvest', 'ranch');
    if((r.f||0) < (o.f||0)) petDo('swat', 'ranch'); });
}

// 依伺服器時間預測目前生長進度（實際以伺服器為準）
function pred(p, off){
  const q = Object.assign({}, p); q.dry = false;
  if(p.s !== 'grow') return q;
  const c = CROP[p.c], now = Date.now() + off;
  if(p.g < c.time){
    const el = Math.max(0, (now - p.t)/1000);
    const wet = Math.min(el, Math.max(0, ((p.wu||p.t) - p.t)/1000));
    q.g = Math.min(c.time, p.g + (wet + (el-wet)*0.5) * pestMul(p));
    q.dry = q.g < c.time && now > (p.wu||0);
  }
  return q;
}
function isDry(p){ return !!p.dry; }
function curPlots(){ const src = mode==='visit' ? V : S; return src.plots.map(p=>pred(p, src.off)); }
const partyMul = () => { const ow = mode==='visit' && V ? V.owner : (S && S.me), b = (ow && ow.buffs) || {}, now = Date.now() + ((mode==='visit'&&V?V.off:S&&S.off)||0);
  return (+(b.party||0) > now ? +(CFG_SET.party_grow ?? 1.2) : 1) * (+(b.grow||0) > now ? +(CFG_SET.speed_grow ?? 2) : 1); };
const pestMul = p => Math.max(1 - +(CFG_SET.pest_slow_max ?? 0.6), 1 - +(CFG_SET.pest_slow ?? 0.1) * ((p.w||0) + (p.b||0))) * partyMul();
/* 剩餘時間：加速卡、派對有到期時間，要分段算（到期後就回到正常速度，不會突然跳回去） */
const leftSec = p => { const c=CROP[p.c];
  const ow = mode==='visit' && V ? V.owner : (S && S.me), bf = (ow && ow.buffs) || {}, now = Date.now() + ((mode==='visit'&&V?V.off:S&&S.off)||0);
  const base = (p.dry?0.5:1) * Math.max(1 - +(CFG_SET.pest_slow_max ?? 0.6), 1 - +(CFG_SET.pest_slow ?? 0.1) * ((p.w||0) + (p.b||0)));
  const gEnd = +(bf.grow||0), pEnd = +(bf.party||0), gm = +(CFG_SET.speed_grow ?? 2), pm = +(CFG_SET.party_grow ?? 1.2);
  const cuts = [gEnd, pEnd].filter(t=>t>now).sort((a,b)=>a-b);
  let rem = c.time - p.g, t = now;
  for(const end of cuts){ const sp = base * (gEnd>t?gm:1) * (pEnd>t?pm:1), seg = (end - t)/1000;
    if(rem <= sp*seg) return (t - now)/1000 + rem/sp; rem -= sp*seg; t = end; }
  return (t - now)/1000 + rem/base; };

    if(!ripe) return toast(growing ? `${c.name}還沒成熟，約 ${fmt(leftSec(p))} 後` : '這塊地沒有可以偷的作物');
    if(p.mine) return toast('這塊地你已經偷過了');
    if(p.st >= p.cap) return toast('這塊地已經被偷光了，留點給主人吧');
    action = 'steal'; opt = q=>{ q.mine=true; };
  } else if(t==='hwater'){ if(!growing || ripe) return toast('這塊地不需要澆水'); if(!p.dry) return toast('土壤還很濕潤'); action='help_water'; opt=(q,cc)=>{ q.wu=srvNow()+wetDur(cc)*1000; }; }
  else if(t==='hweed'){ if(!growing || !p.w) return toast('這裡沒有雜草'); action='help_weed'; opt=q=>{ q.w=Math.max(0,(q.w||0)-1); }; }
  else if(t==='hbug'){ if(!growing || !p.b) return toast('這裡沒有蟲'); action='help_bug'; opt=q=>{ q.b=Math.max(0,(q.b||0)-1); }; }
  else if(t==='pweed' || t==='pbug'){
    if(!growing || ripe) return toast('只能在還沒成熟的作物上惡作劇');
    if(S.me.prank_left < 1) return toast(`惡作劇體力用完了${S.me.prank_regen>0?`，每 ${S.me.prank_regen} 分鐘回 1 點`:''}`);
    if(t==='pweed' && p.w>=3) return toast('這裡的草已經夠多了');
    if(t==='pbug' && p.b>=3) return toast('這裡的蟲已經夠多了');
    action = t==='pweed' ? 'prank_weed' : 'prank_bug';
    opt = q=>{ if(t==='pweed') q.w=(q.w||0)+1; else q.b=(q.b||0)+1; S.me.prank_left=Math.max(0,(S.me.prank_left||0)-1); };
  }
  // 先播動畫、改畫面
  if(action==='steal'){ try{ farmerDo(i,'steal'); }catch(e){} sfx('steal'); }
  else if(action==='help_water') fxWater(i);
  else if(action.startsWith('help')) fxPoof(i, action==='help_bug'?'bug':'weed');
  else fxSmoke(i);
  if(action.startsWith('help')) floatAt(el, action==='help_weed'?'幫忙除草！':action==='help_bug'?'幫忙除蟲！':'幫忙澆水！', action==='help_water'?'#BDE6FF':null);
  else if(action!=='steal') floatAt(el, action==='prank_weed'?'放了一棵草 😈':'放了一隻蟲 😈', '#FFD6E5');
  optPlot(i, opt);
  const owner = V.owner.id;
  const r = await queueRpc('farm_friend_act', {p_owner:owner, p_action:action, p_idx:i}, r=>{ applyState(r.state); if(mode==='visit' && V && V.owner.id===owner){ applyVisit(r.visit); } refresh(); });
  if(!r) return;
  if(r.ab==='dog'){ sfx('err'); vib(60); floatAt(el, '被看門狗趕走了！🐶', '#FFD6E5'); }
  else if(r.ab==='scare'){ sfx('err'); floatAt(el, '被稻草人擋下了！🎃', '#FFD6E5'); }
  else if(action==='steal'){ fxSteal(i, c); floatAt(el, `偷到 ${c.name} ×${r.qty}`, '#FFE066'); }
  xpFloat(el, r.xp);
  if(r.lvup) setTimeout(showLevelUp, 400);
  if(r.gift) setTimeout(()=>showGift(r.gift), r.lvup?1600:500);
}

function renderPlots(){
  if(!S) return;
  const P = curPlots();
  P.forEach(p=>{
    const i = p.i, el = plotEls[i]; if(!el) return;
    const st = p.s==='grow' ? stageOf(p) : -1;
    const sig = [mode, p.s, p.c, st, p.w, p.b, p.dry, p.s==='wild'?S.me.lv:0].join('|');
    if(sig !== plotSig[i]){ el.querySelector('.pg').innerHTML = plotGroundSVG(p,i); el.querySelector('.ps').innerHTML = plotSpriteSVG(p,i); plotSig[i] = sig; }
    el.classList.toggle('ripe', st===4);
    const L = plotLabs[i], t = L.querySelector('text'), r = L.querySelector('rect'), bb = L.querySelector('.bb'), bf = L.querySelector('.bf');
    L.style.display = (p.s==='wild'||p.s==='empty') ? 'none' : '';
    let txt='', pct=-1, bg='#fff', fg='#3A3226';
    if(p.s==='dead'){ txt = mode==='visit' ? '已收成' : '枯萎・剷除'; bg='#E8DCC8'; }
    else if(p.s==='grow'){ const c = CROP[p.c];
      if(st===4){
        if(mode==='visit'){
          if(p.mine){ txt='你偷過了'; bg='#E8DCC8'; }
          else if(p.st >= p.cap){ txt='被偷光了'; bg='#E8DCC8'; }
          else { txt='可以偷！'; bg='#F2545B'; fg='#fff'; }
        } else { txt='可收成！'; bg='#FF9F43'; fg='#fff'; }
      } else { txt = fmtS(leftSec(p)); if(p.dry) bg='#DDF0FF'; }
      // 血條＝作物完整度：雜草、蟲越多收成越少（最多少 5 成），滿血＝沒被破壞
      if(!(mode==='visit' && st===4)){ const maxLoss=Math.max(1, c.yield - Math.ceil(c.yield*0.6)), lost=Math.min(maxLoss, (p.w||0)+(p.b||0)); pct = 1 - lost/maxLoss; }
    }
    if(t.textContent !== txt){ t.textContent = txt; const w=[...txt].reduce((a,ch)=>a+(ch.charCodeAt(0)>255?15:8.5),0)+20; r.setAttribute('width', w.toFixed(0)); r.setAttribute('x', (-w/2).toFixed(0)); }
    r.setAttribute('fill', bg); t.setAttribute('fill', fg); t.setAttribute('stroke', fg==='#fff' ? '#3A3226' : '#fff'); t.setAttribute('y', pct>=0?2:5);
    bb.style.display = bf.style.display = pct>=0 ? '' : 'none';
    if(pct>=0){ bf.setAttribute('width', (60*Math.max(0.02,pct)).toFixed(1)); bf.setAttribute('fill', pct>0.66?'#4CC26A':pct>0.33?'#F5B731':'#F2545B'); bb.setAttribute('fill', pct<1?'#F7D2D2':'#E6EEDF'); }
  });
}
function renderHUD(){
  if(!S) return;
  const me = S.me;
  { const nh=esc(me.nickname)+ttlTag(me); if($('pname').innerHTML!==nh) $('pname').innerHTML=nh; } const avs = avSrc(me.avatar); if(!$('avatar').src.endsWith(avs)) $('avatar').src = avs; $('avatar').className='avatar avimg'+(me.frame?' fr '+me.frame:'');
  $('plv').textContent = 'Lv'+me.lv; tweenNum($('pgold'), me.gold);
  const need = needExp(me.lv);

  $('pexpt').textContent = me.lv>=MAX_LV ? 'MAX' : `${me.exp}/${need}`;
  tweenNum($('pgems'), me.gems||0);
  const n = Object.values(me.seeds).reduce((a,b)=>a+b,0);
  const bd = $('seedBadge'); if(bd){ bd.textContent=n; bd.style.display=n?'':'none'; }
  const pb = $('prankBadge'); if(pb){ pb.textContent=me.prank_left; }
  const PL = curPlots(); let h;
  if(mode==='visit'){
    const can = PL.filter(p=>p.s==='grow' && p.g>=CROP[p.c].time && !p.mine && p.st<p.cap).length;
    h = `你在 <b>${esc(V.owner.nickname)}</b>${ttlTag(V.owner)}（Lv${V.owner.lv}${V.friend?'・好友':''}）的農場・`;
    if(V.protected) h += '對方在<b>新手保護</b>中，不能偷菜和惡作劇';
    else { const vb=V.bin||{}, binOk=binCount(vb.items)>0 && !vb.mine && vb.left>0;
      h += (can ? `有 <b>${can}</b> 塊地可以偷！` : binOk ? '' : `惡作劇體力 😈${me.prank_left}${me.prank_max?'/'+me.prank_max:''}${regenTxt(me,'prank')}`) + (binOk ? `<b>收集倉</b>也可以偷！` : '') + (V.friend ? '' : `（偷菜體力 ⚡${me.steal_left}${me.steal_max?'/'+me.steal_max:''}${stealRegenTxt(me)}）`); }
    setHint(`<span>🧺</span><span>${h}</span>`); return;
  }
  const bn=binCount(me.bin), hungry=(S.ranch||[]).filter(r=>!r.ra).map(r=>(ANI[r.k]||{}).feed||0), crops=Object.values(me.crops||{}).reduce((a,b)=>a+b,0);
  if(hungry.length && crops < Math.min(...hungry) && bn>0) h=`🐔 穀倉的作物不夠餵牧場了！記得點<b>收集倉</b>把東西<b>收進穀倉</b>`;
  else if(bn>0) h=`🧺 <b>收集倉</b>有 ${bn} 個東西，記得點收集倉<b>收進穀倉</b>，避免被偷！`;
  else if(PL.some(p=>p.s==='grow'&&stageOf(p)===4)) h='有作物<b>成熟</b>了，快收成，小心被好友偷走！';
  else if(PL.some(p=>p.s==='grow'&&(p.w||p.b))) h='田裡長了<b>雜草或蟲</b>，會<b>減少收成</b>、讓作物長慢，快去清掉！';
  else if(PL.some(isDry)) h='有田地<b>缺水</b>了，澆水才能長得快';
  else if(PL.some(p=>p.s==='dead')) h='收成後的枯萎作物，用<b>鏟子</b>剷除就能再種';
  else if(PL.some(p=>p.s==='empty')) h = n?'點<b>空地</b>選種子種下去吧':'沒有種子了，到<b>穀倉的種子商店</b>買一些吧';
  else { const a=autoProgress(me);
    h = (a.pets<9||a.funcs<9) ? `🤖 寵物 ${a.pets}/9・裝備 ${a.funcs}/9 種：開滿 9 隻寵物、插上 9 種裝備，打造<b>全自動農場</b>，休息時間也在賺錢！` : '作物正在長大中…去<b>好友廣場</b>看看誰的菜可以偷'; }
  setHint(`<span>🌱</span><span>${h}</span>`);
}

const isAcctMail = e => String(e||'').toLowerCase().endsWith(ACCT_DOMAIN);
function acctToEmail(v, signup){
  v = String(v||'').trim();
  if(v.includes('@')) return v;
  const u = v.toLowerCase();
  if(!/^[a-z0-9_]{4,16}$/.test(u)) return signup ? null : u + ACCT_DOMAIN;
  return u + ACCT_DOMAIN;
}
async function doAuth(){
  const raw = $('email').value.trim(), pw = $('pw').value;
  if(!raw || !pw) return authMsg('請輸入帳號（或 Email）和密碼');
  const email = acctToEmail(raw, authMode==='signup');
  if(!email) return authMsg('帳號要 4–16 個英文小寫、數字或底線');
  const btn = $('authBtn'); btn.disabled = true;
  try{
    if(authMode==='signup'){
      if(pw.length < 6) return authMsg('密碼至少要 6 個字');
      if(pw !== $('pw2').value) return authMsg('兩次輸入的密碼不一樣');
      const {data, error} = await sb.auth.signUp({email, password:pw, options:{emailRedirectTo:SITE_URL}});
      if(error) return authMsg(zhErr(error.message));
      if(data.user && data.user.identities && data.user.identities.length===0) return authMsg('這個帳號已經有人使用了，請直接登入');
      if(!data.session) return authMsg(isAcctMail(email) ? '伺服器還沒開啟帳號密碼註冊，請先用試玩或 Google' : `驗證信已寄到 ${email}，請點信中的連結完成註冊`, !isAcctMail(email));
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password:pw});
      if(error) return authMsg(zhErr(error.message));
    }
  } finally { btn.disabled = false; }
}
async function forgotPw(){
  const email = $('email').value.trim();
  if(!email) return authMsg('請先在上面輸入你的 Email');
  if(!email.includes('@')) return authMsg('用帳號註冊的沒有綁 Email，沒辦法寄信重設密碼，請聯絡客服');
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo:SITE_URL});
  if(error) return authMsg(zhErr(error.message));
  authMsg(`重設密碼的信已寄到 ${email}`, true);
}

/* ================= 跑馬燈：誰的菜被誰偷了、誰被狗咬了 ================= */
let tkItems=[], tkX=0, tkW=0, tkLast=0;
function tkText(e){ const a=`<b>${esc(e.a)}</b>`, o=`<b>${esc(e.o)}</b>`;
  if(e.k==='steal') return `🧺 ${a} 偷走了 ${o} 的 ${e.q} 個${CROP[e.c]?.name||'作物'}`;
  if(e.k==='r_steal') return `🥚 ${a} 偷走了 ${o} 牧場的 ${e.q} 個${(ANIMALS.find(x=>x.good===e.c)||{}).good_name||'產品'}`;
  if(e.k==='dog') return `🐶 ${a} 想偷 ${o} 的菜，被看門狗咬了！`;
  if(e.k==='shout') return `<span class="tkshout">📢 ${a}：${esc(e.m||'')}</span>`;
  return ''; }
async function loadTicker(){
  try{ const on=+((CFG_SET||{}).ticker_on ?? 1)!==0, L=on?await rpc('farm_ticker'):[], ev=eventInfo(); const sig=(ev||'')+L.map(e=>e.t+e.a).join();
    if(sig===tkLast) return; tkLast=sig; tkItems=L;
    const el=$('tk'); if(!el) return;
    shoutSet(L.filter(e=>e.k==='shout'));
    const parts=(ev?[ev]:[]).concat(L.filter(e=>e.k!=='shout').map(tkText).filter(Boolean));
    el.innerHTML = parts.join('<span class="sep">｜</span>');
    $('ticker').classList.toggle('off', !parts.length);
    tkW=el.scrollWidth; tkX=$('ticker').clientWidth;
  }catch(e){}
}
let tkT=0;
function tkLoop(now){ requestAnimationFrame(tkLoop); const el=$('tk'); if(!el||!tkW) return;
  if(PAUSED() || now-tkT < 1000/FPS_CAP()-2){ if(PAUSED()) tkT=now; return; }
  const k=Math.min(4,(now-(tkT||now))/16.7); tkT=now;
  tkX -= ((typeof LOWFX!=='undefined'&&LOWFX) ? 0.6 : 0.9) * k; if(tkX < -tkW) tkX = $('ticker').clientWidth;
  el.style.transform=`translateX(${tkX.toFixed(1)}px)`; }
requestAnimationFrame(tkLoop);

/* ================= 大聲公：獨立的金色跑馬燈，一則一則輪流跑 ================= */
let sbList=[], sbIdx=0, sbX=0, sbW=0, sbSeen=new Set(), sbT=0;
function shoutSet(list){
  const bar=$('shoutBar'); if(!bar) return;
  const fresh = list.some(e=>!sbSeen.has(e.t+'|'+e.a));
  list.forEach(e=>sbSeen.add(e.t+'|'+e.a));
  const same = list.length===sbList.length && list.every((e,i)=>sbList[i] && sbList[i].t===e.t && sbList[i].a===e.a);
  sbList = list;
  bar.classList.toggle('off', !list.length);
  if(!list.length){ sbW=0; return; }
  if(fresh){ bar.classList.remove('pop'); void bar.offsetWidth; bar.classList.add('pop'); sbIdx = list.length-1; sbShow(); }
  else if(!same){ sbIdx = Math.min(sbIdx, list.length-1); sbShow(); }
}
function sbShow(){ const e=sbList[sbIdx]; if(!e) return; const el=$('sbTx');
  el.innerHTML = `<b>${esc(e.a)}</b>：${esc(e.m||'')}`; sbW = el.scrollWidth; sbX = el.parentNode.clientWidth; }
function sbLoop(now){ requestAnimationFrame(sbLoop); const el=$('sbTx'); if(!el||!sbW||!sbList.length) return;
  if(PAUSED() || now-sbT < 1000/FPS_CAP()-2){ if(PAUSED()) sbT=now; return; }
  const k=Math.min(4,(now-(sbT||now))/16.7); sbT=now;
  sbX -= ((typeof LOWFX!=='undefined'&&LOWFX) ? 0.8 : 1.2) * k;
  if(sbX < -sbW){ sbIdx = (sbIdx+1) % sbList.length; sbShow(); }
  el.style.transform=`translate(${sbX.toFixed(1)}px,-50%)`; }
requestAnimationFrame(sbLoop);
setInterval(()=>{ if(S && !document.hidden) loadTicker(); }, 45000);

function eventInfo(){ const c=CFG_SET||{}, now=Date.now()/1000, st=+c.ev_start||0, en=+c.ev_end||0;
  if(!(now>=st && now<=en)) return null;
  const m=[]; if(+c.ev_exp>1) m.push(`經驗 ×${+c.ev_exp}`); if(+c.ev_yield>1) m.push(`收成 ×${+c.ev_yield}`); if(+c.ev_gold>1) m.push(`賣價 ×${+c.ev_gold}`);
  const d=new Date(en*1000), t=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `🎉 <b>${esc(c.ev_name||'限時活動')}</b>${m.length?`：${m.join('、')}`:''}（到 ${t}）`; }

  document.querySelectorAll('#md [data-ac]').forEach(b=>b.onclick=()=>openAchs(b.dataset.ac));
}

/* ================= 被偷提醒：有人偷你的菜，畫面上方跳紅色提醒＋復仇按鈕 ================= */
let stealNew = 0, stealAlertT = 0, stealAlerted = 0;
const stealKey = () => 'ytzt_stealseen_' + (S && S.me.id);
function stealSeen(logs){ const t=Math.max(0, ...(logs||[]).map(l=>+l.at||0)); try{ if(t) localStorage.setItem(stealKey(), String(t)); }catch(e){} stealAlerted=Math.max(stealAlerted,t); stealNew=0; setStealBadge(); }
function setStealBadge(){ const lb=document.querySelector('[data-b="board"]'); if(lb) lb.classList.toggle('stolen', stealNew>0);
  const d=$('boardDot'); if(d){ d.style.display = stealNew>0 && mode!=='visit' ? '' : 'none'; const t=$('boardDotN'); if(t) t.textContent = stealNew>9?'9+':String(stealNew||'!'); } }
async function checkSteals(){
  if(!S || mode!=='home' || document.hidden) return;
  let logs; try{ logs = await rpc('farm_logs_get'); }catch(e){ return; }
  let seen=0; try{ seen=+localStorage.getItem(stealKey())||0; }catch(e){}
  if(!seen){ stealSeen(logs); return; }   // 第一次：不跳舊的
  const BADK = {steal:1, r_steal:1, prank_weed:1, prank_bug:1, r_prank:1};
  const fresh = logs.filter(l=>BADK[l.kind] && +l.at>seen && l.aid!==S.me.id);
  stealNew = fresh.length; setStealBadge();
  const newer = fresh.filter(l=>+l.at>stealAlerted);   // 紅點一直留到打開動態；跳出提醒只跳新的
  if(!newer.length) return;
  stealAlerted = Math.max(stealAlerted, ...newer.map(x=>+x.at));
  const l = newer[0], more = newer.length>1 ? `（還有 ${newer.length-1} 筆）` : '', isPrank = !(l.kind==='steal'||l.kind==='r_steal');
  const el = $('stealAlert');
  el.innerHTML = `<div class="sa-in"><span class="sa-ic">${isPrank?'😈':'🦹'}</span><div class="sa-tx"><b>${esc(l.who||'有人')}</b> ${(LOG_TXT[l.kind]||(()=>''))(l)}！${more}</div><button class="mini revenge" id="saGo">😤 復仇</button><button class="sa-x" id="saX">✕</button></div>`;
  el.classList.add('show'); sfx && sfx('err'); vib && vib([60,40,60]);
  $('saGo').onclick = ()=>{ el.classList.remove('show'); try{ localStorage.setItem(stealKey(), String(Math.max(...fresh.map(x=>+x.at)))); }catch(e){} stealNew=0; setStealBadge(); visit(l.aid); };
  $('saX').onclick = ()=>{ el.classList.remove('show'); };
  clearTimeout(stealAlertT); stealAlertT = setTimeout(()=>el.classList.remove('show'), 12000);
}
setInterval(checkSteals, 30000); setTimeout(checkSteals, 6000);

/* 偷陌生人次數：用掉後每 N 分鐘回 1 次 */
function regenTxt(me, k){ if(!me || !(+me[k+'_regen']>0)) return ''; if(me[k+'_next']==null) return `，每 ${+me[k+'_regen']} 分鐘回 1 點`;
  const s=Math.max(0, me[k+'_next'] - Math.floor((Date.now()-(me._stAt||Date.now()))/1000)); return `，${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} 後回 1 點`; }
const stealRegenTxt = me => regenTxt(me, 'steal');
