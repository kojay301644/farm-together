<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>一起種田吧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3A3226; --ink2:#7A6E5D; --card:#FFFFFF; --line:#EFE6D8;
  --green:#3BB273; --green-d:#2E9660; --orange:#FF9F43; --orange-d:#F0851A;
  --gold:#FFC93C; --sky1:#AEE1FF; --sky2:#E8F7FF; --grass:#8ACB5B; --grass-d:#6DB548;
  --red:#F2545B; --blue:#3DA5F4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:#8FD3F4;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}

/* 地圖 */
#map{position:fixed;inset:0;overflow:auto;scrollbar-width:none;cursor:grab}
#map::-webkit-scrollbar{display:none}
#map.drag{cursor:grabbing}
#world{display:block}
.tap{cursor:pointer}
.tap.hit{animation:hit .25s ease-out}
@keyframes hit{50%{transform:translateY(-4px)}}
.tap.hit{transform-box:fill-box;transform-origin:center bottom}
.ripe .crop{animation:bob 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{50%{transform:translateY(-2px) scale(1.04)}}
.spark{animation:tw 1.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.blades{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1700px)}}
.flow{stroke-dasharray:14 22;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.wave{animation:wave 3s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(4px);opacity:.5}}
.walk .lg1{animation:lg 0.5s ease-in-out infinite}
.walk .lg2{animation:lg 0.5s ease-in-out infinite reverse}
@keyframes lg{50%{transform:translateY(-2px)}}
.walk .bd{animation:bdy .5s ease-in-out infinite}
@keyframes bdy{50%{transform:translateY(-1px)}}
.smoke{animation:smk 3s ease-out infinite}
@keyframes smk{from{transform:translateY(0);opacity:.8}to{transform:translateY(-26px);opacity:0}}
.plab{pointer-events:none}

/* 上方資訊 */
.hud{position:fixed;left:0;right:0;top:0;z-index:20;padding:10px 10px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.top{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.96);border-radius:20px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;flex:none}
.who{flex:1;min-width:0}
.who .nm{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:700}
.lvtag{background:var(--green);color:#fff;border-radius:8px;padding:0 7px;font-weight:900}
.bar{flex:1;height:8px;background:#EEF2E6;border-radius:8px;overflow:hidden;max-width:160px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7ED957,var(--green));border-radius:8px;transition:width .4s}
.gold{display:flex;align-items:center;gap:6px;background:#FFF6DB;border-radius:14px;padding:6px 12px;font-weight:900;font-size:16px}
.coin{width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -2px 0 #E8A919;display:inline-block;position:relative}
.coin:after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid #E8A919}
.hint{max-width:720px;margin:8px auto 0;background:rgba(255,255,255,.92);border-radius:14px;padding:7px 12px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.hint b{color:var(--green-d)}

/* 工具列 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.dock-in{max-width:720px;margin:0 auto;background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 -2px 14px rgba(0,0,0,.1),0 4px 0 rgba(0,0,0,.08);padding:8px;pointer-events:auto}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tool{background:#F6F1E8;border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;color:var(--ink2);position:relative}
.tool svg{width:30px;height:30px}
.tool.on{background:#E3F6EA;color:var(--green-d);box-shadow:inset 0 0 0 2px var(--green)}
.tool .badge{position:absolute;top:2px;right:4px;background:var(--orange);color:#fff;border-radius:8px;font-size:10px;padding:0 5px}
.home{max-width:720px;margin:0 auto 8px;display:flex;justify-content:flex-end;pointer-events:none}
.home button{pointer-events:auto;background:#fff;border-radius:16px;padding:7px 12px;font-weight:900;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.1);display:flex;align-items:center;gap:4px}

/* 視窗 */
.ov{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:12px}
.ov.show{display:flex}
@media(min-width:560px){.ov{align-items:center}}
.md{background:var(--card);width:100%;max-width:520px;max-height:84vh;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(20px);opacity:0}}
.md h3{margin:0;padding:16px 18px 10px;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:space-between}
.md .x{background:#F3EEE5;width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:900}
.md .bd{padding:0 18px 12px;overflow:auto}
.md .ft{padding:10px 18px 16px;display:flex;gap:8px}
.btn{flex:1;background:var(--green);color:#fff;font-weight:900;font-size:15px;padding:11px;border-radius:14px;box-shadow:0 3px 0 var(--green-d)}
.btn.sub{background:#EFE9DF;color:var(--ink);box-shadow:0 3px 0 #DDD3C3}
.btn.o{background:var(--orange);box-shadow:0 3px 0 var(--orange-d)}
.btn.r{background:var(--red);box-shadow:0 3px 0 #C93D44}
.btn:disabled,.mini:disabled{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:54px;height:46px;flex:none;background:#F4F9EC;border-radius:12px}
.row .ic svg{width:100%;height:100%}
.row .tx{flex:1;min-width:0}
.row .tx b{font-size:15px}
.row .tx div{font-size:12px;color:var(--ink2);font-weight:700}
.mini{background:var(--green);color:#fff;font-weight:900;font-size:13px;padding:7px 10px;border-radius:10px;box-shadow:0 2px 0 var(--green-d);white-space:nowrap}
.mini.o{background:var(--orange);box-shadow:0 2px 0 var(--orange-d)}
.lock{font-size:12px;font-weight:900;color:#B0A592;background:#F3EEE5;border-radius:10px;padding:6px 10px}
.tag{display:inline-block;background:#FFF1DC;color:var(--orange-d);border-radius:6px;padding:0 6px;font-size:11px;font-weight:900;margin-left:4px}
.sec{font-size:13px;font-weight:900;color:var(--ink2);margin:12px 0 2px}
.empty{color:var(--ink2);text-align:center;padding:22px 0;font-weight:700;font-size:14px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:#F3EEE5;border-radius:10px;padding:8px 0;font-weight:900}
.seg button.on{background:var(--green);color:#fff}

.toast{position:fixed;left:50%;top:120px;transform:translateX(-50%);background:rgba(58,50,38,.92);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.fl{position:fixed;z-index:70;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:up 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes up{to{transform:translate(-50%,-46px);opacity:0}}

/* 登入 */
.login{position:fixed;inset:0;z-index:100;background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--grass) 55%);display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{background:#fff;border-radius:28px;padding:26px 22px;width:100%;max-width:380px;text-align:center;box-shadow:0 6px 0 var(--line)}
.logo{font-size:34px;font-weight:900;color:var(--green-d);letter-spacing:2px;margin:6px 0 2px}
.logo span{color:var(--orange)}
.login p{color:var(--ink2);font-weight:700;font-size:13px;margin:4px 0 16px}
.login input{width:100%;font-family:inherit;font-size:17px;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--line);outline:none;text-align:center;margin-bottom:12px;color:var(--ink)}
.login input:focus{border-color:var(--green)}
.login input{margin-bottom:10px}
.amsg{font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
.link{background:none;color:var(--ink2);font-weight:700;font-size:13px;text-decoration:underline;margin-top:6px}
.or{display:flex;align-items:center;gap:10px;color:#B0A592;font-size:12px;font-weight:700;margin:12px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;font-weight:900;font-size:15px}
.gbtn.off{opacity:.5}
.tabs{display:flex;gap:6px;margin-bottom:6px;position:sticky;top:0;background:#fff;padding-bottom:6px;z-index:1}
.tabs button{flex:1;background:#F3EEE5;border-radius:10px;padding:8px 0;font-weight:900;font-size:13px}
.tabs button.on{background:var(--green);color:#fff}
.dot{font-style:normal;background:var(--red);color:#fff;border-radius:8px;padding:0 6px;font-size:11px}
.avatar.sm{width:40px;height:40px;font-size:16px;flex:none}
.mini.sub{background:#EFE9DF;color:var(--ink);box-shadow:0 2px 0 #DDD3C3}
.inp{flex:1;font-family:inherit;font-size:15px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);outline:none;color:var(--ink);min-width:0}
.inp:focus{border-color:var(--green)}
.note{font-size:11px;color:#A89C88;margin-top:12px;font-weight:700}
</style>
</head>
<body>

<div class="login" id="login" style="display:flex">
  <div class="card" id="loginCard">
    <svg viewBox="0 0 120 70" width="130" aria-hidden="true">
      <rect x="10" y="40" width="100" height="26" rx="12" fill="#A06F49"/>
      <rect x="10" y="40" width="100" height="7" rx="3.5" fill="#B98258"/>
      <g transform="translate(0,-6)"><ellipse cx="40" cy="38" rx="6" ry="15" fill="#6CC655" transform="rotate(-20 40 38)"/><ellipse cx="50" cy="36" rx="6" ry="16" fill="#5DB54A"/><ellipse cx="45" cy="50" rx="11" ry="8" fill="#FF8A3D"/></g>
      <g><circle cx="74" cy="34" r="12" fill="#5DB54A"/><circle cx="86" cy="36" r="11" fill="#6CC655"/><circle cx="80" cy="27" r="11" fill="#7CC85A"/><circle cx="74" cy="36" r="5" fill="#F2545B"/><circle cx="87" cy="33" r="5" fill="#F2545B"/><circle cx="81" cy="25" r="4.5" fill="#F2545B"/></g>
    </svg>
    <div class="logo">一起<span>種田</span>吧</div>
    <p>種菜、收成、和朋友一起偷菜</p>
    <div class="seg" style="margin-bottom:12px"><button data-am="login" class="on">登入</button><button data-am="signup">註冊</button></div>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="密碼（至少 6 個字）" autocomplete="current-password">
    <input id="pw2" type="password" placeholder="再輸入一次密碼" autocomplete="new-password" style="display:none">
    <button class="btn" id="authBtn" style="width:100%">登入</button>
    <div id="authMsg" class="amsg"></div>
    <button class="link" id="forgot">忘記密碼？</button>
    <div class="or"><span>或</span></div>
    <button class="gbtn" id="gBtn"><svg viewBox="0 0 48 48" width="20" height="20"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>用 Google 帳號登入</button>
  </div>
  <div class="card" id="nickCard" style="display:none">
    <div class="logo" style="font-size:26px">幫自己取個名字</div>
    <p>好友會用這個暱稱找到你（1～10 個字，之後不能改）</p>
    <input id="nickIn" maxlength="10" placeholder="輸入暱稱" autocomplete="off">
    <button class="btn" id="nickBtn" style="width:100%">開始種田</button>
    <button class="link" id="nickOut">換一個帳號</button>
  </div>
</div>

<div id="map" style="display:none"><svg id="world" xmlns="http://www.w3.org/2000/svg"></svg></div>

<div class="hud" id="hud" style="display:none">
  <div class="top">
    <div class="avatar" id="avatar">農</div>
    <div class="who">
      <div class="nm" id="pname"></div>
      <div class="lvrow"><span class="lvtag" id="plv">Lv1</span><div class="bar"><i id="pexp"></i></div><span id="pexpt"></span></div>
    </div>
    <div class="gold"><span class="coin"></span><span id="pgold">0</span></div>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div class="dock" id="dock" style="display:none">
  <div class="home"><button id="bHome">🌾 回到農田</button></div>
  <div class="dock-in"><div class="tools" id="tools"></div></div>
</div>

<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>

<script src="supabase.js"></script>
<script>
/* ================= 遊戲資料 ================= */
const CROPS = [
  {id:'radish',    name:'白蘿蔔', lv:1, seed:10,  time:120,   yield:8,  price:3,  exp:4,   type:'root',  color:'#F7F4EA', edge:'#D9D2C0'},
  {id:'carrot',    name:'紅蘿蔔', lv:1, seed:16,  time:300,   yield:10, price:3,  exp:6,   type:'root',  color:'#FF8A3D'},
  {id:'cabbage',   name:'高麗菜', lv:2, seed:30,  time:900,   yield:10, price:6,  exp:10,  type:'leafy', color:'#A6D96A'},
  {id:'corn',      name:'玉米',   lv:3, seed:50,  time:1800,  yield:12, price:7,  exp:16,  type:'stalk', color:'#FFD23F'},
  {id:'tomato',    name:'番茄',   lv:4, seed:80,  time:3600,  yield:14, price:9,  exp:24,  type:'bush',  color:'#F2545B', fruit:'round'},
  {id:'eggplant',  name:'茄子',   lv:5, seed:110, time:7200,  yield:14, price:12, exp:32,  type:'bush',  color:'#7B4BB7', fruit:'long'},
  {id:'strawberry',name:'草莓',   lv:6, seed:160, time:10800, yield:16, price:15, exp:45,  type:'bush',  color:'#E8384F', fruit:'berry'},
  {id:'pumpkin',   name:'南瓜',   lv:7, seed:220, time:14400, yield:12, price:28, exp:60,  type:'ground',color:'#FF9F1C'},
  {id:'watermelon',name:'西瓜',   lv:8, seed:300, time:21600, yield:10, price:48, exp:80,  type:'ground',color:'#3E9B4F', stripe:true},
  {id:'grape',     name:'葡萄',   lv:9, seed:400, time:28800, yield:16, price:38, exp:110, type:'bush',  color:'#8E5CC9', fruit:'grape'},
];
const CROP = Object.fromEntries(CROPS.map(c=>[c.id,c]));
const WILD = [null,null,null,null,{cost:100,lv:1},{cost:300,lv:2}]; // 第5、6塊是荒地
const MAX_LV = 30;
const needExp = lv => 30*lv*lv;
const wetDur = c => Math.min(3600, Math.max(45, c.time*0.3));
/* ================= 美術（向量繪製） ================= */
const L = (cx,cy,rx,ry,rot,f)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="${f}"/>`;
const UNRIPE = '#B6DB7A';

function cropArt(c, st){
  if(st===0) return `<ellipse cx="60" cy="74" rx="14" ry="5" fill="#8B5A3A"/><circle cx="54" cy="72" r="2" fill="#F0DFAE"/><circle cx="61" cy="70" r="2" fill="#F0DFAE"/><circle cx="67" cy="73" r="2" fill="#F0DFAE"/>`;
  if(st===1) return `<rect x="58.5" y="62" width="3" height="12" rx="1.5" fill="#5DB54A"/>${L(53,62,8,4,-30,'#7CC85A')}${L(67,62,8,4,30,'#7CC85A')}`;
  if(st===2) return `<rect x="58" y="52" width="4" height="22" rx="2" fill="#5DB54A"/>${L(47,58,13,6,-30,'#6CC655')}${L(73,58,13,6,30,'#6CC655')}${L(52,48,10,5,-60,'#7CC85A')}${L(68,48,10,5,60,'#7CC85A')}`;
  const ripe = st===4, k = ripe?1:0.75, col = ripe?c.color:UNRIPE;
  switch(c.type){
    case 'root':
      return `${L(50,52,7,17,-25,'#5DB54A')}${L(70,52,7,17,25,'#5DB54A')}${L(60,48,7,19,0,'#6CC655')}
        <ellipse cx="60" cy="72" rx="${13*k}" ry="${9*k}" fill="${ripe?c.color:'#E8D9B5'}" ${c.edge&&ripe?`stroke="${c.edge}" stroke-width="1.5"`:''}/>
        <path d="M54 72 h5 M61 75 h5" stroke="rgba(0,0,0,.12)" stroke-width="1.5" stroke-linecap="round"/>`;
    case 'leafy':
      return `<circle cx="60" cy="64" r="${22*k}" fill="#7FBF4D"/><circle cx="60" cy="63" r="${16*k}" fill="${ripe?c.color:'#93CF62'}"/><circle cx="60" cy="62" r="${9*k}" fill="#CDEB8F"/>
        <path d="M60 ${63-14*k} V${63+14*k}" stroke="#7FBF4D" stroke-width="1.5"/>`;
    case 'stalk':
      return `<rect x="58" y="${ripe?18:28}" width="4" height="${ripe?58:48}" rx="2" fill="#6DB548"/>${L(47,54,5,17,-40,'#5DB54A')}${L(73,48,5,17,40,'#6CC655')}${L(48,40,4,12,-50,'#7CC85A')}
        <ellipse cx="67" cy="40" rx="${6*k}" ry="${13*k}" fill="${col}"/>${ripe?'<path d="M64 32 h6 M64 38 h6 M64 44 h6" stroke="#E8B520" stroke-width="1.2"/>':''}
        ${L(64,46,4,10,15,'#8CCB5E')}<path d="M60 ${ripe?18:28} l-5 -8 M60 ${ripe?18:28} l0 -9 M60 ${ripe?18:28} l5 -8" stroke="#D9B44A" stroke-width="2" stroke-linecap="round"/>`;
    case 'bush': {
      const pts = [[47,62],[71,63],[59,48],[58,68],[66,53]];
      let fr = '';
      for(const [x,y] of pts){
        if(c.fruit==='round') fr += `<circle cx="${x}" cy="${y}" r="${6*k}" fill="${col}"/><rect x="${x-2}" y="${y-7*k}" width="4" height="3" rx="1" fill="#3E8E3A"/>`;
        else if(c.fruit==='long') fr += `<ellipse cx="${x}" cy="${y+2}" rx="${4*k}" ry="${8*k}" fill="${col}"/><rect x="${x-3}" y="${y-7*k}" width="6" height="3" rx="1.5" fill="#3E8E3A"/>`;

function fmt(sec){

function building(o){
  const A=iso(o.x,o.y),B=iso(o.x+o.w,o.y),C=iso(o.x+o.w,o.y+o.d),D=iso(o.x,o.y+o.d);
  const h=o.h, rh=o.rh;
  const R1=up(mid(A,D),h+rh), R2=up(mid(B,C),h+rh);
  let s = `<ellipse cx="${mid(A,C)[0]}" cy="${mid(A,C)[1]+6}" rx="${(B[0]-D[0])/2+8}" ry="${(C[1]-A[1])/2+5}" fill="rgba(0,0,0,.12)"/>`;
  s += poly([D,C,up(C,h),up(D,h)], o.wallL) + poly([C,B,up(B,h),up(C,h)], o.wallR);
  s += `<path d="M${P([D,C,B])}" stroke="rgba(0,0,0,.12)" stroke-width="3" fill="none"/>`;
  if(o.deco) s += o.deco(D,C,B,h);
  s += poly([up(A,h),up(B,h),R2,R1], o.roofB);
  s += poly([up(C,h),up(B,h),R2], o.wallR) + `<path d="M${P([up(C,h),R2,up(B,h)])}" stroke="${o.roofB}" stroke-width="4" fill="none" stroke-linejoin="round"/>`;
  const e=4, Df=[up(D,h)[0]-e,up(D,h)[1]+e*0.5], Cf=[up(C,h)[0]+e*0.3,up(C,h)[1]+e];
  s += poly([Df,Cf,R2,R1], o.roofF);
  s += `<path d="M${P([Df,Cf])}" stroke="rgba(0,0,0,.18)" stroke-width="3"/>`;
  for(let k=1;k<=3;k++){ const t=k/4; const p1=[Df[0]+(R1[0]-Df[0])*t, Df[1]+(R1[1]-Df[1])*t], p2=[Cf[0]+(R2[0]-Cf[0])*t, Cf[1]+(R2[1]-Cf[1])*t]; s+=`<path d="M${P([p1,p2])}" stroke="rgba(255,255,255,.18)" stroke-width="2"/>`; }
  if(o.top) s += o.top(R1,R2);
  const L = up(mid(R1,R2), 26);
  return {svg:s, label:L, depth:o.x+o.w/2+o.y+o.d/2};
}

/* 移動動畫 */
let lastF=performance.now();
function animate(now){
  const dt=Math.min(0.1,(now-lastF)/1000); lastF=now;
  for(const m of movers){
    let moving=false;
    if(m.wait>0){ m.wait-=dt; }
    else {
      if(!m.goal){
        if(m.chick){ const a=m.area; m.goal=[a[0]+Math.random()*(a[2]-a[0]), a[1]+Math.random()*(a[3]-a[1])]; }
        else { m.goal=m.path[m.tgt]; }
      }
      const dx=m.goal[0]-m.x, dy=m.goal[1]-m.y, dist=Math.hypot(dx,dy), step=m.speed*dt;
      if(dist<=step){ m.x=m.goal[0]; m.y=m.goal[1]; m.goal=null;
        if(m.chick) m.wait=0.6+Math.random()*2.5; else { m.tgt=1-m.tgt; m.wait=1+Math.random()*3; } }
      else { m.x+=dx/dist*step; m.y+=dy/dist*step; moving=true;
        const sdx=(dx-dy); if(Math.abs(sdx)>0.01) m.face = sdx>0?1:-1; }
    }
    const [sx,sy]=iso(m.x,m.y);
    m.el.setAttribute('transform',`translate(${sx.toFixed(1)} ${sy.toFixed(1)}) scale(${m.face*m.s} ${m.s})`);
    if(m.moving!==moving){ m.moving=moving; m.el.classList.toggle('walk',moving); }
  }
  requestAnimationFrame(animate);
}

// 依伺服器時間預測目前生長進度（實際以伺服器為準）
function pred(p, off){
  const q = Object.assign({}, p); q.dry = false;
  if(p.s !== 'grow') return q;
  const c = CROP[p.c], now = Date.now() + off;
  if(p.g < c.time){
    const el = Math.max(0, (now - p.t)/1000);
    const wet = Math.min(el, Math.max(0, ((p.wu||p.t) - p.t)/1000));
    q.g = Math.min(c.time, p.g + wet + (el-wet)*0.5);
    q.dry = q.g < c.time && now > (p.wu||0);
  }
  return q;
}
function isDry(p){ return !!p.dry; }
function curPlots(){ const src = mode==='visit' ? V : S; return src.plots.map(p=>pred(p, src.off)); }
const leftSec = p => { const c=CROP[p.c]; return (c.time - p.g)/(p.dry?0.5:1); };

function showLevelUp(){
  const lv = S.me.lv;
  const un = CROPS.filter(c=>c.lv===lv).map(c=>c.name);
  const w = WILD.filter(x=>x && x.lv===lv).length;
  modal('升級了！', `<div style="text-align:center;padding:10px 0 4px">
    <div style="font-size:46px;font-weight:900;color:var(--green-d)">Lv${lv}</div>
    ${un.length?`<div style="font-weight:700;margin-top:6px">解鎖新作物：<b style="color:var(--orange-d)">${un.join('、')}</b></div>`:''}
    ${w?`<div style="font-weight:700;margin-top:4px">可以開墾新的荒地了</div>`:''}
    <div style="color:var(--ink2);font-size:13px;margin-top:8px">到種子商店看看新種子吧</div></div>`, [['太好了','',closeModal]]);
}
function xpFloat(el, xp){ if(xp>0 && el) setTimeout(()=>floatAt(el, `+${xp} 經驗`, '#C8F7A0'), 160); }

/* ================= 自己農場的動作 ================= */
async function doAct(action, i, crop, n){
  if(ui.busy) return null;
  ui.busy = true;
  try{
    const r = await rpc('farm_act', {p_action:action, p_idx:(i==null?null:i), p_crop:crop||null, p_n:n||1});
    applyState(r.state); refresh();
    if(r.lvup) setTimeout(showLevelUp, 400);
    return r;
  }catch(e){ toast(e.message); return null; }
  finally{ ui.busy = false; }
}

async function act(i){
  if(mode==='visit') return actVisit(i);
  const p = curPlots()[i], el = plotEls[i], c = p.c && CROP[p.c], tool = ui.tool;
  if(p.s==='wild') return askTill(i);
  let r;
  if(tool==='hand'){
    if(p.s==='empty') return openSeedPicker(i);
    if(p.s==='dead'){ r = await doAct('clear', i); if(r){ floatAt(el,'整地完成'); xpFloat(el,r.xp); } return; }
    if(p.g >= c.time){
      r = await doAct('harvest', i);
      if(r){ floatAt(el, `${c.name} +${r.amt}`, '#FFE066'); xpFloat(el, r.xp);
        if(r.amt < c.yield) setTimeout(()=>toast(`雜草、蟲害或被偷，產量少了 ${c.yield-r.amt} 個`), 300); }
      return;
    }
    const issues = [p.w?`雜草×${p.w}`:'', p.b?`蟲×${p.b}`:'', p.dry?'缺水':''].filter(Boolean).join('、');
    return toast(`${c.name}：約 ${fmt(leftSec(p))} 後成熟${issues?'｜'+issues:''}`);
  }
  if(tool==='seed'){
    if(p.s!=='empty') return toast(p.s==='dead'?'先用鏟子剷除枯萎的作物':'這塊地已經種了東西');
    if(!(S.me.seeds[ui.seed]>0)) return openSeedPicker(i);
    return plant(i, ui.seed);
  }
  if(tool==='water'){
    if(p.s!=='grow' || p.g>=c.time) return toast('這塊地不需要澆水');
    if(!p.dry) return toast('土壤還很濕潤，晚點再澆');
    r = await doAct('water', i); if(r){ floatAt(el,'澆水！','#BDE6FF'); xpFloat(el,r.xp); } return;
  }
  if(tool==='weed'){
    if(p.s!=='grow' || !p.w) return toast('這裡沒有雜草');
    r = await doAct('weed', i); if(r){ floatAt(el,'除草！'); xpFloat(el,r.xp); } return;
  }
  if(tool==='bug'){
    if(p.s!=='grow' || !p.b) return toast('這裡沒有蟲');
    r = await doAct('bug', i); if(r){ floatAt(el,'除蟲！'); xpFloat(el,r.xp); } return;
  }
  if(tool==='shovel'){
    if(p.s==='dead'){ r = await doAct('clear', i); if(r){ floatAt(el,'整地完成'); xpFloat(el,r.xp); } return; }
    if(p.s==='grow') return modal('剷除作物', `<p style="font-weight:700">確定要剷除還沒收成的<b>${c.name}</b>嗎？種子不會退回。</p>`,
      [['取消','sub',closeModal],['剷除','r',async()=>{ closeModal(); await doAct('dig', i); }]]);
    return toast('這塊地是空的');
  }
}
async function plant(i, id){
  const r = await doAct('plant', i, id);
  if(r) floatAt(plotEls[i], `種下${CROP[id].name}`);
}
function askTill(i){
  const w = WILD[i];
  if(S.me.lv < w.lv) return toast(`需要 Lv${w.lv} 才能開墾這塊荒地`);
  modal('開墾荒地', `<p style="font-weight:700;text-align:center">花 <b style="color:var(--orange-d)">${w.cost}</b> 金幣開墾這塊荒地？</p>`,
    [['取消','sub',closeModal],['開墾','o',async()=>{
      if(S.me.gold < w.cost) return toast('金幣不夠喔');
      closeModal(); const r = await doAct('till', i);
      if(r){ floatAt(plotEls[i],'開墾成功！'); xpFloat(plotEls[i], r.xp); }
    }]]);
}

/* ================= 好友農場的動作 ================= */
async function actVisit(i){
  if(ui.busy) return;
  const p = curPlots()[i], el = plotEls[i], c = p.c && CROP[p.c], t = ui.tool;
  const growing = p.s==='grow', ripe = growing && p.g >= c.time;
  let action;
  if(t==='steal'){
    if(!ripe) return toast(growing ? `${c.name}還沒成熟，約 ${fmt(leftSec(p))} 後` : '這塊地沒有可以偷的作物');
    if(p.mine) return toast('這塊地你已經偷過了');
    if(p.st >= p.cap) return toast('這塊地已經被偷光了，留點給主人吧');
    action = 'steal';
  } else if(t==='hweed'){ if(!growing || !p.w) return toast('這裡沒有雜草'); action='help_weed'; }
  else if(t==='hbug'){ if(!growing || !p.b) return toast('這裡沒有蟲'); action='help_bug'; }
  else if(t==='pweed' || t==='pbug'){
    if(!growing || ripe) return toast('只能在還沒成熟的作物上惡作劇');
    if(S.me.prank_left < 1) return toast('今天的惡作劇次數用完了');
    if(t==='pweed' && p.w>=3) return toast('這裡的草已經夠多了');
    if(t==='pbug' && p.b>=3) return toast('這裡的蟲已經夠多了');
    action = t==='pweed' ? 'prank_weed' : 'prank_bug';
  }
  ui.busy = true;
  try{
    const r = await rpc('farm_friend_act', {p_owner:V.owner.id, p_action:action, p_idx:i});
    applyState(r.state); applyVisit(r.visit); refresh();
    if(action==='steal') floatAt(el, `偷到 ${c.name} ×${r.qty}`, '#FFE066');
    else if(action.startsWith('help')) floatAt(el, action==='help_weed'?'幫忙除草！':'幫忙除蟲！');
    else floatAt(el, action==='prank_weed'?'放了一棵草 😈':'放了一隻蟲 😈', '#FFD6E5');
    xpFloat(el, r.xp);
    if(r.lvup) setTimeout(showLevelUp, 400);
  }catch(e){ toast(e.message); }
  finally{ ui.busy = false; }
}

/* ================= 視窗：商店、倉庫、播種 ================= */
function openSeedPicker(i){
  if(mode==='visit') return;
  const own = Object.entries(S.me.seeds).filter(([,n])=>n>0);
  if(!own.length) return modal('沒有種子', `<div class="empty">倉庫裡沒有種子了，<br>先去種子商店買一些吧！</div>`, [['去商店','o',()=>openShop()]]);
  const body = own.map(([id,n])=>{ const c=CROP[id];
    return `<div class="row"><div class="ic">${iconSVG(c)}</div><div class="tx"><b>${c.name}</b> <span class="tag">×${n}</span><div>成熟 ${dur(c.time)}・收成 ${c.yield} 個</div></div><button class="mini" data-seed="${id}">${i==null?'選擇':'種下'}</button></div>`;
  }).join('');
  modal(i==null?'選擇要播的種子':'要種什麼？', body);
  $('md').querySelectorAll('[data-seed]').forEach(b=>b.onclick=()=>{
    ui.seed = b.dataset.seed; setTool('seed'); closeModal();
    if(i!=null) plant(i, ui.seed); else toast(`點空地就能種下${CROP[ui.seed].name}`);
  });
}
function openShop(){
  if(mode==='visit') return toast('回到自己的農場才能買東西');
  const me = S.me;
  const body = CROPS.map(c=>{
    const locked = me.lv < c.lv;
    const btn = locked ? `<span class="lock">Lv${c.lv} 解鎖</span>`
      : [1,5,10].map(n=>`<button class="mini ${n===1?'':'o'}" data-buy="${c.id}" data-n="${n}" ${me.gold<c.seed*n?'disabled':''}>${n===1?'買1':'×'+n}</button>`).join(' ');
    return `<div class="row" style="${locked?'opacity:.55':''}"><div class="ic">${iconSVG(c)}</div>
      <div class="tx"><b>${c.name}</b><span class="tag">${c.seed} 金</span>
      <div>成熟 ${dur(c.time)}・收成 ${c.yield}×${c.price} 金 = ${c.yield*c.price} 金</div></div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:130px">${btn}</div></div>`;
  }).join('');
  modal(`種子商店　<span style="font-size:14px;color:var(--ink2)">金幣 ${me.gold}</span>`, body);
  $('md').querySelectorAll('[data-buy]').forEach(b=>b.onclick=async()=>{
    const c = CROP[b.dataset.buy], n = +b.dataset.n;
    const r = await doAct('buy', null, c.id, n);
    if(r){ toast(`買了 ${n} 包${c.name}種子`); ui.seed = c.id; openShop(); }
  });
}
function openBag(){
  if(mode==='visit') return toast('回到自己的農場才能打開倉庫');
  const me = S.me;
  const cr = Object.entries(me.crops).filter(([,n])=>n>0);
  const sd = Object.entries(me.seeds).filter(([,n])=>n>0);
  const total = cr.reduce((a,[id,n])=>a+n*CROP[id].price, 0);
  let body = `<div class="sec">作物</div>`;
  body += cr.length ? cr.map(([id,n])=>{ const c=CROP[id];
    return `<div class="row"><div class="ic">${iconSVG(c)}</div><div class="tx"><b>${c.name}</b> <span class="tag">×${n}</span><div>每個 ${c.price} 金・共 ${n*c.price} 金</div></div>
      <button class="mini o" data-sell="${id}">全部賣出</button></div>`; }).join('')
    : `<div class="empty">還沒有收成的作物</div>`;
  body += `<div class="sec">種子</div>`;
  body += sd.length ? sd.map(([id,n])=>{ const c=CROP[id];
    return `<div class="row"><div class="ic">${iconSVG(c)}</div><div class="tx"><b>${c.name}種子</b> <span class="tag">×${n}</span><div>成熟 ${dur(c.time)}</div></div><button class="mini" data-use="${id}">拿來種</button></div>`; }).join('')
    : `<div class="empty">沒有種子</div>`;
  modal('穀倉（倉庫）', body, cr.length?[[`一鍵全部賣出（${total} 金）`,'o',async()=>{ const r=await doAct('sell_all'); if(r){ toast(`全部賣出，獲得 ${r.amt} 金`); closeModal(); } }]]:null);
  $('md').querySelectorAll('[data-sell]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.sell; const r = await doAct('sell', null, id);
    if(r){ toast(`賣出 ${CROP[id].name}，獲得 ${r.amt} 金`); openBag(); }
  });
  $('md').querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{ ui.seed=b.dataset.use; setTool('seed'); closeModal(); toast(`點空地就能種下${CROP[ui.seed].name}`); });
}

const esc = s => String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

/* ================= 好友布告欄 ================= */
let boardTab = 'friends';
function ago(ms){ const s=Math.max(0,(Date.now()+(S?S.off:0)-ms)/1000); if(s<60) return '剛剛'; if(s<3600) return `${Math.floor(s/60)} 分鐘前`; if(s<86400) return `${Math.floor(s/3600)} 小時前`; return `${Math.floor(s/86400)} 天前`; }
const LOG_TXT = {steal:(l)=>`偷走了你 ${l.qty} 個${CROP[l.crop]?.name||''}`, help_weed:(l)=>`幫你的${CROP[l.crop]?.name||'作物'}除了草`, help_bug:(l)=>`幫你的${CROP[l.crop]?.name||'作物'}除了蟲`,
  prank_weed:(l)=>`在你的${CROP[l.crop]?.name||'田'}放了一棵草 😈`, prank_bug:(l)=>`在你的${CROP[l.crop]?.name||'田'}放了一隻蟲 😈`};

async function openBoard(tab){
  if(tab) boardTab = tab;
  modal('好友布告欄', `<div class="empty">讀取中…</div>`);
  let F, logs;
  try{ [F, logs] = await Promise.all([rpc('farm_friends'), rpc('farm_logs_get')]); }
  catch(e){ return modal('好友布告欄', `<div class="empty">${esc(e.message)}</div>`); }
  const nIn = F.incoming.length;
  const tabs = `<div class="tabs">
    <button data-tab="friends" class="${boardTab==='friends'?'on':''}">好友 ${F.friends.length}</button>
    <button data-tab="add" class="${boardTab==='add'?'on':''}">加好友${nIn?` <i class="dot">${nIn}</i>`:''}</button>
    <button data-tab="logs" class="${boardTab==='logs'?'on':''}">農場動態</button></div>`;
  let body = '';
  if(boardTab==='friends'){
    body = F.friends.length ? F.friends.map(f=>`<div class="row">
        <div class="avatar sm">${esc(f.nickname.slice(0,1))}</div>
        <div class="tx"><b>${esc(f.nickname)}</b> <span class="tag">Lv${f.lv}</span>
          <div>${f.ripe?`<span style="color:var(--orange-d)">🧺 有 ${f.ripe} 塊地可以偷</span>`:'目前沒有可偷的菜'}${f.issues?`・🐛 需要幫忙 ${f.issues}`:''}</div></div>
        <button class="mini ${f.ripe?'o':''}" data-visit="${f.id}">拜訪</button></div>`).join('')
      : `<div class="empty">還沒有好友，<br>到「加好友」輸入朋友的暱稱吧！</div>`;
  } else if(boardTab==='add'){
    body = `<div class="sec">用暱稱加好友</div>
      <div style="display:flex;gap:8px;margin-top:6px"><input id="fnick" class="inp" maxlength="10" placeholder="輸入朋友的暱稱"><button class="mini" id="fsend" style="padding:0 16px">送出</button></div>
      <div style="font-size:12px;color:var(--ink2);font-weight:700;margin-top:6px">你的暱稱是「${esc(S.me.nickname)}」，把它告訴朋友吧</div>`;
    body += `<div class="sec">等你確認的邀請</div>` + (F.incoming.length ? F.incoming.map(f=>`<div class="row">
        <div class="avatar sm">${esc(f.nickname.slice(0,1))}</div><div class="tx"><b>${esc(f.nickname)}</b> <span class="tag">Lv${f.lv}</span><div>想成為你的好友</div></div>
        <button class="mini" data-acc="${f.id}">接受</button><button class="mini sub" data-rej="${f.id}">拒絕</button></div>`).join('') : `<div class="empty" style="padding:10px 0">沒有新的邀請</div>`);
    if(F.outgoing.length) body += `<div class="sec">已送出、等對方確認</div>` + F.outgoing.map(f=>`<div class="row"><div class="avatar sm">${esc(f.nickname.slice(0,1))}</div><div class="tx"><b>${esc(f.nickname)}</b><div>等待確認中</div></div></div>`).join('');
  } else {
    body = logs.length ? logs.map(l=>`<div class="row"><div class="avatar sm" style="background:${l.kind.startsWith('prank')?'#F78FB3':l.kind==='steal'?'#FF9F43':'#3BB273'}">${esc((l.who||'?').slice(0,1))}</div>
        <div class="tx"><b>${esc(l.who||'')}</b> ${(LOG_TXT[l.kind]||(()=>''))(l)}<div>${ago(l.at)}</div></div></div>`).join('')
      : `<div class="empty">還沒有任何動態</div>`;
  }
  modal('好友布告欄', tabs + body);
  const md = $('md');
  md.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openBoard(b.dataset.tab));
  md.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>visit(b.dataset.visit));
  md.querySelectorAll('[data-acc]').forEach(b=>b.onclick=async()=>{ try{ toast(await rpc('farm_friend_respond',{p_from:b.dataset.acc,p_accept:true})); openBoard(); }catch(e){ toast(e.message); } });
  md.querySelectorAll('[data-rej]').forEach(b=>b.onclick=async()=>{ try{ toast(await rpc('farm_friend_respond',{p_from:b.dataset.rej,p_accept:false})); openBoard(); }catch(e){ toast(e.message); } });
  const fs = $('fsend');
  if(fs){ const send = async()=>{ const v=$('fnick').value.trim(); if(!v) return toast('請輸入暱稱');
      try{ toast(await rpc('farm_friend_request',{p_nick:v})); openBoard(); }catch(e){ toast(e.message); } };
    fs.onclick = send; $('fnick').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); }); }
}

/* ================= 拜訪 / 回家 ================= */
async function visit(id){
  try{ applyVisit(await rpc('farm_visit', {p_owner:id})); }
  catch(e){ return toast(e.message); }
  closeModal(); mode = 'visit'; plotSig = plotSig.map(()=> '');
  buildTools(); setTool('steal'); refresh();
  $('bHome').textContent = '🏠 回我的農場';
  centerOn(...FARM_C, true);
  toast(`來到 ${V.owner.nickname} 的農場`);
}
async function goHome(){
  if(mode==='home'){ centerOn(...FARM_C, true); return; }
  mode = 'home'; V = null; plotSig = plotSig.map(()=> '');
  buildTools(); setTool('hand'); refresh();
  $('bHome').textContent = '🌾 回到農田';
  centerOn(...FARM_C, true);
  sync();
}

function tapBuilding(g){
  g.classList.remove('hit'); void g.getBBox(); g.classList.add('hit');
  const id = g.dataset.b;
  if(id==='board') return openBoard();
  if(mode==='visit' && ['shop','barn','home'].includes(id)) return toast('回到自己的農場才能使用');
  if(id==='shop') return openShop();
  if(id==='barn') return openBag();
  if(id==='home') return openHome();
  const o = BLD.find(b=>b.id===id); if(o && o.locked) toast(o.locked);
}

function buildTools(){
  const list = mode==='visit' ? TOOLS_VISIT : TOOLS;
  $('tools').style.gridTemplateColumns = `repeat(${list.length},1fr)`;
  $('tools').innerHTML = list.map(([k,n])=>`<button class="tool" data-tool="${k}">${ICONS[k]}<span>${n}</span>${k==='seed'?'<span class="badge" id="seedBadge"></span>':''}${k==='pweed'?'<span class="badge" id="prankBadge"></span>':''}</button>`).join('');
  $('tools').querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
    if(b.dataset.tool==='seed') return openSeedPicker(null);
    setTool(b.dataset.tool);
  });
}
function setTool(t){ ui.tool=t; document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on', b.dataset.tool===t)); }

function renderPlots(){
  if(!S) return;
  const P = curPlots();
  P.forEach(p=>{
    const i = p.i, el = plotEls[i]; if(!el) return;
    const st = p.s==='grow' ? stageOf(p) : -1;
    const sig = [mode, p.s, p.c, st, p.w, p.b, p.dry].join('|');
    if(sig !== plotSig[i]){ el.querySelector('.pg').innerHTML = plotGroundSVG(p,i); el.querySelector('.ps').innerHTML = plotSpriteSVG(p,i); plotSig[i] = sig; }
    el.classList.toggle('ripe', st===4);
    const L = plotLabs[i], t = L.querySelector('text'), r = L.querySelector('rect'), bb = L.querySelector('.bb'), bf = L.querySelector('.bf');
    L.style.display = (p.s==='wild'||p.s==='empty') ? 'none' : '';
    let txt='', pct=-1, bg='#fff', fg='#3A3226';
    if(p.s==='dead'){ txt = mode==='visit' ? '已收成' : '枯萎・點我剷除'; bg='#E8DCC8'; }
    else if(p.s==='grow'){ const c = CROP[p.c];
      if(st===4){
        if(mode==='visit'){
          if(p.mine){ txt='你偷過了'; bg='#E8DCC8'; }
          else if(p.st >= p.cap){ txt='被偷光了'; bg='#E8DCC8'; }
          else { txt=`${c.name} 可以偷！`; bg='#F2545B'; fg='#fff'; }
        } else { txt=`${c.name} 可收成！`; bg='#FF9F43'; fg='#fff'; }
      } else { txt = `${c.name} ${fmt(leftSec(p))}`; pct = p.g/c.time; if(p.dry) bg='#DDF0FF'; }
    }
    if(t.textContent !== txt) t.textContent = txt;
    r.setAttribute('fill', bg); t.setAttribute('fill', fg); t.setAttribute('y', pct>=0?3:5);
    bb.style.display = bf.style.display = pct>=0 ? '' : 'none';
    if(pct>=0) bf.setAttribute('width', (64*pct).toFixed(1));
  });
}
function renderHUD(){
  if(!S) return;
  const me = S.me;
  $('pname').textContent = me.nickname; $('avatar').textContent = me.nickname.slice(0,1);
  $('plv').textContent = 'Lv'+me.lv; $('pgold').textContent = me.gold.toLocaleString();
  const need = needExp(me.lv);
  $('pexp').style.width = (me.lv>=MAX_LV?100:Math.min(100, me.exp/need*100))+'%';
  $('pexpt').textContent = me.lv>=MAX_LV ? 'MAX' : `${me.exp}/${need}`;
  const n = Object.values(me.seeds).reduce((a,b)=>a+b,0);
  const bd = $('seedBadge'); if(bd){ bd.textContent=n; bd.style.display=n?'':'none'; }
  const pb = $('prankBadge'); if(pb){ pb.textContent=me.prank_left; }
  const PL = curPlots(); let h;
  if(mode==='visit'){
    const can = PL.filter(p=>p.s==='grow' && p.g>=CROP[p.c].time && !p.mine && p.st<p.cap).length;
    h = `你在 <b>${esc(V.owner.nickname)}</b>（Lv${V.owner.lv}）的農場・` + (can ? `有 <b>${can}</b> 塊地可以偷！` : `今天惡作劇還剩 ${me.prank_left} 次`);
    $('hint').innerHTML = `<span>🧺</span><span>${h}</span>`; return;
  }
  if(PL.some(p=>p.s==='grow'&&stageOf(p)===4)) h='有作物<b>成熟</b>了，快收成，小心被好友偷走！';
  else if(PL.some(p=>p.s==='grow'&&(p.w||p.b))) h='田裡長了<b>雜草或蟲</b>，不處理會減少收成';
  else if(PL.some(isDry)) h='有田地<b>缺水</b>了，澆水才能長得快';
  else if(PL.some(p=>p.s==='dead')) h='收成後的枯萎作物，用<b>鏟子</b>剷除就能再種';
  else if(PL.some(p=>p.s==='empty')) h = n?'點<b>空地</b>選種子種下去吧':'沒有種子了，點<b>種子商店</b>買一些吧';
  else h='作物正在長大中…去<b>好友布告欄</b>看看誰的菜可以偷';
  $('hint').innerHTML = `<span>🌱</span><span>${h}</span>`;
}
function refresh(){ renderPlots(); renderHUD(); }

/* ================= 同步 ================= */
let syncing = false;
async function sync(){
  if(!S || syncing || document.hidden) return;
  syncing = true;
  try{
    if(mode==='visit' && V) applyVisit(await rpc('farm_visit', {p_owner:V.owner.id}));
    else { const st = await rpc('farm_me'); if(st) applyState(st); }
    refresh();
  }catch(e){ if(/還不是好友/.test(e.message)){ toast(e.message); goHome(); } }
  finally{ syncing = false; }
}
setInterval(()=>{ if(S && $('map').style.display!=='none'){ renderPlots(); renderHUD(); } }, 1000);
setInterval(sync, 15000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) sync(); });

/* ================= 登入流程 ================= */
let authMode = 'login';
function showScreen(which){
  $('login').style.display = (which==='login'||which==='nick') ? 'flex' : 'none';
  $('loginCard').style.display = which==='login' ? '' : 'none';
  $('nickCard').style.display = which==='nick' ? '' : 'none';
  ['map','hud','dock'].forEach(k=>$(k).style.display = which==='game' ? '' : 'none');
}
function setAuthMode(m){
  authMode = m;
  document.querySelectorAll('[data-am]').forEach(b=>b.classList.toggle('on', b.dataset.am===m));
  $('authBtn').textContent = m==='login' ? '登入' : '註冊新帳號';
  $('pw2').style.display = m==='signup' ? '' : 'none';
  $('authMsg').textContent = '';
}
function authMsg(t, ok){ const m=$('authMsg'); m.textContent=t; m.style.color = ok?'var(--green-d)':'var(--red)'; }

async function doAuth(){
  const email = $('email').value.trim(), pw = $('pw').value;
  if(!email || !pw) return authMsg('請輸入 Email 和密碼');
  const btn = $('authBtn'); btn.disabled = true;
  try{
    if(authMode==='signup'){
      if(pw.length < 6) return authMsg('密碼至少要 6 個字');
      if(pw !== $('pw2').value) return authMsg('兩次輸入的密碼不一樣');
      const {data, error} = await sb.auth.signUp({email, password:pw, options:{emailRedirectTo:SITE_URL}});
      if(error) return authMsg(zhErr(error.message));
      if(data.user && data.user.identities && data.user.identities.length===0) return authMsg('這個 Email 已經註冊過了，請直接登入');
      if(!data.session) return authMsg(`驗證信已寄到 ${email}，請點信中的連結完成註冊`, true);
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password:pw});
      if(error) return authMsg(zhErr(error.message));
    }
  } finally { btn.disabled = false; }
}
async function forgotPw(){
  const email = $('email').value.trim();
  if(!email) return authMsg('請先在上面輸入你的 Email');
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo:SITE_URL});
  if(error) return authMsg(zhErr(error.message));
  authMsg(`重設密碼的信已寄到 ${email}`, true);
}
function showResetPw(){
  modal('設定新密碼', `<input id="npw" class="inp" type="password" placeholder="新密碼（至少 6 個字）" style="width:100%">`,
    [['確定','',async()=>{ const v=$('npw').value; if(v.length<6) return toast('密碼至少要 6 個字');
      const {error} = await sb.auth.updateUser({password:v}); if(error) return toast(zhErr(error.message)); closeModal(); toast('密碼已更新'); }]]);
}
async function createNick(){
  const v = $('nickIn').value.trim(); if(!v) return toast('請輸入暱稱');
  try{ const st = await rpc('farm_create', {p_nick:v}); startGame(st); }
  catch(e){ toast(e.message); }
}

let built = false, entering = false;
async function enterGame(){
  if(entering) return; entering = true;
  try{
    const st = await rpc('farm_me');
    if(!st){ showScreen('nick'); setTimeout(()=>$('nickIn').focus(), 50); return; }
    startGame(st);
  }catch(e){ toast(e.message); showScreen('login'); }
  finally{ entering = false; }
}
function startGame(st){
  applyState(st); mode = 'home'; V = null;
  showScreen('game');
  if(!built){ buildWorld(); requestAnimationFrame(animate); built = true; }
  plotSig = plotSig.map(()=> '');
  buildTools(); layout(); setTool('hand'); refresh();
  $('bHome').textContent = '🌾 回到農田';
  requestAnimationFrame(()=>centerOn(...FARM_C));
  toast(`歡迎回到小鎮，${S.me.nickname}！`);
}

$('authBtn').onclick = doAuth;
$('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') doAuth(); });
$('pw2').addEventListener('keydown', e=>{ if(e.key==='Enter') doAuth(); });
document.querySelectorAll('[data-am]').forEach(b=>b.onclick=()=>setAuthMode(b.dataset.am));
$('forgot').onclick = forgotPw;
$('gBtn').onclick = async()=>{
  if(!GOOGLE_ON) return authMsg('Google 登入正在設定中，請先用 Email 註冊');
  const {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo:SITE_URL}});
  if(error) authMsg(zhErr(error.message));
};
if(!GOOGLE_ON) $('gBtn').classList.add('off');
$('nickBtn').onclick = createNick;
$('nickIn').addEventListener('keydown', e=>{ if(e.key==='Enter') createNick(); });
$('nickOut').onclick = ()=>sb.auth.signOut();
$('bHome').onclick = goHome;

sb.auth.onAuthStateChange((ev, session)=>{
  if(ev==='PASSWORD_RECOVERY'){ setTimeout(showResetPw, 300); }
  if(session && (ev==='SIGNED_IN' || ev==='INITIAL_SESSION') && !S) setTimeout(enterGame, 0);
  if(ev==='SIGNED_OUT'){ S=null; V=null; mode='home'; showScreen('login'); setAuthMode('login'); }
  if(ev==='INITIAL_SESSION' && !session) showScreen('login');
});
setAuthMode('login');

</script>
</body>
