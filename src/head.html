<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>一起種田吧</title>
<meta name="description" content="開心農場風格的小鎮種田遊戲：種菜、收成、加好友、偷菜！">
<meta name="theme-color" content="#3BB273">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="一起種田吧">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="一起種田吧">
<meta property="og:description" content="開心農場風格的小鎮種田遊戲：種菜、收成、加好友、偷菜！">
<meta property="og:image" content="https://kojay301644.github.io/farm-together/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3A3226; --ink2:#7A6E5D; --card:#FFFFFF; --line:#EFE6D8;
  --green:#3BB273; --green-d:#2E9660; --orange:#FF9F43; --orange-d:#F0851A;
  --gold:#FFC93C; --sky1:#AEE1FF; --sky2:#E8F7FF; --grass:#8ACB5B; --grass-d:#6DB548;
  --red:#F2545B; --blue:#3DA5F4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:#8fcdfb;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}

/* 地圖 */
#map{position:fixed;inset:0;overflow:auto;scrollbar-width:none;cursor:grab}
#map::-webkit-scrollbar{display:none}
#map.drag{cursor:grabbing}
#world{display:block}
.tap{cursor:pointer}
.tap.hit{animation:hit .25s ease-out}
@keyframes hit{50%{transform:translateY(-4px)}}
.tap.hit{transform-box:fill-box;transform-origin:center bottom}
.ripe .crop{animation:bob 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{50%{transform:translateY(-2px) scale(1.04)}}
.spark{animation:tw 1.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.blades{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
.flow{stroke-dasharray:14 22;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.wave{animation:wave 3s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(4px);opacity:.5}}
.walk .lg1{animation:lg 0.5s ease-in-out infinite}
.walk .lg2{animation:lg 0.5s ease-in-out infinite reverse}
@keyframes lg{50%{transform:translateY(-2px)}}
.walk .bd{animation:bdy .5s ease-in-out infinite}
@keyframes bdy{50%{transform:translateY(-1px)}}
.smoke{animation:smk 3s ease-out infinite}
@keyframes smk{from{transform:translateY(0);opacity:.8}to{transform:translateY(-26px);opacity:0}}
.plab{pointer-events:none}

/* 上方資訊 */
.hud{position:fixed;left:0;right:0;top:0;z-index:20;padding:10px 10px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.top{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.96);border-radius:20px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;flex:none}
.who{flex:1;min-width:0}
.who .nm{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:700}
.lvtag{background:var(--green);color:#fff;border-radius:8px;padding:0 7px;font-weight:900}
.bar{flex:1;height:8px;background:#EEF2E6;border-radius:8px;overflow:hidden;max-width:160px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7ED957,var(--green));border-radius:8px;transition:width .4s}
.gold{display:flex;align-items:center;gap:6px;background:#FFF6DB;border-radius:14px;padding:6px 12px;font-weight:900;font-size:16px}
.coin{width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -2px 0 #E8A919;display:inline-block;position:relative}
.coin:after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid #E8A919}
.hint{max-width:720px;margin:8px auto 0;background:rgba(255,255,255,.92);border-radius:14px;padding:7px 12px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.hint b{color:var(--green-d)}

/* 工具列 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.dock-in{max-width:720px;margin:0 auto;background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 -2px 14px rgba(0,0,0,.1),0 4px 0 rgba(0,0,0,.08);padding:8px;pointer-events:auto}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tool{background:#F6F1E8;border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;color:var(--ink2);position:relative}
.tool svg{width:30px;height:30px}
.tool.on{background:#E3F6EA;color:var(--green-d);box-shadow:inset 0 0 0 2px var(--green)}
.tool .badge{position:absolute;top:2px;right:4px;background:var(--orange);color:#fff;border-radius:8px;font-size:10px;padding:0 5px}
.home{max-width:720px;margin:0 auto 8px;display:flex;justify-content:flex-end;pointer-events:none}
.home button{pointer-events:auto;background:#fff;border-radius:16px;padding:7px 12px;font-weight:900;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.1);display:flex;align-items:center;gap:4px}

/* 視窗 */
.ov{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:8px}
.ov.show{display:flex}
@media(min-width:560px){.ov{align-items:center}}
.md{position:relative;background:var(--card);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(20px);opacity:0}}
.md h3{margin:0;padding:16px 18px 10px;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:space-between}
.md .x{background:#F3EEE5;width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:900}
.md .bd{padding:0 18px 12px;overflow:auto;zoom:1.1}
.md h3{font-size:21px}
.mmore{position:absolute;left:50%;bottom:14px;transform:translate(-50%,10px);z-index:3;border:0;border-radius:999px;background:#3BB273;color:#fff;font-weight:900;font-size:14px;padding:7px 16px;box-shadow:0 4px 0 #2A8E57,0 6px 14px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.25s;animation:mmb 1.4s ease-in-out infinite}
.mmore.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.md:has(.ft) .mmore{bottom:78px}
.md.hasmore .bd{-webkit-mask-image:linear-gradient(#000 calc(100% - 46px),transparent);mask-image:linear-gradient(#000 calc(100% - 46px),transparent)}
@keyframes mmb{0%,100%{margin-bottom:0}50%{margin-bottom:5px}}
.md .ft{padding:10px 18px 16px;display:flex;gap:8px}
.btn{flex:1;background:var(--green);color:#fff;font-weight:900;font-size:15px;padding:11px;border-radius:14px;box-shadow:0 3px 0 var(--green-d)}
.btn.sub{background:#EFE9DF;color:var(--ink);box-shadow:0 3px 0 #DDD3C3}
.btn.o{background:var(--orange);box-shadow:0 3px 0 var(--orange-d)}
.btn.r{background:var(--red);box-shadow:0 3px 0 #C93D44}
.btn:disabled,.mini:disabled{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:54px;height:46px;flex:none;background:#F4F9EC;border-radius:12px}
.row .ic svg{width:100%;height:100%}
.row .tx{flex:1;min-width:0}
.row .tx b{font-size:15px}
.row .tx div{font-size:12px;color:var(--ink2);font-weight:700}
.mini{background:var(--green);color:#fff;font-weight:900;font-size:13px;padding:7px 10px;border-radius:10px;box-shadow:0 2px 0 var(--green-d);white-space:nowrap}
.mini.o{background:var(--orange);box-shadow:0 2px 0 var(--orange-d)}
.lock{font-size:12px;font-weight:900;color:#B0A592;background:#F3EEE5;border-radius:10px;padding:6px 10px}
.tag{display:inline-block;background:#FFF1DC;color:var(--orange-d);border-radius:6px;padding:0 6px;font-size:11px;font-weight:900;margin-left:4px}
.sec{font-size:13px;font-weight:900;color:var(--ink2);margin:12px 0 2px}
.empty{color:var(--ink2);text-align:center;padding:22px 0;font-weight:700;font-size:14px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:#F3EEE5;border-radius:10px;padding:8px 0;font-weight:900}
.seg button.on{background:var(--green);color:#fff}

.toast{position:fixed;left:50%;top:120px;transform:translateX(-50%);background:rgba(58,50,38,.92);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.fl{position:fixed;z-index:70;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:up 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes up{to{transform:translate(-50%,-46px);opacity:0}}

/* 登入 */
.login{position:fixed;inset:0;z-index:100;background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--grass) 55%);display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{background:#fff;border-radius:28px;padding:26px 22px;width:100%;max-width:380px;text-align:center;box-shadow:0 6px 0 var(--line)}
.logo{font-size:34px;font-weight:900;color:var(--green-d);letter-spacing:2px;margin:6px 0 2px}
.logo span{color:var(--orange)}
.login p{color:var(--ink2);font-weight:700;font-size:13px;margin:4px 0 16px}
.login input{width:100%;font-family:inherit;font-size:17px;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--line);outline:none;text-align:center;margin-bottom:12px;color:var(--ink)}
.login input:focus{border-color:var(--green)}
.login input{margin-bottom:10px}
.amsg{font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
.link{background:none;color:var(--ink2);font-weight:700;font-size:13px;text-decoration:underline;margin-top:6px}
.or{display:flex;align-items:center;gap:10px;color:#B0A592;font-size:12px;font-weight:700;margin:12px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;font-weight:900;font-size:15px}
.gbtn.off{opacity:.5}
.tabs{display:flex;gap:6px;margin-bottom:6px;position:sticky;top:0;background:#fff;padding-bottom:6px;z-index:1}
.tabs button{flex:1;background:#F3EEE5;border-radius:10px;padding:8px 0;font-weight:900;font-size:13px}
.tabs button.on{background:var(--green);color:#fff}
.rk .rkn{width:26px;text-align:center;font-weight:900;font-size:16px;color:var(--ink2);flex:none}
.rk.mine{background:#F4FBEF;border-radius:12px;padding-left:6px;padding-right:6px}
.myrank{margin-top:10px;background:#FFF6DB;border-radius:12px;padding:10px;text-align:center;font-weight:700;font-size:13px}
.myrank b{color:var(--orange-d);font-size:16px}
.cur{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.cur .gold{padding:3px 10px;font-size:14px}
.gem{background:#EEEBFF;cursor:pointer}
.gemcard{border:2px solid #E6E1FF;border-radius:14px;padding:10px;text-align:center;position:relative}
.gemcard b{font-size:18px;color:#5B4ED6}
.gemcard .price{font-weight:900;margin-top:4px}
.gemcard .bonus{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:900;border-radius:8px;padding:1px 6px}
.gemgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.soon{background:#FFF6DB;border-radius:12px;padding:10px;font-size:13px;font-weight:700;text-align:center;margin:6px 0 10px}
.homebtns{display:flex;gap:8px;margin-top:10px}
.plink{color:var(--ink2);font-size:12px;font-weight:700}
.help h4{margin:14px 0 4px;font-size:15px}
.help p,.help li{font-size:13px;font-weight:500;line-height:1.75;color:var(--ink);margin:2px 0}
.help ul{margin:2px 0;padding-left:20px}
.urlbox{margin-top:12px;background:#F3EEE5;border-radius:10px;padding:8px;font-size:12px;font-weight:700;text-align:center;word-break:break-all;user-select:text;-webkit-user-select:text}
.tut{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));z-index:30;padding:0 12px;pointer-events:none}
.tutin{max-width:520px;margin:0 auto;background:#3A3226;color:#fff;border-radius:18px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.6;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:auto}
.tutin b{color:#FFE066}
.tutn{display:inline-block;background:var(--orange);border-radius:8px;padding:0 7px;font-size:11px;margin-right:6px;vertical-align:1px}
.tutbtns{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.tutarrow{position:fixed;z-index:31;font-size:34px;transform:translate(-50%,-100%);pointer-events:none;animation:tbounce .8s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
@keyframes tbounce{50%{transform:translate(-50%,calc(-100% - 10px))}}
.dot{font-style:normal;background:var(--red);color:#fff;border-radius:8px;padding:0 6px;font-size:11px}
.avatar.sm{width:40px;height:40px;font-size:16px;flex:none}
.mini.sub{background:#EFE9DF;color:var(--ink);box-shadow:0 2px 0 #DDD3C3}
.inp{flex:1;font-family:inherit;font-size:15px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);outline:none;color:var(--ink);min-width:0}
.inp:focus{border-color:var(--green)}

/* ===== 手繪風升級：動畫與特效 ===== */
.sway{animation:sway 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-2.2deg) skewX(1.5deg)}50%{transform:rotate(2.2deg) skewX(-1.5deg)}}
.wsway{animation:sway 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.tsway{animation:tsway 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes tsway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.tuft{animation:sway 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.crawl{animation:crawl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes crawl{0%,100%{transform:translateX(-2px) scaleX(1)}50%{transform:translateX(3px) scaleX(.9)}}
.crawl .seg{animation:segbob .5s ease-in-out infinite;transform-box:fill-box}
@keyframes segbob{50%{transform:translateY(-1.2px)}}
.drip{animation:drip 1.4s ease-in-out infinite;transform-box:fill-box}
@keyframes drip{50%{transform:translateY(-3px)}}
.hop{animation:hop .45s ease-in-out infinite paused;transform-box:fill-box;transform-origin:50% 100%}
.walk .hop{animation-play-state:running}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-6px) scale(.96,1.04)}80%{transform:translateY(0) scale(1.05,.95)}}
.bfly{animation:flap .25s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes flap{50%{transform:scaleX(.35)}}
.floaty{animation:floaty 3.5s ease-in-out infinite}
.sunrays{animation:spin 160s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes floaty{50%{transform:translateY(-8px)}}
.bird{animation:bird 38s linear infinite}
@keyframes bird{from{transform:translateX(-200px)}to{transform:translateX(1600px)}}
.lampglow{opacity:0;transition:opacity 1.5s;pointer-events:none}
body.night .lampglow{opacity:1;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.75}}
#tint{position:fixed;inset:0;z-index:6;pointer-events:none;mix-blend-mode:multiply;transition:background 2s}
body.lowfx .sway,body.lowfx .wsway,body.lowfx .tsway,body.lowfx .tuft,body.lowfx .crawl,body.lowfx .crawl .seg,body.lowfx .wave,body.lowfx .flow,body.lowfx .bird,body.lowfx .floaty,body.lowfx .cloud{animation:none!important}
body.lowfx .bird{display:none}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.fxp{position:fixed;pointer-events:none;will-change:transform,opacity}
.fxp.can{animation:can 1.1s ease-in-out forwards;transform-origin:20% 80%}
@keyframes can{0%{opacity:0;transform:translateY(-10px) rotate(0)}15%{opacity:1}30%,75%{transform:rotate(-38deg)}100%{opacity:0;transform:rotate(-10deg) translateY(-6px)}}
.fxp.drop{width:5px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#5BC2F5;border:1.2px solid #2D7FB0;animation:drop .7s ease-in forwards;opacity:0}
@keyframes drop{0%{opacity:1;transform:translateY(0)}100%{opacity:.2;transform:translateY(46px)}}
.fxp.ripple{width:16px;height:7px;border-radius:50%;border:2px solid #9BDCF8;opacity:0;animation:ripple .7s ease-out forwards}
@keyframes ripple{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
.fxp.seed{width:7px;height:9px;border-radius:50%;background:#E9C77B;border:1.3px solid #4B3423;animation:seed .55s cubic-bezier(.3,0,.7,1) forwards}
@keyframes seed{0%{transform:translate(0,0)}50%{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.1 - 30px))}100%{transform:translate(var(--dx),var(--dy));opacity:.3}}
.fxp.dirt{width:9px;height:9px;border-radius:50%;background:#8B5E3C;border:1.3px solid #4B3423;animation:burst .6s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.fxp.leaf{font-size:15px;animation:burst .8s ease-out forwards}
.fxp.star{color:#FFE066;font-size:16px;text-shadow:0 0 2px #4B3423;animation:burst .7s ease-out forwards}
.fxp.fly svg{width:54px;height:40px}
.fxp.fly{animation:fly 1.1s cubic-bezier(.5,-0.3,.6,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.6)}25%{transform:translate(0,-34px) scale(1.15)}100%{transform:translate(var(--tx),var(--ty)) scale(.35);opacity:.2}}
.fxp.grab{animation:grab .9s ease-in-out forwards}
@keyframes grab{0%{transform:translateY(-30px);opacity:0}35%{transform:translateY(18px);opacity:1}55%{transform:translateY(18px) rotate(-10deg)}100%{transform:translateY(-50px);opacity:0}}
.fxp.smoke2{width:22px;height:22px;border-radius:50%;background:#B58CE8;border:2px solid #6B4BA0;opacity:0;animation:smk2 1s ease-out forwards}
@keyframes smk2{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:translateY(-36px) scale(1.8)}}
.fxp.pop{animation:popup 1s ease-out forwards}
@keyframes popup{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.2);opacity:1}100%{transform:translateY(-24px) scale(1);opacity:0}}
.fxp.conf{width:8px;height:12px;border-radius:2px;animation:conf 2s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.bump{animation:bumpk .6s ease-out}
@keyframes bumpk{30%{transform:scale(1.12)}}
/* 讀取畫面 */
#loader{position:fixed;inset:0;z-index:200;background:linear-gradient(#AEE1FF,#E8F7FF 60%,#9BD36A 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
#loader .lg{font-size:30px;font-weight:900;color:#2E9660;letter-spacing:2px}
#loader .lb{width:200px;height:12px;border-radius:6px;background:#fff;border:2px solid #4B3423;overflow:hidden}
#loader .lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ED957,#3BB273);transition:width .2s}
#loader .sp{width:70px;height:70px;animation:hop .6s ease-in-out infinite}

.twk{animation:twk 3s ease-in-out infinite}@keyframes twk{50%{opacity:.25}}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}body.lowfx .bob{animation:none}
.ticker{margin:6px auto 0;max-width:560px;height:24px;overflow:hidden;position:relative;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker:empty,.ticker.off{display:none}
.tk{position:absolute;white-space:nowrap;top:2px;left:0;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 6px rgba(0,0,0,.35);will-change:transform}
.tk b{color:#FFE27A}.tk .sep{opacity:.6;margin:0 14px}

#gemBox{cursor:pointer;pointer-events:auto}.gplus{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:5px;border-radius:50%;background:#7B6CF6;color:#fff;font-style:normal;font-weight:900;font-size:15px;line-height:1;box-shadow:0 2px 0 #5B4ED6}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.eqpick{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid rgba(75,52,35,.2);border-radius:12px;background:#FFF8EC;font-family:inherit;cursor:pointer}.eqpick:active{transform:scale(.97)}.eqpick img{width:52px;height:52px;object-fit:contain}.eqpick b{font-size:13px;color:var(--ink)}.eqpick small{font-size:10px;font-weight:700;color:var(--ink2)}
.redeem{display:flex;gap:8px;margin-top:6px}.redeem input{flex:1;min-width:0;padding:10px 12px;border:2px solid rgba(75,52,35,.25);border-radius:12px;font:inherit;font-weight:800;text-transform:uppercase}
.gift{border:2px solid rgba(75,52,35,.15);border-radius:14px;padding:10px 12px;margin:8px 0;background:#FFF8EC}.gift p{margin:4px 0;font-size:13px;font-weight:700;color:var(--ink2)}.gift .btn{width:100%;margin-top:8px}
.rwbox{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}.rw{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:#fff;border:1.5px solid rgba(75,52,35,.15);font-size:13px;font-weight:800}.rw img{width:20px;height:20px;object-fit:contain}

.prow .pslot{min-height:108px;padding:6px 3px 5px}.prow .pslot img.pb{height:52px}.prow .pslot .pg{font-size:11px;padding:2px 3px;gap:2px}.prow .pslot .pg img{width:18px;height:18px}
.autobar{margin:4px 0 6px;padding:8px 10px;border-radius:12px;background:#EEF6FF;border:2px solid #9CC6F0;font-size:13px;font-weight:800;color:#2F5D8A;line-height:1.5}.autobar small{font-size:11px;font-weight:700;color:#4E6E8E}.autobar.done{background:#E8F8EE;border-color:#7FD3A5;color:#2E9660}
.prow .pslot .pg span{white-space:nowrap}
.tps{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}.tp{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 3px;border-radius:6px;background:#EEE8DD;color:#9A8C78;font-size:10px;font-weight:900}.tp.on{background:#F4B740;color:#fff}
.gnext{color:#2E9660}.tprs{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.tpr{font-size:10px;font-weight:800;color:#9A8C78;background:#F6F1E8;border-radius:6px;padding:1px 5px}.tpr.on{color:#B07A10;background:#FFF1D0;text-decoration:line-through}
.row.gshop .mini{line-height:1.25;min-width:72px}
.achs{display:grid;gap:5px;margin-top:4px}.ach{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:#FFF8EC;border:1.5px solid #EADBC2;font-size:13px}.ach span{font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap}.ach.done{background:#E8F8EE;border-color:#9ED9B7}
</style>
</head>
